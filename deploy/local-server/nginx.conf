# 오성철강 스마트 ERP 2.0 - 로컬(192.168.0.9) 정적 호스팅용 nginx 설정
#
# vercel.json의 rewrite 규칙을 그대로 재현합니다:
#   /portal, /portal/*      -> portal.html
#   /separator, /separator/*-> separator.html
#   그 외                    -> index.html (React Router 클라이언트 라우팅 대응)
#
# 사용법:
#   1) nginx for Windows 설치 (https://nginx.org/en/download.html)
#   2) 이 파일을 nginx conf.d 폴더 아래 ohsung-system.conf 로 복사
#   3) root 경로를 실제 저장소의 dist 폴더 절대경로로 수정
#   4) nginx -t 로 문법 확인 후 nginx -s reload (또는 서비스 재시작)

server {
    listen 8080;
    server_name _;

    # ↓↓↓ 실제 클론 위치에 맞게 수정하세요 (예: C:/ohsung-system/dist -> C:/ohsung-system/dist)
    root C:/ohsung-system/dist;
    index index.html;

    # 정적 자산: 해시가 붙은 파일이라 장기 캐시해도 안전 (vite build 산출물)
    location /assets/ {
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # 고객사 포털
    location = /portal {
        try_files /portal.html =404;
    }
    location /portal/ {
        try_files /portal.html =404;
    }

    # 슬리터2 세퍼레이터 키오스크
    location = /separator {
        try_files /separator.html =404;
    }
    location /separator/ {
        try_files /separator.html =404;
    }

    # public/ 아래 정적 파일(warehouse-3d.html 등)은 그대로 서빙
    # 나머지는 전부 메인 앱(index.html)로 - React Router 클라이언트 라우팅 지원
    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
}
