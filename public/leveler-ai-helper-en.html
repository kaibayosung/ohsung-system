<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Leveler AI Helper (English) · Ohsung Steel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&family=IBM+Plex+Mono:wght@500;600;700&display=swap" rel="stylesheet">
<style>
html,body{margin:0;height:100%;background:#FFFFFF;overflow:hidden}
#stage{position:absolute;left:50%;top:50%;width:1280px;height:800px;transform-origin:center center}

</style>
</head>
<body>
<!-- Mockup for field test (sample data only). Source: 레벨링 통합 대시보드 목업 / Helper.dc.html -->
<div id="stage"></div>

<template id="tpl">
<div style="width: 1280px; height: 800px; box-sizing: border-box; background: #FFFFFF; color: #0B1626; font-family: 'Noto Sans KR', system-ui, sans-serif; display: flex; flex-direction: column; position: relative; overflow: hidden; border: {{frame}}">

<!-- TOP BAR -->
<div style="height: 92px; flex: 0 0 92px; display: flex; align-items: center; gap: 18px; padding: 0 24px; background: {{barBg}}; color: #FFFFFF; box-sizing: border-box">
<b style="font-size: 40px; font-weight: 900; white-space: nowrap"><span style="font-size: 32px; color: #AFC0D6; margin-right: 12px">{{stepNo}}/6</span>{{stepName}}</b>
<div style="display: flex; gap: 10px; align-items: center; margin-left: 14px">
<sc-for list="{{dots}}" as="d" hint-placeholder-count="6">
<button type="button" onClick="{{d.go}}" aria-label="{{d.label}}" style="width: {{d.w}}px; height: 22px; border-radius: 11px; border: 0; padding: 0; background: {{d.c}}; cursor: pointer"></button>
</sc-for>
</div>
<button type="button" onClick="{{openNotes}}" style="margin-left: auto; height: 66px; padding: 0 24px; border-radius: 14px; border: 0; background: {{notesBtnBg}}; color: #0B1626; font-size: 32px; font-weight: 900; font-family: inherit; cursor: pointer; white-space: nowrap">{{t.notes}}{{notesBadge}}</button>
<button type="button" onClick="{{toggleLang}}" style="height: 66px; padding: 0 18px; border-radius: 14px; border: 2px solid #6F86A6; background: transparent; color: #FFFFFF; font-size: 28px; font-weight: 700; font-family: inherit; cursor: pointer">{{t.langBtn}}</button>
</div>

<!-- BODY -->
<div style="flex: 1 1 auto; min-height: 0; padding: 18px 28px; box-sizing: border-box; display: flex; flex-direction: column; gap: 16px">

<!-- STEP 1 : COIL -->
<sc-if value="{{is1}}" hint-placeholder-val="{{ true }}">
<b style="font-size: 52px; font-weight: 900; line-height: 1.2">{{t.s1Title}}</b>
<div style="display: flex; gap: 18px; flex: 1 1 auto; min-height: 0">
<sc-for list="{{coils}}" as="c" hint-placeholder-count="3">
<button type="button" onClick="{{c.pick}}" style="flex: 1 1 0; background: {{c.bg}}; border: 4px solid {{c.bd}}; border-radius: 24px; padding: 20px 26px; color: #0B1626; text-align: left; display: flex; flex-direction: column; gap: 10px; font-family: inherit; cursor: pointer">
<span style="font-size: 32px; font-weight: 700; color: #4A5568">{{c.cust}}</span>
<b style="font-size: 66px; line-height: 1.05; font-family: 'IBM Plex Mono', monospace">{{c.short}}</b>
<b style="font-size: 46px; font-weight: 900; white-space: nowrap">{{c.spec}}</b>
<span style="font-size: 32px; color: #4A5568">{{c.boxes}}</span>
<span style="margin-top: auto; font-size: 34px; font-weight: 900; color: {{c.stC}}">{{c.st}}</span>
</button>
</sc-for>
</div>
</sc-if>

<!-- STEP 2 : BOX -->
<sc-if value="{{is2}}" hint-placeholder-val="{{ false }}">
<b style="font-size: 52px; font-weight: 900; line-height: 1.2">{{t.s2Title}}</b>
<div style="display: flex; gap: 18px; flex: 1 1 auto; min-height: 0">
<sc-for list="{{boxes}}" as="b" hint-placeholder-count="4">
<button type="button" onClick="{{b.pick}}" style="flex: 1 1 0; background: {{b.bg}}; border: 4px solid {{b.bd}}; border-radius: 24px; color: #0B1626; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; font-family: inherit; cursor: pointer">
<b style="font-size: 170px; line-height: 1; font-family: 'IBM Plex Mono', monospace">{{b.no}}</b>
<span style="font-size: 44px; font-weight: 900; color: {{b.stC}}; white-space: nowrap">{{b.st}}</span>
</button>
</sc-for>
</div>
</sc-if>

<!-- STEP 3 : ORDER -->
<sc-if value="{{is3}}" hint-placeholder-val="{{ false }}">
<b style="font-size: 52px; font-weight: 900; line-height: 1.2">{{t.s3Title}}</b>
<div style="display: flex; gap: 18px; flex: 1 1 auto; min-height: 0">
<div style="flex: 1.1 1 0; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px">
<sc-for list="{{orderChecks}}" as="o" hint-placeholder-count="4">
<button type="button" onClick="{{o.toggle}}" style="background: {{o.bg}}; border: 4px solid {{o.bd}}; border-radius: 24px; padding: 16px 22px; color: #0B1626; text-align: left; display: flex; flex-direction: column; justify-content: center; gap: 4px; font-family: inherit; cursor: pointer; min-width: 0">
<span style="font-size: 32px; font-weight: 700; color: {{o.kc}}">{{o.k}} {{o.mark}}</span>
<b style="font-size: {{o.fs}}px; line-height: 1.1; font-family: 'IBM Plex Mono', monospace; white-space: nowrap">{{o.v}}</b>
</button>
</sc-for>
</div>
<div style="flex: 1 1 0; background: #FFF6E0; border: 4px solid #E8A317; border-radius: 24px; padding: 18px 26px; display: flex; flex-direction: column; gap: 14px">
<b style="font-size: 38px; font-weight: 900; color: #B45F00">{{t.notes}}</b>
<sc-for list="{{notesShort}}" as="n" hint-placeholder-count="4">
<div style="font-size: 34px; line-height: 1.3"><b style="color: #B45F00">{{n.i}}.</b> {{n.text}}</div>
</sc-for>
</div>
</div>
</sc-if>

<!-- STEP 4 : SETUP -->
<sc-if value="{{is4}}" hint-placeholder-val="{{ false }}">
<b style="font-size: 52px; font-weight: 900; line-height: 1.2; color: {{setupTitleC}}">{{setupTitle}}</b>
<div style="display: flex; gap: 18px; flex: 1 1 auto; min-height: 0">
<sc-for list="{{adjustList}}" as="s" hint-placeholder-count="2">
<button type="button" onClick="{{s.fix}}" style="flex: 1 1 0; background: {{s.bg}}; border: 4px solid {{s.bd}}; border-radius: 24px; padding: 18px 28px; color: #0B1626; text-align: left; display: flex; flex-direction: column; justify-content: center; gap: 8px; font-family: inherit; cursor: pointer">
<span style="font-size: 34px; font-weight: 700; color: #4A5568">{{s.k}} · {{s.u}}</span>
<span style="display: flex; align-items: center; gap: 24px; white-space: nowrap">
<b style="font-size: 100px; line-height: 1; font-family: 'IBM Plex Mono', monospace; color: #8A94A6; text-decoration: {{s.strike}}">{{s.cur}}</b>
<span style="font-size: 60px; color: #6B778A">→</span>
<b style="font-size: 150px; line-height: 1; font-family: 'IBM Plex Mono', monospace; color: {{s.vC}}">{{s.v}}</b>
</span>
<span style="font-size: 36px; font-weight: 900; color: {{s.vC}}">{{s.hint}}</span>
</button>
</sc-for>
</div>
<div style="flex: 0 0 auto; background: #F3F5F9; border: 4px solid #D5DCE6; border-radius: 24px; padding: 14px 24px; display: flex; align-items: center; gap: 20px">
<span style="font-size: 32px; font-weight: 900; color: #17804F; background: #E3F4EA; border-radius: 999px; padding: 6px 20px; white-space: nowrap">✓ {{okCount}} {{t.match}}</span>
<span style="font-size: 32px; color: #4A5568; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{okLine}}</span>
</div>
</sc-if>

<!-- STEP 5 : RUNNING -->
<sc-if value="{{is5}}" hint-placeholder-val="{{ false }}">
<div style="display: flex; gap: 18px; flex: 0 0 236px">
<div style="flex: 1.25 1 0; background: {{run.bg}}; border-radius: 24px; padding: 18px 28px; display: flex; flex-direction: column; justify-content: center; gap: 6px; color: {{run.fg}}">
<b style="font-size: 70px; font-weight: 900; line-height: 1.1">{{run.icon}} {{run.title}}</b>
<span style="font-size: 34px; line-height: 1.25">{{run.body}}</span>
</div>
<div style="flex: 1 1 0; background: #F3F5F9; border: 4px solid #D5DCE6; border-radius: 24px; padding: 16px 26px; display: flex; flex-direction: column; justify-content: center; gap: 4px">
<span style="font-size: 32px; font-weight: 700; color: #4A5568">{{countLabel}}</span>
<span style="white-space: nowrap"><b style="font-size: 128px; line-height: 1; font-family: 'IBM Plex Mono', monospace; color: #B45F00">{{count}}</b><b style="font-size: 60px; font-family: 'IBM Plex Mono', monospace; color: #4A5568"> / {{target}}</b></span>
<span style="font-size: 30px; color: #4A5568">{{coilPct}}% · {{t.ends}} {{endsAt}}</span>
</div>
</div>
<div style="display: flex; gap: 18px; flex: 1 1 auto; min-height: 0">
<sc-for list="{{run3}}" as="g" hint-placeholder-count="3">
<div style="flex: 1 1 0; background: #F3F5F9; border: 4px solid #D5DCE6; border-top: 12px solid {{g.c}}; border-radius: 24px; padding: 12px 26px; display: flex; flex-direction: column; justify-content: center; gap: 4px">
<span style="font-size: 32px; font-weight: 700; color: #4A5568">{{g.k}}</span>
<b style="font-size: 96px; line-height: 1; font-family: 'IBM Plex Mono', monospace; white-space: nowrap">{{g.v}}<span style="font-size: 40px">{{g.u}}</span></b>
<span style="font-size: 32px; font-weight: 700; color: {{g.c}}; white-space: nowrap">{{g.s}}</span>
</div>
</sc-for>
</div>
</sc-if>

<!-- STEP 6 : COUNT -->
<sc-if value="{{is6}}" hint-placeholder-val="{{ false }}">
<b style="font-size: 52px; font-weight: 900; line-height: 1.2">{{t.s6Ask}}</b>
<div style="display: flex; gap: 18px; flex: 1 1 auto; min-height: 0">
<div style="flex: 1.3 1 0; background: #FFF6E0; border: 4px solid #E8A317; border-radius: 24px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px">
<div style="display: flex; align-items: center; gap: 40px">
<button type="button" onClick="{{minus}}" aria-label="-1" style="width: 120px; height: 120px; border-radius: 24px; border: 0; background: #E3E8F0; color: #0B1626; font-size: 80px; font-weight: 900; font-family: inherit; cursor: pointer">−</button>
<b style="font-size: 170px; line-height: 1; font-family: 'IBM Plex Mono', monospace; min-width: 230px; text-align: center">{{packed}}</b>
<button type="button" onClick="{{plus}}" aria-label="+1" style="width: 120px; height: 120px; border-radius: 24px; border: 0; background: #E3E8F0; color: #0B1626; font-size: 80px; font-weight: 900; font-family: inherit; cursor: pointer">+</button>
</div>
<span style="font-size: 34px; color: #4A5568">{{t.machine}} {{count}} · {{t.removedShort}} {{removed}}</span>
</div>
<div style="flex: 1 1 0; background: {{verdict.bg}}; border: 4px solid {{verdict.bd}}; border-radius: 24px; padding: 20px 28px; display: flex; flex-direction: column; justify-content: center; gap: 12px">
<b style="font-size: 72px; font-weight: 900; line-height: 1.1; color: {{verdict.fg}}">{{verdict.title}}</b>
<span style="font-size: 34px; line-height: 1.35">{{t.target}} {{target}}. {{verdict.body}}</span>
<sc-if value="{{hasLog}}" hint-placeholder-val="{{ false }}"><span style="font-size: 30px; font-weight: 700; color: #C62828">⚠ {{logText}}</span></sc-if>
</div>
</div>
</sc-if>

</div>

<!-- PREV / NEXT -->
<div style="height: 118px; flex: 0 0 118px; display: flex; align-items: center; gap: 16px; padding: 0 28px; border-top: 3px solid #E3E8F0; box-sizing: border-box">
<button type="button" onClick="{{prev}}" style="height: 90px; padding: 0 36px; border-radius: 18px; border: 3px solid #9AA8BC; background: #FFFFFF; color: #4A5568; font-size: 36px; font-weight: 700; font-family: inherit; cursor: pointer; opacity: {{prevOp}}">{{t.prev}}</button>
<sc-if value="{{is5}}" hint-placeholder-val="{{ false }}">
<div style="display: flex; gap: 8px; align-items: center; margin-left: 12px">
<span style="font-size: 18px; color: #9AA8BC">{{t.demo}}</span>
<button type="button" onClick="{{addTen}}" style="height: 44px; padding: 0 12px; border-radius: 10px; border: 2px dashed #C3CCD9; background: transparent; color: #6B778A; font-size: 18px; font-family: inherit; cursor: pointer">{{t.plusTen}}</button>
<button type="button" onClick="{{fireSurf}}" style="height: 44px; padding: 0 12px; border-radius: 10px; border: 2px dashed #F0A8A8; background: transparent; color: #C62828; font-size: 18px; font-family: inherit; cursor: pointer">{{t.fireSurf}}</button>
<button type="button" onClick="{{fireFlat}}" style="height: 44px; padding: 0 12px; border-radius: 10px; border: 2px dashed #F0A8A8; background: transparent; color: #C62828; font-size: 18px; font-family: inherit; cursor: pointer">{{t.fireFlat}}</button>
</div>
</sc-if>
<span style="flex: 1 1 auto"></span>
<button type="button" onClick="{{next}}" style="height: 94px; padding: 0 48px; border-radius: 18px; border: 0; background: #0F1E33; color: #FFFFFF; font-size: 44px; font-weight: 900; font-family: inherit; cursor: pointer; white-space: nowrap">{{nextLabel}}</button>
</div>

<!-- NOTES SHEET -->
<sc-if value="{{notesOpen}}" hint-placeholder-val="{{ false }}">
<div style="position: absolute; inset: 0; background: rgba(11,22,38,0.55); display: flex; justify-content: flex-end">
<div style="width: 700px; height: 100%; background: #FFFFFF; border-left: 6px solid #E8A317; padding: 26px; box-sizing: border-box; display: flex; flex-direction: column; gap: 16px">
<div style="display: flex; justify-content: space-between; align-items: center"><b style="font-size: 44px; font-weight: 900; color: #B45F00">{{t.notesTitle}}</b><button type="button" onClick="{{closeNotes}}" aria-label="close" style="width: 72px; height: 72px; border-radius: 16px; border: 0; background: #E3E8F0; color: #0B1626; font-size: 44px; cursor: pointer">×</button></div>
<sc-for list="{{notes}}" as="n" hint-placeholder-count="4">
<div style="display: flex; gap: 14px; font-size: 32px; line-height: 1.35; background: #FFF6E0; border-radius: 16px; padding: 14px 18px"><b style="color: #B45F00">{{n.i}}</b><span>{{n.text}}</span></div>
</sc-for>
<button type="button" onClick="{{readNotesClose}}" style="margin-top: auto; height: 96px; border-radius: 18px; border: 0; background: #0F1E33; color: #FFFFFF; font-size: 40px; font-weight: 900; font-family: inherit; cursor: pointer">{{readLabel}}</button>
</div>
</div>
</sc-if>

<!-- ALARM MODAL -->
<sc-if value="{{alarmOn}}" hint-placeholder-val="{{ false }}">
<div style="position: absolute; left: 0; right: 0; top: 92px; bottom: 0; background: rgba(120,10,20,0.55); display: flex; align-items: center; justify-content: center; padding: 16px; box-sizing: border-box">
<div style="width: 1220px; background: #FFFFFF; border: 8px solid #C62828; border-radius: 24px; padding: 22px; display: flex; gap: 22px; box-sizing: border-box">
<div style="flex: 0 0 400px; position: relative; border-radius: 16px; overflow: hidden; background: #000000; height: 520px">
<img src="{{alarm.img}}" alt="{{alarm.title}}" style="width: 100%; height: 100%; object-fit: cover; display: block">
<div style="position: absolute; left: {{alarm.rx}}%; top: {{alarm.ry}}%; width: {{alarm.rw}}%; height: {{alarm.rh}}%; transform: translate(-50%, -50%); border: 6px solid #F04438; border-radius: 8px"></div>
</div>
<div style="flex: 1 1 auto; display: flex; flex-direction: column; gap: 14px; color: #0B1626; min-width: 0">
<span style="align-self: flex-start; font-size: 30px; font-weight: 900; color: #FFFFFF; background: #C62828; border-radius: 999px; padding: 6px 20px">⚠ {{alarm.cam}}</span>
<b style="font-size: 56px; font-weight: 900; line-height: 1.1; color: #C62828">{{alarm.title}}</b>
<span style="font-size: 34px; font-weight: 700">{{alarm.sheetText}} · {{alarm.where}}</span>
<span style="font-size: 32px; line-height: 1.4; color: #4A5568">{{alarm.tip}}</span>
<div style="margin-top: auto; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px">
<button type="button" onClick="{{ackOk}}" style="height: 120px; border-radius: 18px; border: 0; background: #17804F; color: #FFFFFF; font-size: 32px; font-weight: 900; line-height: 1.15; font-family: inherit; cursor: pointer">{{t.ok}}<br><span style="font-size: 21px; font-weight: 700">{{t.okSub}}</span></button>
<button type="button" onClick="{{ackRemove}}" style="height: 120px; border-radius: 18px; border: 0; background: #E8A317; color: #0B1626; font-size: 32px; font-weight: 900; line-height: 1.15; font-family: inherit; cursor: pointer">{{t.rm}}<br><span style="font-size: 21px; font-weight: 700">{{t.rmSub}}</span></button>
<button type="button" onClick="{{ackStop}}" style="height: 120px; border-radius: 18px; border: 0; background: #C62828; color: #FFFFFF; font-size: 32px; font-weight: 900; line-height: 1.15; font-family: inherit; cursor: pointer">{{t.stop}}<br><span style="font-size: 21px; font-weight: 700">{{t.stopSub}}</span></button>
</div>
</div>
</div>
</div>
</sc-if>

</div>
</template>
<script>

(function(){
  function get(scope, path){ var p=path.trim().split('.'), v=scope; for(var i=0;i<p.length;i++){ if(v==null) return undefined; v=v[p[i]]; } return v; }
  function sub(str, scope){ return str.replace(/\{\{([^}]+)\}\}/g, function(_,k){ var v=get(scope,k); return v==null?'':String(v); }); }
  function hole(str){ var m=/^\s*\{\{([^}]+)\}\}\s*$/.exec(str||''); return m?m[1]:null; }
  function render(node, scope, out){
    if(node.nodeType===3){ out.push(document.createTextNode(sub(node.nodeValue,scope))); return; }
    if(node.nodeType!==1) return;
    var tag=node.localName;
    if(tag==='sc-for'){
      var list=get(scope,hole(node.getAttribute('list')))||[], as=node.getAttribute('as');
      for(var i=0;i<list.length;i++){ var s=Object.create(scope); s[as]=list[i]; kids(node,s,out); }
      return;
    }
    if(tag==='sc-if'){ if(get(scope,hole(node.getAttribute('value')))) kids(node,scope,out); return; }
    var el=document.createElementNS(node.namespaceURI, tag);
    for(var a=0;a<node.attributes.length;a++){
      var at=node.attributes[a], n=at.name;
      if(n.indexOf('hint-')===0) continue;
      if(n.toLowerCase()==='onclick'){ var fn=get(scope,hole(at.value)); if(typeof fn==='function') el.addEventListener('click',fn); continue; }
      el.setAttribute(n, sub(at.value,scope));
    }
    var c=[]; kids(node,scope,c); c.forEach(function(x){el.appendChild(x);});
    out.push(el);
  }
  function kids(node,scope,out){ for(var ch=node.firstChild; ch; ch=ch.nextSibling) render(ch,scope,out); }
  window.DCLogic=function(props){ this.props=props||{}; this.state={}; };
  DCLogic.prototype.setState=function(p){ Object.assign(this.state,p); this.__render(); };
  window.__mount=function(Comp, props, root, tplEl){
    var c=new Comp(props);
    c.__render=function(){ var out=[]; kids(tplEl.content, c.renderVals(), out); root.replaceChildren.apply(root,out); };
    c.__render(); return c;
  };
})();

class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { step: 1, box: 2, chk: {}, fixed: {}, count: 23, removed: 0, packed: null, alarm: null, log: [], marks: [], notesOpen: false, notesRead: false, lang: null, sig: 'flat' };
  }
  renderVals() {
    var self = this, S = this.state;
    var L = S.lang || this.props.lang || 'ko';
    var KO = {
      appTitle: '레벨러 헬퍼', langBtn: 'EN', notes: '비고', notesTitle: '비고 — 꼭 읽으세요', fromOrder: '작업지시서 메모',
      steps: ['코일', '박스', '지시서', '장비 셋팅', '작업 중', '장수 확인'],
      s1Title: '오늘 작업할 코일을 고르세요', s1Sub: '11/03 (화) · 작업지시 3건',
      s2Title: '몇 번 박스를 작업하나요?', box: '박스', sheetsUnit: '장', done: '완료', nextUp: '다음 작업', waiting: '대기',
      s3Title: '작업지시서 확인', checkFmt: '{n} / 6 확인 · 확인 안 해도 이동 가능',
      oc: [['업체', '라벨과 같은지'], ['규격', '코일 꼬리표와 비교'], ['중량', '±1% 이내'], ['절단 길이', '지시서: 0.6X4X2565'], ['박스 {b} 장수', '작업내용: 2565=70'], ['출고지', '포장·라벨 확인']],
      ocShip: '시화',
      notesList: ['끝 5장은 불량 가능 → 따로 포장', '이 고객은 스크래치 클레임 이력 있음 → 표면 알람 나오면 바로 빼기', '라벨 2장 (박스 안 · 밖)', '시화 출고 · 오후 4시 상차'],
      read: '읽었어요', readDone: '✓ 읽음',
