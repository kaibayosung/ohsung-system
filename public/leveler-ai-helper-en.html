<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Leveler AI Helper (English) · Ohsung Steel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&family=IBM+Plex+Mono:wght@500;600;700&display=swap" rel="stylesheet">
<style>
html,body{margin:0;height:100%;background:#050A14;overflow:hidden}
#stage{position:absolute;left:50%;top:50%;width:1280px;height:800px;transform-origin:center center}

</style>
</head>
<body>
<!-- Mockup for field test (sample data only). Source: 레벨링 통합 대시보드 목업 / Helper.dc.html -->
<div id="stage"></div>

<template id="tpl">
<div style="width: 1280px; height: 800px; box-sizing: border-box; background: {{bg}}; color: #FFFFFF; font-family: 'Noto Sans KR', system-ui, sans-serif; display: flex; flex-direction: column; position: relative; overflow: hidden; border: {{frame}}">

<!-- TOP BAR -->
<div style="height: 60px; flex: 0 0 60px; display: flex; align-items: center; gap: 10px; padding: 0 14px; background: {{barBg}}; border-bottom: 1px solid #1E3352">
<span style="width: 34px; height: 34px; border-radius: 10px; background: #F5B547; color: #0B1626; font-weight: 900; display: flex; align-items: center; justify-content: center; font-size: 18px; flex: 0 0 34px">AI</span>
<b style="font-size: 21px; white-space: nowrap">{{t.appTitle}}</b>
<nav style="display: flex; gap: 4px; margin-left: 8px">
<sc-for list="{{steps}}" as="s" hint-placeholder-count="6">
<button type="button" onClick="{{s.go}}" style="display: flex; align-items: center; gap: 6px; height: 44px; padding: 0 11px; border-radius: 999px; font-size: 18px; font-weight: 700; border: 0; background: {{s.bg}}; color: {{s.fg}}; font-family: inherit; cursor: pointer; white-space: nowrap"><span style="width: 22px; height: 22px; border-radius: 50%; background: {{s.nbg}}; color: {{s.nfg}}; font-size: 16px; display: flex; align-items: center; justify-content: center">{{s.n}}</span>{{s.label}}</button>
</sc-for>
</nav>
<button type="button" onClick="{{openNotes}}" style="margin-left: auto; height: 44px; padding: 0 14px; border-radius: 10px; border: 2px solid #F5B547; background: {{notesBtnBg}}; color: #F5B547; font-size: 19px; font-weight: 900; font-family: inherit; cursor: pointer; white-space: nowrap">{{t.notes}}{{notesBadge}}</button>
<button type="button" onClick="{{toggleLang}}" style="height: 44px; padding: 0 12px; border-radius: 10px; border: 1px solid #3A5375; background: transparent; color: #FFFFFF; font-size: 18px; font-weight: 700; font-family: inherit; cursor: pointer">{{t.langBtn}}</button>
</div>

<sc-if value="{{alarmOn}}" hint-placeholder-val="{{ false }}">
<div style="height: 42px; flex: 0 0 42px; background: #F04438; display: flex; align-items: center; justify-content: center; font-size: 23px; font-weight: 900">⚠ {{t.alarmBanner}}</div>
</sc-if>

<!-- BODY -->
<div style="flex: 1 1 auto; min-height: 0; padding: 12px 16px; box-sizing: border-box; display: flex; flex-direction: column; gap: 10px">

<!-- STEP 1 -->
<sc-if value="{{is1}}" hint-placeholder-val="{{ true }}">
<div style="display: flex; justify-content: space-between; align-items: baseline"><b style="font-size: 26px">{{t.s1Title}}</b><span style="font-size: 19px; color: #8FA3BF">{{t.s1Sub}}</span></div>
<div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; flex: 1 1 auto">
<sc-for list="{{coils}}" as="c" hint-placeholder-count="3">
<button type="button" onClick="{{c.pick}}" style="background: #13243D; border: 2px solid {{c.bd}}; border-radius: 18px; padding: 22px; color: #FFFFFF; text-align: left; display: flex; flex-direction: column; gap: 12px; font-family: inherit; cursor: pointer">
<span style="font-size: 19px; color: #8FA3BF">{{c.cust}}</span>
<b style="font-size: 30px; font-family: 'IBM Plex Mono', monospace">{{c.coil}}</b>
<span style="font-size: 24px; font-weight: 700">{{c.spec}}</span>
<span style="display: flex; gap: 8px; flex-wrap: wrap">
<span style="font-size: 19px; background: #1E3352; border-radius: 8px; padding: 6px 10px">{{c.kg}}</span>
<span style="font-size: 19px; background: #1E3352; border-radius: 8px; padding: 6px 10px">{{c.boxes}}</span>
<span style="font-size: 19px; background: #1E3352; border-radius: 8px; padding: 6px 10px">{{c.cut}}</span>
</span>
<span style="font-size: 19px; color: #F5B547">{{c.note}}</span>
<span style="margin-top: auto; font-size: 20px; font-weight: 700; color: {{c.stC}}">{{c.st}}</span>
</button>
</sc-for>
</div>
</sc-if>

<!-- STEP 2 -->
<sc-if value="{{is2}}" hint-placeholder-val="{{ false }}">
<div style="display: flex; justify-content: space-between; align-items: baseline"><b style="font-size: 26px">{{t.s2Title}}</b><span style="font-size: 20px; color: #8FA3BF; font-family: 'IBM Plex Mono', monospace">SAMPLE-A01 · 0.60 × 1219 · 2,565mm</span></div>
<div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 16px; flex: 1 1 auto">
<sc-for list="{{boxes}}" as="b" hint-placeholder-count="4">
<button type="button" onClick="{{b.pick}}" style="background: {{b.bg}}; border: 2px solid {{b.bd}}; border-radius: 18px; padding: 22px; color: #FFFFFF; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; font-family: inherit; cursor: pointer">
<span style="font-size: 22px; color: #8FA3BF">{{t.box}}</span>
<b style="font-size: 72px; line-height: 1; font-family: 'IBM Plex Mono', monospace">{{b.no}}</b>
<span style="font-size: 24px; font-weight: 700">{{b.target}}</span>
<span style="font-size: 19px; color: {{b.stC}}; font-weight: 700">{{b.st}}</span>
</button>
</sc-for>
</div>
</sc-if>

<!-- STEP 3 -->
<sc-if value="{{is3}}" hint-placeholder-val="{{ false }}">
<div style="display: flex; justify-content: space-between; align-items: baseline"><b style="font-size: 26px">{{t.s3Title}}</b><span style="font-size: 19px; color: #F5B547; font-weight: 700">{{checkText}}</span></div>
<div style="display: flex; gap: 14px; flex: 1 1 auto; min-height: 0">
<div style="flex: 1 1 auto; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px">
<sc-for list="{{orderChecks}}" as="o" hint-placeholder-count="6">
<button type="button" onClick="{{o.toggle}}" style="background: {{o.bg}}; border: 2px solid {{o.bd}}; border-radius: 16px; padding: 16px; color: #FFFFFF; text-align: left; display: flex; flex-direction: column; gap: 6px; position: relative; font-family: inherit; cursor: pointer">
<span style="font-size: 19px; color: #8FA3BF">{{o.k}}</span>
<b style="font-size: 26px; font-family: 'IBM Plex Mono', monospace; line-height: 1.2">{{o.v}}</b>
<span style="font-size: 17px; color: #C9D3E0">{{o.hint}}</span>
<span style="position: absolute; right: 14px; top: 14px; width: 32px; height: 32px; border-radius: 50%; border: 2px solid {{o.ck}}; background: {{o.ckbg}}; color: #0B1626; font-weight: 900; font-size: 21px; display: flex; align-items: center; justify-content: center">{{o.mark}}</span>
</button>
</sc-for>
</div>
<div style="flex: 0 0 360px; background: #2A2310; border: 2px solid {{notesBd}}; border-radius: 16px; padding: 18px; display: flex; flex-direction: column; gap: 12px">
<b style="font-size: 24px; color: #F5B547">{{t.notesTitle}}</b>
<sc-for list="{{notes}}" as="n" hint-placeholder-count="4">
<div style="display: flex; gap: 10px; font-size: 20px; line-height: 1.5"><span style="color: #F5B547; font-weight: 900">{{n.i}}</span><span>{{n.text}}</span></div>
</sc-for>
<button type="button" onClick="{{readNotes}}" style="margin-top: auto; min-height: 56px; border-radius: 12px; border: 0; background: {{readBg}}; color: #0B1626; font-size: 22px; font-weight: 900; font-family: inherit; cursor: pointer">{{readLabel}}</button>
</div>
</div>
</sc-if>

<!-- STEP 4 : SETUP — current vs recommended -->
<sc-if value="{{is4}}" hint-placeholder-val="{{ false }}">
<div style="display: flex; justify-content: space-between; align-items: baseline"><b style="font-size: 26px">{{t.s4Title}}</b><span style="font-size: 19px; color: {{setupC}}; font-weight: 700">{{setupText}}</span></div>
<div style="display: flex; gap: 14px; flex: 1 1 auto; min-height: 0">
<div style="flex: 1 1 auto; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px">
<sc-for list="{{settings}}" as="s" hint-placeholder-count="6">
<button type="button" onClick="{{s.fix}}" style="background: {{s.bg}}; border: 2px solid {{s.bd}}; border-radius: 16px; padding: 14px 16px; color: #FFFFFF; text-align: left; display: flex; flex-direction: column; gap: 6px; font-family: inherit; cursor: pointer">
<span style="display: flex; justify-content: space-between; width: 100%; align-items: center"><span style="font-size: 19px; color: #8FA3BF">{{s.k}}</span><span style="font-size: 17px; font-weight: 900; color: #0B1626; background: {{s.okC}}; border-radius: 999px; padding: 2px 10px">{{s.ok}}</span></span>
<span style="display: flex; align-items: baseline; gap: 7px">
<span style="display: flex; flex-direction: column"><span style="font-size: 16px; color: #8FA3BF">{{t.now}}</span><b style="font-size: 30px; font-family: 'IBM Plex Mono', monospace; color: {{s.curC}}; line-height: 1.1; white-space: nowrap">{{s.cur}}</b></span>
<span style="font-size: 24px; color: #5B6B82">→</span>
<span style="display: flex; flex-direction: column"><span style="font-size: 16px; color: #8FA3BF">{{t.reco}}</span><b style="font-size: 30px; font-family: 'IBM Plex Mono', monospace; color: #F5B547; line-height: 1.1; white-space: nowrap">{{s.v}}</b></span>
<span style="font-size: 16px; color: #C9D3E0">{{s.u}}</span>
</span>
<span style="font-size: 18px; color: {{s.hintC}}; line-height: 1.4; font-weight: {{s.hintW}}">{{s.hint}}</span>
</button>
</sc-for>
</div>
<div style="flex: 0 0 290px; background: #13243D; border-radius: 16px; padding: 16px; display: flex; flex-direction: column; gap: 12px">
<b style="font-size: 22px; color: #F5B547">{{t.aiTitle}}</b>
<span style="font-size: 19px; line-height: 1.6">{{t.aiTip1}}</span>
<span style="font-size: 19px; line-height: 1.6">{{t.aiTip2}}</span>
<span style="margin-top: auto; font-size: 17px; color: #8FA3BF">{{t.cardHint}}</span>
</div>
</div>
</sc-if>

<!-- STEP 5 : RUNNING (floor-screen style) -->
<sc-if value="{{is5}}" hint-placeholder-val="{{ false }}">
<!-- header row -->
<div style="display: flex; gap: 10px; flex: 0 0 92px">
<div style="flex: 1 1 auto; background: #13243D; border-radius: 14px; padding: 10px 16px; display: flex; flex-direction: column; justify-content: center; gap: 6px; min-width: 0">
<div style="display: flex; align-items: baseline; gap: 12px; white-space: nowrap"><b style="font-size: 24px">{{jobTitle}}</b><span style="font-size: 15px; color: #8FA3BF">SAMPLE-A01 · {{t.started}} 10:05</span></div>
<div style="display: flex; gap: 3px; height: 12px">
<sc-for list="{{boxProg}}" as="p" hint-placeholder-count="4">
<div style="flex: {{p.f}} 1 0; background: #0B1626; border-radius: 4px; overflow: hidden"><div style="height: 12px; width: {{p.pct}}%; background: {{p.c}}"></div></div>
</sc-for>
</div>
<div style="display: flex; gap: 18px; font-size: 18px; color: #C9D3E0; white-space: nowrap"><span><b style="color: #FFFFFF; font-size: 21px">{{coilPct}}%</b> · {{posM}} / 710 m</span><span>{{t.elapsed}} <b style="color: #FFFFFF">{{elapsed}}</b></span><span>{{t.left}} <b style="color: #FFFFFF">{{leftMin}}</b></span><span>{{t.ends}} <b style="color: #FFFFFF">{{endsAt}}</b></span></div>
</div>
<div style="flex: 0 0 210px; background: #13243D; border-radius: 14px; padding: 8px 14px; display: flex; flex-direction: column; justify-content: center">
<span style="font-size: 17px; color: #8FA3BF">{{countLabel}}</span>
<div style="display: flex; align-items: baseline; gap: 6px; white-space: nowrap"><b style="font-size: 50px; line-height: 1; font-family: 'IBM Plex Mono', monospace; color: #F5B547">{{count}}</b><span style="font-size: 22px; color: #C9D3E0; font-family: 'IBM Plex Mono', monospace">/ {{target}}</span><span style="margin-left: auto; font-size: 15px; color: #FDA29B">{{t.removedShort}} {{removed}}</span></div>
</div>
<div style="flex: 0 0 300px; background: {{verdict5.bg}}; border: 2px solid {{verdict5.bd}}; border-radius: 14px; padding: 8px 14px; display: flex; flex-direction: column; justify-content: center; gap: 2px">
<b style="font-size: 24px; color: {{verdict5.fg}}">{{verdict5.icon}} {{verdict5.title}}</b>
<span style="font-size: 17px; line-height: 1.4; color: #E4E7EC">{{verdict5.body}}</span>
</div>
</div>

<!-- line diagram -->
<div style="flex: 0 0 104px; background: #13243D; border-radius: 14px; padding: 8px 16px; display: flex; align-items: center; gap: 0">
<sc-for list="{{line}}" as="u" hint-placeholder-count="5">
<div style="display: flex; align-items: center; flex: {{u.f}}; min-width: 0">
<div style="display: flex; flex-direction: column; align-items: center; gap: 4px; flex: 0 0 auto">
<div style="width: {{u.w}}px; height: 52px; border-radius: {{u.r}}; background: {{u.fill}}; border: 3px solid {{u.c}}; box-sizing: border-box; display: flex; align-items: center; justify-content: center; font-size: 16px; font-weight: 900; color: #0B1626">{{u.icon}}</div>
<b style="font-size: 17px; white-space: nowrap">{{u.name}}</b>
<span style="font-size: 16px; color: {{u.vc}}; white-space: nowrap; font-family: 'IBM Plex Mono', monospace">{{u.val}}</span>
</div>
<sc-if value="{{u.link}}" hint-placeholder-val="{{ true }}"><div style="flex: 1 1 auto; height: 0; border-top: 4px dashed #6F8FBF; margin: 0 6px 30px"></div></sc-if>
</div>
</sc-for>
</div>

<!-- gauges -->
<div style="flex: 0 0 132px; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 8px">
<sc-for list="{{gauges}}" as="g" hint-placeholder-count="5">
<div style="background: #13243D; border-radius: 14px; padding: 6px 10px; display: flex; flex-direction: column; align-items: center; gap: 0; border-top: 4px solid {{g.c}}">
<span style="align-self: flex-start; font-size: 17px; color: #C9D3E0">{{g.k}}</span>
<svg viewBox="0 0 120 66" style="width: 110px; height: 56px" role="img" aria-label="{{g.k}} {{g.v}}">
<path d="M10 60 A50 50 0 0 1 110 60" fill="none" stroke="#24395A" stroke-width="10" stroke-linecap="round"></path>
<path d="M10 60 A50 50 0 0 1 110 60" fill="none" stroke="#3FAE6A" stroke-width="10" stroke-dasharray="{{g.band}}" stroke-dashoffset="{{g.off}}"></path>
<line x1="60" y1="60" x2="{{g.nx}}" y2="{{g.ny}}" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"></line>
<circle cx="60" cy="60" r="5" fill="#FFFFFF"></circle>
</svg>
<b style="font-size: 24px; line-height: 1.1; font-family: 'IBM Plex Mono', monospace">{{g.v}}<span style="font-size: 16px; color: #C9D3E0"> {{g.u}}</span></b>
<span style="font-size: 15px; color: #8FA3BF">{{t.normal}} {{g.range}}</span>
<span style="font-size: 16px; font-weight: 700; color: {{g.c}}">{{g.s}}</span>
</div>
</sc-for>
</div>

<!-- chart + guide -->
<div style="flex: 1 1 auto; min-height: 0; display: flex; gap: 10px">
<div style="flex: 1 1 auto; background: #13243D; border-radius: 14px; padding: 8px 12px; display: flex; flex-direction: column; gap: 4px; min-width: 0">
<div style="display: flex; gap: 6px; align-items: center">
<sc-for list="{{chartTabs}}" as="ct" hint-placeholder-count="4">
<button type="button" onClick="{{ct.pick}}" style="{{ct.style}}">{{ct.label}}</button>
</sc-for>
<span style="margin-left: auto; display: flex; gap: 10px; font-size: 15px; color: #C9D3E0; white-space: nowrap"><span><span style="display: inline-block; width: 14px; height: 3px; background: #F5B547; vertical-align: middle"></span> {{t.actual}}</span><span><span style="display: inline-block; width: 14px; border-top: 2px dashed #FFFFFF; vertical-align: middle"></span> {{t.forecast}}</span><span><span style="display: inline-block; width: 12px; height: 10px; background: rgba(63,174,106,0.35); vertical-align: middle"></span> {{t.normal}}</span><span style="color: #F04438">● {{t.defect}}</span></span>
</div>
<div style="position: relative; flex: 1 1 auto; min-height: 0">
<svg viewBox="0 0 600 150" preserveAspectRatio="none" style="position: absolute; inset: 0; width: 100%; height: 100%" role="img" aria-label="{{chartAria}}">
<polygon points="{{ch.band}}" fill="rgba(63,174,106,0.28)"></polygon>
<sc-for list="{{ch.boxLines}}" as="bl" hint-placeholder-count="3"><line x1="{{bl.x}}" y1="0" x2="{{bl.x}}" y2="150" stroke="#3A5375" stroke-width="1" stroke-dasharray="3 3"></line></sc-for>
<polyline points="{{ch.fc}}" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-dasharray="5 4" vector-effect="non-scaling-stroke"></polyline>
<polyline points="{{ch.act}}" fill="none" stroke="#F5B547" stroke-width="3" vector-effect="non-scaling-stroke"></polyline>
<line x1="{{ch.nowX}}" y1="0" x2="{{ch.nowX}}" y2="150" stroke="#FFFFFF" stroke-width="1.5" vector-effect="non-scaling-stroke"></line>
</svg>
<sc-for list="{{ch.marks}}" as="mk" hint-placeholder-count="1"><span style="position: absolute; left: {{mk.x}}%; top: 2px; transform: translateX(-50%); width: 14px; height: 14px; border-radius: 50%; background: #F04438; border: 2px solid #FFFFFF; box-sizing: border-box"></span></sc-for>
<span style="position: absolute; left: {{ch.nowPct}}%; bottom: 2px; transform: translateX(4px); font-size: 15px; color: #FFFFFF; background: #0B1626; padding: 1px 5px; border-radius: 4px; white-space: nowrap">{{t.nowLabel}} {{posM}}m</span>
</div>
<div style="display: flex; justify-content: space-between; font-size: 15px; color: #8FA3BF; font-family: 'IBM Plex Mono', monospace"><span>0 m</span><span>{{t.box}} 1 | 2 | 3 | 4</span><span>710 m</span></div>
</div>
<div style="flex: 0 0 300px; display: flex; flex-direction: column; gap: 8px">
<div style="flex: 1 1 auto; background: #1A2E1F; border: 1px solid #2E6B3F; border-radius: 14px; padding: 12px; display: flex; flex-direction: column; gap: 6px">
<b style="font-size: 20px; color: #A6F4C5">AI · {{guide.title}}</b>
<span style="font-size: 18px; line-height: 1.5; color: #D1FADF">{{guide.body}}</span>
</div>
<div style="display: flex; gap: 6px; flex-wrap: wrap; align-items: center">
<span style="font-size: 15px; color: #8FA3BF">{{t.demo}}</span>
<button type="button" onClick="{{addTen}}" style="min-height: 34px; padding: 0 10px; border-radius: 8px; border: 1px dashed #3A5375; background: transparent; color: #C9D3E0; font-size: 16px; font-family: inherit; cursor: pointer">{{t.plusTen}}</button>
<button type="button" onClick="{{fireSurf}}" style="min-height: 34px; padding: 0 10px; border-radius: 8px; border: 1px dashed #F04438; background: transparent; color: #FDA29B; font-size: 16px; font-family: inherit; cursor: pointer">{{t.fireSurf}}</button>
<button type="button" onClick="{{fireFlat}}" style="min-height: 34px; padding: 0 10px; border-radius: 8px; border: 1px dashed #F04438; background: transparent; color: #FDA29B; font-size: 16px; font-family: inherit; cursor: pointer">{{t.fireFlat}}</button>
</div>
</div>
</div>
</sc-if>

<!-- STEP 6 -->
<sc-if value="{{is6}}" hint-placeholder-val="{{ false }}">
<div style="display: flex; justify-content: space-between; align-items: baseline"><b style="font-size: 26px">{{s6Title}}</b><span style="font-size: 20px; color: #8FA3BF">{{t.s6Sub}}</span></div>
<div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 14px">
<div style="background: #13243D; border-radius: 16px; padding: 18px; display: flex; flex-direction: column; gap: 6px"><span style="font-size: 20px; color: #8FA3BF">{{t.target}}</span><b style="font-size: 52px; font-family: 'IBM Plex Mono', monospace">{{target}}</b></div>
<div style="background: #13243D; border-radius: 16px; padding: 18px; display: flex; flex-direction: column; gap: 6px"><span style="font-size: 20px; color: #8FA3BF">{{t.machine}}</span><b style="font-size: 52px; font-family: 'IBM Plex Mono', monospace">{{count}}</b></div>
<div style="background: #2A1618; border-radius: 16px; padding: 18px; display: flex; flex-direction: column; gap: 6px"><span style="font-size: 20px; color: #FDA29B">{{t.removed}}</span><b style="font-size: 52px; font-family: 'IBM Plex Mono', monospace; color: #FDA29B">{{removed}}</b></div>
<div style="background: #13243D; border: 2px solid #F5B547; border-radius: 16px; padding: 18px; display: flex; flex-direction: column; gap: 6px"><span style="font-size: 20px; color: #F5B547">{{t.packed}}</span>
<div style="display: flex; align-items: center; gap: 10px">
<button type="button" onClick="{{minus}}" aria-label="-1" style="width: 52px; height: 52px; border-radius: 12px; border: 0; background: #1E3352; color: #FFFFFF; font-size: 28px; cursor: pointer">−</button>
<b style="font-size: 52px; font-family: 'IBM Plex Mono', monospace; min-width: 90px; text-align: center">{{packed}}</b>
<button type="button" onClick="{{plus}}" aria-label="+1" style="width: 52px; height: 52px; border-radius: 12px; border: 0; background: #1E3352; color: #FFFFFF; font-size: 28px; cursor: pointer">+</button>
</div>
</div>
</div>
<div style="background: {{verdict.bg}}; border: 2px solid {{verdict.bd}}; border-radius: 16px; padding: 18px; display: flex; align-items: center; gap: 16px">
<span style="width: 56px; height: 56px; border-radius: 50%; background: {{verdict.bd}}; color: #0B1626; font-size: 30px; font-weight: 900; display: flex; align-items: center; justify-content: center; flex: 0 0 56px">{{verdict.icon}}</span>
<div style="display: flex; flex-direction: column; gap: 4px"><b style="font-size: 24px">{{verdict.title}}</b><span style="font-size: 21px; color: #E4E7EC">{{verdict.body}}</span></div>
</div>
<div style="background: #13243D; border-radius: 14px; padding: 14px 16px; display: flex; flex-direction: column; gap: 8px; flex: 1 1 auto; min-height: 0">
<b style="font-size: 20px">{{t.logTitle}}</b>

<button type="button" onClick="{{next}}" style="min-height: 52px; padding: 0 26px; border-radius: 12px; border: 0; background: #F5B547; color: #0B1626; font-size: 22px; font-weight: 900; font-family: inherit; cursor: pointer">{{nextLabel}}</button>
</div>
</div>

</div>
