<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>불량 발생 (시연 조작)</title>
<link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" rel="stylesheet">
<style>
  :root{--ink:#0f1e33;--mut:#8a93a6;--bg:#eef1fb}
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  body{font-family:Pretendard,system-ui,sans-serif;font-weight:800;background:var(--bg);color:var(--ink);min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:24px 18px 32px}
  .wrap{width:100%;max-width:560px;display:flex;flex-direction:column;gap:18px}
  .head{text-align:center;margin-bottom:4px}
  .head h1{font-size:34px;letter-spacing:-.6px}
  .head p{font-size:16px;font-weight:700;color:var(--mut);margin-top:8px;line-height:1.5}
  button{font-family:inherit;cursor:pointer;border:0}
  .big{width:100%;border-radius:22px;padding:34px 24px;color:#fff;display:flex;flex-direction:column;align-items:center;gap:8px;box-shadow:0 12px 30px rgba(20,24,40,.18);transition:transform .08s}
  .big:active{transform:scale(.98)}
  .big .em{font-size:46px;line-height:1}
  .big .t{font-size:34px;font-weight:900;letter-spacing:-.5px}
  .big .s{font-size:16px;font-weight:700;opacity:.9}
  .scratch{background:linear-gradient(135deg,#e5473a,#c62828)}
  .flat{background:linear-gradient(135deg,#f0902a,#e07b1a)}
  .clear{background:#e3e8f0;color:#0b1626;box-shadow:none;border:2px solid #cfd6e4;padding:20px}
  .clear .t{font-size:24px}
  .toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(20px);background:#0f1e33;color:#fff;font-size:19px;font-weight:800;padding:14px 26px;border-radius:999px;opacity:0;transition:all .25s;pointer-events:none;z-index:50}
  .toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
  .note{font-size:14px;color:var(--mut);font-weight:700;text-align:center;line-height:1.6;margin-top:4px}
  .box{display:flex;align-items:center;justify-content:center;gap:10px;font-size:17px;color:var(--ink);background:#fff;border:2px solid #dfe4ee;border-radius:16px;padding:12px}
  .box b{color:#796cbf}
</style>
</head>
<body>
<div class="wrap">
  <div class="head">
    <h1>🔴 불량 발생 (시연)</h1>
    <p>버튼을 누르면 <b>레벨러 AI 헬퍼 시연 화면</b>에 빨간 알람이 뜹니다.<br>헬퍼 시연 페이지를 먼저 열어 두세요.</p>
  </div>

  <button class="big scratch" onclick="fire('scratch', this)">
    <span class="em">⚠️</span><span class="t">표면 스크래치 불량</span><span class="s">카메라1 · 표면검사</span>
  </button>

  <button class="big flat" onclick="fire('flatness', this)">
    <span class="em">〰️</span><span class="t">평탄도 불량</span><span class="s">카메라2 · 평탄도검사</span>
  </button>

  <button class="clear big" onclick="fire('clear', this)">
    <span class="t">알람 끄기</span>
  </button>

  <div class="note">같은 기기(같은 브라우저)면 즉시, 다른 기기면 1~2초 안에 헬퍼 화면에 반영됩니다.</div>
</div>

<div class="toast" id="toast"></div>

<script>
var API='https://mnlnbwcbgfgftdgawanh.supabase.co/functions/v1/leveler-helper';
var ch=null; try{ ch=new BroadcastChannel('lvh-demo'); }catch(e){}
function toast(msg){ var t=document.getElementById('toast'); t.textContent=msg; t.classList.add('on'); clearTimeout(t._tm); t._tm=setTimeout(function(){ t.classList.remove('on'); },1600); }
function fire(metric, btn){
  if(btn){ btn.style.opacity='.6'; setTimeout(function(){ btn.style.opacity='1'; },300); }
  // 1) 같은 브라우저 즉시
  try{ if(ch) ch.postMessage({metric:metric}); }catch(e){}
  // 2) 다른 기기 — Supabase 트리거
  fetch(API+'?mode=demo',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({metric:metric})})
    .then(function(r){return r.json();}).then(function(j){
      toast(metric==='clear' ? '알람 끔 ✓' : (metric==='flatness' ? '평탄도 불량 전송 ✓' : '표면 스크래치 전송 ✓'));
    }).catch(function(){ toast('전송 실패 — 네트워크 확인'); });
}
</script>
</body>
</html>
