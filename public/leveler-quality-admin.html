<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1280">
<title>레벨러 품질 Admin (PC · 테스트) · 오성철강</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&family=IBM+Plex+Mono:wght@500;600;700&display=swap" rel="stylesheet">
<style>
html,body{margin:0;background:#0B1626}
button{font-family:inherit;cursor:pointer}

</style>
</head>
<body>
<!-- Mockup for field test (sample data only). Source: 레벨링 통합 대시보드 목업 / Helper.dc.html -->
<div id="stage"></div>

<template id="tpl">
<div style="min-width: 1280px; min-height: 100vh; box-sizing: border-box; background: #0B1626; color: #FFFFFF; font-family: 'Noto Sans KR', system-ui, sans-serif; display: flex; flex-direction: column">

<!-- TOP BAR -->
<div style="height: 60px; flex: 0 0 60px; display: flex; align-items: center; gap: 12px; padding: 0 18px; background: #0F1E33; border-bottom: 1px solid #1E3352">
<span style="width: 34px; height: 34px; border-radius: 10px; background: #F5B547; color: #0B1626; font-weight: 900; display: flex; align-items: center; justify-content: center; font-size: 14px">AI</span>
<b style="font-size: 18px; white-space: nowrap">레벨러 품질 Admin</b>
<nav style="display: flex; gap: 4px; margin-left: 10px">
<sc-for list="{{tabs}}" as="tb" hint-placeholder-count="4"><button type="button" onClick="{{tb.pick}}" style="height: 38px; padding: 0 14px; border-radius: 999px; border: 0; font-size: 14px; font-weight: 700; color: {{tb.fg}}; background: {{tb.bg}}">{{tb.label}}</button></sc-for>
</nav>
<span style="margin-left: auto; font-size: 11px; color: #5B6B82">화면 설계용 샘플 데이터</span>
</div>

<div style="flex: 1 1 auto; display: flex; align-items: stretch">

<!-- LEFT: COIL LIST -->
<div style="flex: 0 0 280px; background: #0F1E33; border-right: 1px solid #1E3352; padding: 14px; box-sizing: border-box; display: flex; flex-direction: column; gap: 10px">
<div style="display: flex; justify-content: space-between; align-items: baseline"><b style="font-size: 17px">① 코일 고르기</b><span style="font-size: 13px; color: #8FA3BF">11/02 (월)</span></div>
<sc-for list="{{coils}}" as="c" hint-placeholder-count="4">
<button type="button" onClick="{{c.pick}}" style="background: {{c.bg}}; border: 2px solid {{c.bd}}; border-radius: 14px; padding: 12px 14px; color: #FFFFFF; text-align: left; display: flex; flex-direction: column; gap: 6px">
<span style="display: flex; justify-content: space-between; width: 100%; font-size: 13px"><span style="color: #8FA3BF">{{c.cust}} · {{c.time}}</span><span style="font-weight: 700; color: {{c.stC}}">{{c.st}}</span></span>
<b style="font-size: 20px; font-family: 'IBM Plex Mono', monospace">{{c.id}}</b>
<span style="font-size: 14px; color: #C9D3E0">{{c.spec}}</span>
<div style="display: flex; height: 8px; border-radius: 4px; overflow: hidden; gap: 1px; background: #0B1626">
<sc-for list="{{c.mini}}" as="mn" hint-placeholder-count="4"><span style="flex: {{mn.f}} 1 0; background: {{mn.c}}"></span></sc-for>
</div>
<span style="display: flex; gap: 6px; flex-wrap: wrap">
<span style="font-size: 13px; font-weight: 900; color: #0B1626; background: {{c.vC}}; border-radius: 999px; padding: 2px 10px">{{c.vLabel}}</span>
<span style="font-size: 13px; color: #FEC84B; background: #2E2410; border-radius: 999px; padding: 2px 10px">평탄 {{c.nf}}</span>
<span style="font-size: 13px; color: #D6BBFB; background: #251A3D; border-radius: 999px; padding: 2px 10px">표면 {{c.ns}}</span>
</span>
</button>
</sc-for>
</div>

<!-- MAIN -->
<div style="flex: 1 1 auto; min-width: 0; padding: 14px 16px 28px; box-sizing: border-box; display: flex; flex-direction: column; gap: 12px">

<!-- title strip -->
<div style="display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap">
<span style="font-size: 13px; color: #F5B547; font-weight: 700">② 코일 상태</span>
<b style="font-size: 28px; font-family: 'IBM Plex Mono', monospace">{{cur.id}}</b>
<span style="font-size: 16px; color: #C9D3E0">{{cur.cust}} · {{cur.spec}} · {{cur.kg}} · 절단 {{cur.cut}} · {{cur.len}} m · 박스 {{cur.nBox}}개</span>
<span style="margin-left: auto; font-size: 15px; font-weight: 700; color: {{cur.stC}}">{{cur.st}} · {{cur.time}}</span>
</div>

<!-- SCOPE -->
<div style="display: flex; align-items: center; gap: 8px; flex-wrap: wrap; background: #0F1E33; border: 1px solid #1E3352; border-radius: 14px; padding: 8px 10px">
<b style="font-size: 14px; color: #C9D3E0; margin: 0 6px">보는 범위</b>
<sc-for list="{{scopes}}" as="sp" hint-placeholder-count="5"><button type="button" onClick="{{sp.pick}}" style="{{sp.style}}"><b style="font-size: 15px">{{sp.label}}</b><span style="font-size: 12px; opacity: 0.85">{{sp.sub}}</span><span style="font-size: 11px; font-weight: 900; color: #0B1626; background: {{sp.vC}}; border-radius: 999px; padding: 1px 8px">{{sp.v}}</span></button></sc-for>
</div>

<sc-if value="{{isView}}" hint-placeholder-val="{{ true }}">
<!-- KPI VISUALS -->
<div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px">

<!-- 1. ship ring -->
<div style="background: #13243D; border-radius: 16px; padding: 14px 16px; display: flex; align-items: center; gap: 16px; border-top: 4px solid {{kV.c}}">
<div style="position: relative; width: 112px; height: 112px; flex: 0 0 112px">
<svg viewBox="0 0 120 120" style="width: 112px; height: 112px" role="img" aria-label="출하율 {{ship.pct}}%">
<circle cx="60" cy="60" r="48" fill="none" stroke="#1E3352" stroke-width="14"></circle>
<circle cx="60" cy="60" r="48" fill="none" stroke="#4ADE80" stroke-width="14" stroke-dasharray="{{ship.dash}}" transform="rotate(-90 60 60)"></circle>
<circle cx="60" cy="60" r="48" fill="none" stroke="#F04438" stroke-width="14" stroke-dasharray="{{ship.rmDash}}" stroke-dashoffset="{{ship.rmOff}}" transform="rotate(-90 60 60)"></circle>
</svg>
<div style="position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center"><b style="font-size: 24px; font-family: 'IBM Plex Mono', monospace">{{ship.pct}}%</b><span style="font-size: 11px; color: #8FA3BF">출하율</span></div>
</div>
<div style="display: flex; flex-direction: column; gap: 4px; min-width: 0">
<span style="font-size: 13px; color: #C9D3E0">종합 판정</span>
<b style="font-size: 24px; line-height: 1.15; color: {{kV.c}}">{{kV.icon}} {{kV.label}}</b>
<span style="font-size: 14px"><span style="color: #4ADE80">■</span> 출하 <b>{{ship.n}}</b>장</span>
<span style="font-size: 14px"><span style="color: #F04438">■</span> 뺌 <b>{{ship.rm}}</b>장 <span style="color: #8FA3BF">/ 자른 {{ship.cut}}</span></span>
</div>
</div>

<!-- 2. flatness gauge -->
<div style="background: #13243D; border-radius: 16px; padding: 14px 16px; display: flex; align-items: center; gap: 14px; border-top: 4px solid {{kF.c}}">
<div style="position: relative; width: 150px; flex: 0 0 150px">
<svg viewBox="0 0 160 96" style="width: 150px; height: 90px" role="img" aria-label="평탄도 최대 {{kF.mm}} mm">
<path d="M14 84 A66 66 0 0 1 146 84" fill="none" stroke="#1E3352" stroke-width="14"></path>
<sc-for list="{{kF.bands}}" as="bd" hint-placeholder-count="3"><path d="M14 84 A66 66 0 0 1 146 84" fill="none" stroke="{{bd.c}}" stroke-width="14" stroke-dasharray="{{bd.dash}}" stroke-dashoffset="{{bd.off}}"></path></sc-for>
<line x1="80" y1="84" x2="{{kF.nx}}" y2="{{kF.ny}}" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round"></line>
<circle cx="80" cy="84" r="6" fill="#FFFFFF"></circle>
</svg>
<div style="display: flex; justify-content: space-between; font-size: 10px; color: #8FA3BF; font-family: 'IBM Plex Mono', monospace; margin-top: -4px"><span>0</span><span>0.7</span><span>1.5</span></div>
</div>
<div style="display: flex; flex-direction: column; gap: 3px; min-width: 0">
<span style="font-size: 13px; color: #C9D3E0">평탄도 최대 (CAM2)</span>
<b style="font-size: 30px; font-family: 'IBM Plex Mono', monospace; color: {{kF.c}}; white-space: nowrap">{{kF.mm}}<span style="font-size: 14px"> mm</span></b>
<span style="font-size: 13px; color: #C9D3E0; white-space: nowrap">기준 0.70 · 넘은 장 <b style="color: #FFFFFF">{{kF.n}}</b></span>
<span style="font-size: 13px; color: #C9D3E0">평균 <b style="color: #FFFFFF">{{kF.avg}} mm</b></span>
</div>
</div>

<!-- 3. grade distribution -->
<div style="background: #13243D; border-radius: 16px; padding: 14px 16px; display: flex; flex-direction: column; justify-content: center; gap: 10px; border-top: 4px solid #A6F4C5">
<span style="font-size: 13px; color: #C9D3E0">장별 평탄도 등급 — {{gradeTotal}}장</span>
<div style="display: flex; height: 34px; gap: 2px; border-radius: 6px; overflow: hidden">
<sc-for list="{{gradeBar}}" as="g" hint-placeholder-count="4"><div style="flex: {{g.f}} 1 0; min-width: {{g.minw}}; background: {{g.c}}; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 900; color: #0B1626">{{g.inLabel}}</div></sc-for>
</div>
<div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 4px">
<sc-for list="{{gradeBar}}" as="g" hint-placeholder-count="4"><span style="display: flex; flex-direction: column; line-height: 1.2; white-space: nowrap"><span style="font-size: 12px; color: #C9D3E0"><span style="color: {{g.c}}">■</span> {{g.k}} {{g.short}}</span><b style="font-size: 18px; font-family: 'IBM Plex Mono', monospace">{{g.n}}<span style="font-size: 11px; color: #8FA3BF"> {{g.pct}}%</span></b></span></sc-for>
</div>
</div>

<!-- 4. action donut -->
<div style="background: #13243D; border-radius: 16px; padding: 14px 16px; display: flex; align-items: center; gap: 16px; border-top: 4px solid {{act.c}}">
<div style="position: relative; width: 112px; height: 112px; flex: 0 0 112px">
<svg viewBox="0 0 120 120" style="width: 112px; height: 112px" role="img" aria-label="결함 처리 현황">
<circle cx="60" cy="60" r="48" fill="none" stroke="#1E3352" stroke-width="14"></circle>
<sc-for list="{{act.segs}}" as="sg" hint-placeholder-count="3"><circle cx="60" cy="60" r="48" fill="none" stroke="{{sg.c}}" stroke-width="14" stroke-dasharray="{{sg.dash}}" stroke-dashoffset="{{sg.off}}" transform="rotate(-90 60 60)"></circle></sc-for>
</svg>
<div style="position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center"><b style="font-size: 26px; font-family: 'IBM Plex Mono', monospace">{{act.total}}</b><span style="font-size: 11px; color: #8FA3BF">결함</span></div>
</div>
<div style="display: flex; flex-direction: column; gap: 5px">
<span style="font-size: 13px; color: #C9D3E0">현장 조치</span>
<sc-for list="{{act.segs}}" as="sg" hint-placeholder-count="3"><span style="font-size: 15px"><span style="color: {{sg.c}}">■</span> {{sg.label}} <b style="font-family: 'IBM Plex Mono', monospace">{{sg.n}}</b></span></sc-for>
</div>
</div>
</div>

<!-- AI -->
<div style="background: #1A2E1F; border: 1px solid #2E6B3F; border-radius: 12px; padding: 10px 14px; display: flex; gap: 12px; align-items: center"><b style="font-size: 15px; color: #A6F4C5; white-space: nowrap">AI 요약</b><span style="font-size: 15px; line-height: 1.5; color: #D1FADF">{{cur.ai}}</span></div>

<!-- BIG: ALONG THE COIL -->
<div style="background: #13243D; border-radius: 16px; padding: 14px 18px; display: flex; flex-direction: column; gap: 6px">
<div style="display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap">
<b style="font-size: 18px"><span style="color: #F5B547">③</span> {{bigTitle}}</b>
<span style="font-size: 13px; color: #8FA3BF">막대 하나 = 판 한 장 · 높이 = 출렁 높이 · 색 = 등급</span>
<span style="margin-left: auto; display: flex; gap: 12px; font-size: 13px; color: #C9D3E0"><sc-for list="{{gradeBar}}" as="g" hint-placeholder-count="4"><span><span style="color: {{g.c}}">■</span> {{g.label}}</span></sc-for><span><span style="display: inline-block; width: 16px; border-top: 2px dashed #F04438; vertical-align: middle"></span> 기준 0.70</span></span>
</div>
<!-- box header -->
<sc-if value="{{isCoil}}" hint-placeholder-val="{{ true }}"><div style="display: flex; margin-left: 56px; gap: 0">
<sc-for list="{{boxHead}}" as="bh" hint-placeholder-count="4"><div style="flex: {{bh.f}} 1 0; min-width: 0; border-left: 2px solid #3A5375; padding: 2px 8px; display: flex; gap: 8px; align-items: baseline; white-space: nowrap; overflow: hidden"><b style="font-size: 14px">박스 {{bh.n}}</b><span style="font-size: 12px; color: #8FA3BF">{{bh.sub}}</span><span style="font-size: 12px; font-weight: 700; color: {{bh.vC}}">{{bh.v}}</span></div></sc-for>
</div></sc-if>
<!-- flatness bars -->
<div style="display: flex; gap: 8px">
<div style="width: 48px; flex: 0 0 48px; position: relative; height: 240px; font-size: 11px; color: #8FA3BF; font-family: 'IBM Plex Mono', monospace; text-align: right">
<sc-for list="{{yTicks}}" as="yt" hint-placeholder-count="4"><span style="position: absolute; right: 0; top: {{yt.top}}%; transform: translateY(-50%)">{{yt.label}}</span></sc-for>
</div>
<div style="position: relative; flex: 1 1 auto; height: 240px; background: #0F1E33; border-radius: 6px">
<svg viewBox="0 0 1000 240" preserveAspectRatio="none" style="position: absolute; inset: 0; width: 100%; height: 100%" role="img" aria-label="장별 평탄도 막대 그래프">
<sc-for list="{{yTicks}}" as="yt" hint-placeholder-count="4"><line x1="0" y1="{{yt.y}}" x2="1000" y2="{{yt.y}}" stroke="#1E3352" stroke-width="1" vector-effect="non-scaling-stroke"></line></sc-for>
<sc-for list="{{bars}}" as="b" hint-placeholder-count="40"><rect x="{{b.x}}" y="{{b.y}}" width="{{b.w}}" height="{{b.h}}" fill="{{b.c}}"></rect></sc-for>
<line x1="0" y1="{{limitY}}" x2="1000" y2="{{limitY}}" stroke="#F04438" stroke-width="2" stroke-dasharray="8 5" vector-effect="non-scaling-stroke"></line>
<sc-for list="{{boxLinesX}}" as="bl" hint-placeholder-count="3"><line x1="{{bl.x}}" y1="0" x2="{{bl.x}}" y2="240" stroke="#5B6B82" stroke-width="2" vector-effect="non-scaling-stroke"></line></sc-for>
</svg>
<sc-for list="{{flatCallouts}}" as="fc" hint-placeholder-count="2">
<div style="position: absolute; left: {{fc.x}}%; top: {{fc.top}}%; transform: translate(-50%, -100%); display: flex; flex-direction: column; align-items: center; pointer-events: none">
<span style="font-size: 12px; font-weight: 900; background: #F04438; color: #FFFFFF; border-radius: 6px; padding: 2px 7px; white-space: nowrap">{{fc.label}}</span>
<span style="width: 2px; height: 8px; background: #F04438"></span>
</div>
</sc-for>
<span style="position: absolute; left: 6px; top: {{limitPct}}%; transform: translateY(-120%); font-size: 11px; font-weight: 700; color: #FDA29B">기준 0.70 mm</span>
</div>
</div>
<!-- surface lane -->
<div style="display: flex; gap: 8px; margin-top: 6px">
<div style="width: 48px; flex: 0 0 48px; font-size: 11px; color: #D6BBFB; text-align: right; line-height: 1.3; padding-top: 18px">표면<br>(폭)</div>
<div style="position: relative; flex: 1 1 auto; height: 76px; background: #C9D1DC; border-radius: 6px">
<sc-for list="{{boxLinesPct}}" as="bl" hint-placeholder-count="3"><span style="position: absolute; left: {{bl.pct}}%; top: 0; bottom: 0; border-left: 2px solid #98A2B3"></span></sc-for>
<sc-if value="{{repeatOn}}" hint-placeholder-val="{{ false }}"><span style="position: absolute; left: 0; right: 0; top: 63%; border-top: 2px dashed #7F56D9"></span><span style="position: absolute; right: 8px; top: 63%; transform: translateY(-120%); font-size: 12px; font-weight: 900; color: #53389E">같은 자리 반복 ×6 — 롤 이물 의심</span></sc-if>
<sc-for list="{{surfDots}}" as="sd" hint-placeholder-count="2"><span style="position: absolute; left: {{sd.x}}%; top: {{sd.y}}%; transform: translate(-50%, -50%) rotate(45deg); width: 16px; height: 16px; background: #7F56D9; border: 3px solid #FFFFFF; box-sizing: border-box"></span></sc-for>
<sc-if value="{{noSurf}}" hint-placeholder-val="{{ false }}"><span style="position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 13px; color: #475467; font-weight: 700">표면 결함 없음</span></sc-if>
</div>
</div>
<!-- action lane -->
<div style="display: flex; gap: 8px">
<div style="width: 48px; flex: 0 0 48px; font-size: 11px; color: #8FA3BF; text-align: right; padding-top: 6px">조치</div>
<div style="position: relative; flex: 1 1 auto; height: 30px; border-bottom: 1px solid #3A5375">
<sc-for list="{{actMarks}}" as="am" hint-placeholder-count="3"><span style="position: absolute; left: {{am.x}}%; top: 2px; transform: translateX(-50%); font-size: 12px; font-weight: 900; color: #0B1626; background: {{am.c}}; border-radius: 6px; padding: 2px 6px; white-space: nowrap">{{am.label}}</span></sc-for>
</div>
</div>
<!-- x axis -->
<div style="display: flex; gap: 8px">
<div style="width: 48px; flex: 0 0 48px"></div>
<div style="position: relative; flex: 1 1 auto; height: 30px; font-size: 11px; color: #8FA3BF; font-family: 'IBM Plex Mono', monospace">
<sc-for list="{{xTicks}}" as="xt" hint-placeholder-count="6"><span style="position: absolute; left: {{xt.pct}}%; transform: translateX({{xt.tx}}); text-align: {{xt.al}}; line-height: 1.3; white-space: nowrap">{{xt.m}}<br><span style="color: #5B6B82">{{xt.t}}</span></span></sc-for>
</div>
</div>
</div>

<!-- ROW: 3 charts -->
<div style="display: grid; grid-template-columns: 1.25fr 1fr 0.9fr; gap: 12px">

<!-- box comparison -->
<sc-if value="{{isCoil}}" hint-placeholder-val="{{ true }}"><div style="background: #13243D; border-radius: 16px; padding: 14px 16px; display: flex; flex-direction: column; gap: 10px">
<b style="font-size: 16px"><span style="color: #F5B547">④</span> 박스별 품질 <span style="font-size: 12px; color: #8FA3BF; font-weight: 400">· 줄을 누르면 그 박스로</span></b>
<div style="display: grid; grid-template-columns: 54px 1fr 54px 54px 60px; gap: 10px; font-size: 12px; color: #8FA3BF"><span></span><span>장별 등급 (A → D)</span><span style="text-align: right">평탄</span><span style="text-align: right">표면</span><span style="text-align: right">출하</span></div>
<sc-for list="{{boxRows}}" as="r" hint-placeholder-count="4">
<button type="button" onClick="{{r.pick}}" style="display: grid; grid-template-columns: 54px 1fr 54px 54px 60px; gap: 10px; align-items: center; background: transparent; border: 0; padding: 2px 0; color: #FFFFFF; text-align: left">
<b style="font-size: 15px">박스 {{r.n}}</b>
<div style="display: flex; height: 26px; gap: 2px; border-radius: 4px; overflow: hidden; background: #0F1E33">
<sc-for list="{{r.segs}}" as="s" hint-placeholder-count="4"><div style="flex: {{s.f}} 1 0; min-width: 0; background: {{s.c}}; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 900; color: #0B1626">{{s.label}}</div></sc-for>
</div>
<b style="text-align: right; font-size: 16px; color: {{r.fC}}">{{r.nf}}</b>
<b style="text-align: right; font-size: 16px; color: {{r.sC}}">{{r.ns}}</b>
<b style="text-align: right; font-size: 16px; font-family: 'IBM Plex Mono', monospace">{{r.ship}}</b>
</button>
</sc-for>
<span style="font-size: 12px; color: #8FA3BF">{{boxInsight}}</span>
</div></sc-if>
<sc-if value="{{isBox}}" hint-placeholder-val="{{ false }}"><div style="background: #13243D; border-radius: 16px; padding: 14px 16px; display: flex; flex-direction: column; gap: 10px">
<b style="font-size: 16px"><span style="color: #F5B547">④</span> 이 박스의 불량 장</b>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px">
<sc-for list="{{boxDefs}}" as="bd" hint-placeholder-count="2">
<div style="background: #0F1E33; border-radius: 10px; overflow: hidden; display: flex; flex-direction: column">
<div style="position: relative; height: 92px"><img src="{{bd.img}}" alt="{{bd.sub}}" style="width: 100%; height: 100%; object-fit: cover; object-position: {{bd.op}}; display: block"><span style="position: absolute; left: 6px; top: 6px; font-size: 11px; font-weight: 900; color: #0B1626; background: {{bd.tC}}; border-radius: 6px; padding: 1px 6px">{{bd.tLabel}}</span><span style="position: absolute; right: 6px; bottom: 6px; font-size: 12px; font-weight: 900; color: #0B1626; background: {{bd.aC}}; border-radius: 6px; padding: 1px 6px">{{bd.act}}</span></div>
<div style="padding: 6px 8px; display: flex; flex-direction: column; gap: 1px"><b style="font-size: 14px">{{bd.sub}} <span style="font-family: 'IBM Plex Mono', monospace; color: #FDA29B; font-size: 13px">{{bd.val}}</span></b><span style="font-size: 12px; color: #C9D3E0">{{bd.sheet}}번째 장 · {{bd.where}}</span></div>
</div>
</sc-for>
</div>

      toastOn: !!S.toast, toast: S.toast || { title: '', body: '', code: '' }, closeToast: function () { self.setState({ toast: null }); }, pbars: pbars, pLimitY: pY(700).toFixed(1), pLimitPct: (pY(700) / 120 * 100).toFixed(1), pxTicks: pxTicks, pGrade: pGrade, qr: qr, howSteps: howSteps, rules: rules, dataRows: dataRows, langOpts: langOpts
    };
  }
}
