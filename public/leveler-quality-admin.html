<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1280">
<title>레벨러 품질 Admin (PC · 테스트) · 오성철강</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&family=IBM+Plex+Mono:wght@500;600;700&display=swap" rel="stylesheet">
<style>
html,body{margin:0;background:#F3F5FE}
button{font-family:inherit;cursor:pointer}

</style>
</head>
<body>
<!-- Mockup for field test (sample data only). Source: 레벨링 통합 대시보드 목업 / AdminPC.dc.html -->
<div id="stage"></div>

<template id="tpl">
<div style="min-width: 1280px; min-height: 100vh; background: #F3F5FE; color: #0F1E33; font-family: 'Noto Sans KR', system-ui, sans-serif; display: flex; flex-direction: column; position: relative">

<!-- HEADER -->
<header style="height: 64px; flex: 0 0 64px; background: #FFFFFF; border-bottom: 1px solid #E3E8F0; display: flex; align-items: center; gap: 16px; padding: 0 24px; position: sticky; top: 0; z-index: 5">
<span style="width: 36px; height: 36px; border-radius: 10px; background: #0F1E33; color: #F5B547; font-weight: 900; display: flex; align-items: center; justify-content: center; font-size: 14px">AI</span>
<div style="display: flex; flex-direction: column; line-height: 1.15"><span style="font-size: 11px; font-weight: 700; color: #796CBF; letter-spacing: 1px">OHSUNG STEEL</span><b style="font-size: 18px">레벨러 품질 Admin</b></div>
<nav style="display: flex; gap: 2px; margin-left: 24px; height: 64px">
<sc-for list="{{tabs}}" as="tb" hint-placeholder-count="4">
<button type="button" onClick="{{tb.pick}}" style="height: 64px; padding: 0 18px; border: 0; border-bottom: 3px solid {{tb.line}}; background: transparent; color: {{tb.fg}}; font-size: 15px; font-weight: 700">{{tb.label}}</button>
</sc-for>
</nav>
<div style="margin-left: auto; display: flex; align-items: center; gap: 10px">
<span style="height: 38px; border: 1px solid #E3E8F0; border-radius: 10px; padding: 0 14px; display: flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 700">📅 2026-11-02 (월)</span>
<span style="font-size: 12px; color: #7D8BA1">화면 설계용 샘플 데이터</span>
</div>
</header>

<div style="flex: 1 1 auto; display: flex; align-items: flex-start">

<!-- SIDEBAR -->
<aside style="flex: 0 0 300px; align-self: stretch; background: #FFFFFF; border-right: 1px solid #E3E8F0; padding: 18px 16px; box-sizing: border-box; display: flex; flex-direction: column; gap: 10px">
<div style="display: flex; justify-content: space-between; align-items: baseline"><b style="font-size: 16px">코일</b><span style="font-size: 13px; color: #7D8BA1">오늘 {{coilCount}}개</span></div>
<div style="height: 40px; border-radius: 10px; border: 1px solid #E3E8F0; background: #F8F9FC; display: flex; align-items: center; padding: 0 12px; font-size: 14px; color: #98A2B3">🔍 코일번호 · 업체</div>
<sc-for list="{{coils}}" as="c" hint-placeholder-count="4">
<button type="button" onClick="{{c.pick}}" style="background: {{c.bg}}; border: 1.5px solid {{c.bd}}; border-radius: 12px; padding: 12px 14px; color: #0F1E33; text-align: left; display: flex; flex-direction: column; gap: 5px">
<span style="display: flex; justify-content: space-between; width: 100%; font-size: 12px; color: #7D8BA1"><span>{{c.cust}} · {{c.time}}</span><span style="font-weight: 700; color: {{c.stC}}">{{c.st}}</span></span>
<b style="font-size: 18px; font-family: 'IBM Plex Mono', monospace">{{c.id}}</b>
<span style="font-size: 13px; color: #5C6478">{{c.spec}} · {{c.kg}}</span>
<span style="display: flex; gap: 6px; flex-wrap: wrap">
<span style="font-size: 12px; font-weight: 700; color: {{c.vFg}}; background: {{c.vBg}}; border-radius: 999px; padding: 2px 10px">{{c.vLabel}}</span>
<span style="font-size: 12px; color: #B54708; background: #FFFAEB; border-radius: 999px; padding: 2px 10px">평탄 {{c.nf}}</span>
<span style="font-size: 12px; color: #6941C6; background: #F4F3FF; border-radius: 999px; padding: 2px 10px">표면 {{c.ns}}</span>
</span>
</button>
</sc-for>
</aside>

<main style="flex: 1 1 auto; min-width: 0; padding: 20px 24px 40px; box-sizing: border-box; display: flex; flex-direction: column; gap: 16px">

<!-- COIL HEADER -->
<section style="background: #FFFFFF; border: 1px solid #E3E8F0; border-radius: 16px; padding: 16px 20px; display: flex; flex-wrap: wrap; align-items: center; gap: 24px">
<div style="display: flex; flex-direction: column; gap: 4px; flex: 1 1 320px; min-width: 0">
<span style="font-size: 13px; color: #7D8BA1">{{cur.cust}} · {{cur.time}} · <span style="font-weight: 700; color: {{cur.stC}}">{{cur.st}}</span></span>
<b style="font-size: 28px; font-family: 'IBM Plex Mono', monospace; line-height: 1.1">{{cur.id}}</b>
<span style="font-size: 15px; color: #5C6478">{{cur.spec}} · {{cur.kg}} · 절단 {{cur.cut}} · {{cur.len}} m · 박스 {{cur.nBox}}개</span>
</div>
<div style="display: flex; gap: 8px; flex-wrap: wrap">
<sc-for list="{{kpis}}" as="k" hint-placeholder-count="5">
<div style="min-width: 118px; border: 1px solid #E3E8F0; border-top: 4px solid {{k.c}}; border-radius: 12px; padding: 8px 12px; display: flex; flex-direction: column; gap: 2px"><span style="font-size: 12px; color: #7D8BA1">{{k.k}}</span><b style="font-size: 22px; color: {{k.c}}; white-space: nowrap">{{k.v}}</b><span style="font-size: 12px; color: #5C6478; white-space: nowrap">{{k.s}}</span></div>
</sc-for>
</div>
</section>

<!-- ============ PAGE: 품질 보기 ============ -->
<sc-if value="{{isView}}" hint-placeholder-val="{{ false }}">
<section style="background: #ECFDF3; border: 1px solid #ABEFC6; border-radius: 14px; padding: 12px 18px; display: flex; gap: 14px; align-items: center"><b style="color: #067647; white-space: nowrap">AI 요약</b><span style="font-size: 15px; line-height: 1.55; color: #054F31">{{cur.ai}}</span></section>
<section style="background: #FFFFFF; border: 1px solid #E3E8F0; border-radius: 16px; padding: 18px 20px; display: flex; flex-direction: column; gap: 12px">
<div style="display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap"><b style="font-size: 18px">평탄도 — 판이 얼마나 출렁이나</b><span style="font-size: 13px; color: #7D8BA1">한 칸 = 한 장 · 빨간 칸을 누르면 그 불량 이미지로 이동</span>
<span style="margin-left: auto; display: flex; gap: 14px; flex-wrap: wrap">
<sc-for list="{{grades}}" as="gr" hint-placeholder-count="4"><span style="display: flex; align-items: center; gap: 6px; font-size: 13px"><svg viewBox="0 0 80 28" style="width: 44px; height: 18px" role="img" aria-label="{{gr.label}}"><line x1="2" y1="25" x2="78" y2="25" stroke="#D0D5DD" stroke-width="2"></line><path d="{{gr.path}}" fill="none" stroke="{{gr.c}}" stroke-width="4" stroke-linecap="round"></path></svg><b style="color: {{gr.tc}}">{{gr.label}}</b><span style="color: #7D8BA1">{{gr.desc}}</span></span></sc-for>
</span></div>
<sc-for list="{{boxRows}}" as="r" hint-placeholder-count="4">
<div style="display: grid; grid-template-columns: 90px 1fr 110px; gap: 14px; align-items: center">
<span style="display: flex; flex-direction: column; line-height: 1.25"><b style="font-size: 16px">박스 {{r.n}}</b><span style="font-size: 12px; color: #7D8BA1; font-family: 'IBM Plex Mono', monospace">{{r.sheets}}</span></span>
<div style="display: flex; gap: 2px; height: 34px">
<sc-for list="{{r.cells}}" as="ce" hint-placeholder-count="30">
<sc-if value="{{ce.isD}}" hint-placeholder-val="{{ false }}"><button type="button" onClick="{{ce.open}}" aria-label="{{ce.label}}" style="flex: 1 1 0; min-width: 0; padding: 0; border-radius: 3px; background: #F04438; border: 2px solid #0F1E33; box-sizing: border-box"></button></sc-if>
<sc-if value="{{ce.isN}}" hint-placeholder-val="{{ true }}"><span style="flex: 1 1 0; min-width: 0; border-radius: 3px; background: {{ce.c}}"></span></sc-if>
</sc-for>
</div>
<span style="font-size: 13px; color: #5C6478">불량 <b style="color: {{r.fC}}">{{r.nf}}</b> · 표면 <b style="color: {{r.sC}}">{{r.ns}}</b></span>
</div>
</sc-for>
<span style="font-size: 12px; color: #98A2B3">※ 높이(mm)는 AI 평탄도 값(예: 1,209)을 환산한 예시 — 실제 단위는 카메라 값 확인 후 확정.</span>
</section>
<section style="background: #FFFFFF; border: 1px solid #E3E8F0; border-radius: 16px; padding: 18px 20px; display: flex; flex-direction: column; gap: 10px">
<div style="display: flex; align-items: baseline; gap: 12px"><b style="font-size: 18px">표면 결함 — 코일 길이 따라</b><span style="font-size: 13px; color: #7D8BA1">위에서 본 판 · 위아래 = 폭 방향 · ◆를 누르면 그 불량 이미지로 이동</span></div>
<div style="position: relative; height: 120px; background: #E4E7EC; border-radius: 6px">
<sc-for list="{{boxLines}}" as="bl" hint-placeholder-count="3"><span style="position: absolute; left: {{bl.pct}}%; top: 0; bottom: 0; border-left: 1px dashed #98A2B3"></span></sc-for>
<sc-if value="{{repeatOn}}" hint-placeholder-val="{{ false }}"><span style="position: absolute; left: 0; right: 0; top: 63%; border-top: 2px dashed #7F56D9; opacity: 0.6"></span><span style="position: absolute; right: 10px; top: 63%; transform: translateY(-130%); font-size: 12px; font-weight: 700; color: #53389E">같은 자리 반복 — 롤 이물 의심</span></sc-if>
<sc-for list="{{surfDots}}" as="sd" hint-placeholder-count="2"><button type="button" onClick="{{sd.open}}" aria-label="{{sd.label}}" style="position: absolute; left: {{sd.x}}%; top: {{sd.y}}%; transform: translate(-50%, -50%) rotate(45deg); width: 18px; height: 18px; background: #7F56D9; border: 3px solid #FFFFFF; box-sizing: border-box; padding: 0"></button></sc-for>
</div>
<div style="position: relative; height: 16px; font-size: 12px; color: #7D8BA1; font-family: 'IBM Plex Mono', monospace"><span style="position: absolute; left: 0">0 m</span><sc-for list="{{boxLabels}}" as="bb" hint-placeholder-count="4"><span style="position: absolute; left: {{bb.pct}}%; transform: translateX(-50%); color: #344054">박스 {{bb.n}}</span></sc-for><span style="position: absolute; right: 0">{{cur.len}} m</span></div>
</section>
</sc-if>

<!-- ============ PAGE: 불량 이미지 ============ -->
<sc-if value="{{isImg}}" hint-placeholder-val="{{ true }}">
<section style="display: flex; flex-wrap: wrap; align-items: center; gap: 12px">
<b style="font-size: 20px">불량 이미지</b><span style="font-size: 14px; color: #7D8BA1">불량 하나마다 원본 · 확대 · 비교 3장</span>
<span style="display: flex; gap: 6px; margin-left: 12px"><sc-for list="{{imgBoxOpts}}" as="o" hint-placeholder-count="4"><button type="button" onClick="{{o.pick}}" style="{{o.style}}">{{o.label}}</button></sc-for></span>
<span style="display: flex; gap: 6px"><sc-for list="{{imgTypeOpts}}" as="o" hint-placeholder-count="3"><button type="button" onClick="{{o.pick}}" style="{{o.style}}">{{o.label}}</button></sc-for></span>
<button type="button" onClick="{{toggleOver}}" style="{{overStyle}}">{{overLabel}}</button>
<button type="button" onClick="{{zipAllImg}}" style="margin-left: auto; height: 42px; padding: 0 18px; border-radius: 10px; border: 0; background: #0F1E33; color: #FFFFFF; font-size: 14px; font-weight: 700">⬇ 보이는 불량 사진 전체 받기 ({{imgFileCount}}장 · ZIP)</button>
</section>
<section style="display: grid; grid-template-columns: repeat(auto-fill, minmax(460px, 1fr)); gap: 16px">
<sc-for list="{{defCards}}" as="d" hint-placeholder-count="4">
<article style="background: #FFFFFF; border: {{d.border}}; border-radius: 16px; padding: 16px; display: flex; flex-direction: column; gap: 12px">
<div style="display: flex; align-items: center; gap: 8px; flex-wrap: wrap">
<span style="font-size: 12px; font-weight: 700; color: {{d.tFg}}; background: {{d.tBg}}; border-radius: 6px; padding: 3px 8px">{{d.tLabel}}</span>
<b style="font-size: 19px">{{d.sub}}</b>
<span style="font-size: 13px; color: #7D8BA1">#{{d.no}}</span>
<span style="margin-left: auto; font-size: 15px; font-weight: 700; font-family: 'IBM Plex Mono', monospace; color: #B42318">{{d.val}}</span>
</div>
<div style="display: flex; flex-wrap: wrap; gap: 8px; font-size: 13px">
<span style="background: #F3F5FE; border-radius: 8px; padding: 4px 10px"><b>박스 {{d.box}}</b> · {{d.sheet}}번째 장</span>
<span style="background: #F3F5FE; border-radius: 8px; padding: 4px 10px">코일 {{d.m}} m</span>
<span style="background: #F3F5FE; border-radius: 8px; padding: 4px 10px">{{d.where}}</span>
<span style="background: #F3F5FE; border-radius: 8px; padding: 4px 10px">{{d.time}}</span>
<span style="margin-left: auto; font-weight: 700; color: {{d.aC}}">현장 {{d.act}}</span><span style="font-weight: 700; color: {{d.rC}}">· {{d.rev}}</span>
</div>
<div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px">
<figure style="margin: 0; display: flex; flex-direction: column; gap: 4px">
<div style="position: relative; height: 150px; border-radius: 10px; overflow: hidden; background: #000000"><img src="{{d.img}}" alt="{{d.sub}} 원본" style="width: 100%; height: 100%; object-fit: cover; display: block"><span style="position: absolute; left: {{d.rx}}%; top: {{d.ry}}%; width: {{d.rw}}%; height: {{d.rh}}%; transform: translate(-50%, -50%); border: 3px solid #F04438; border-radius: 6px"></span></div>
<figcaption style="font-size: 12px; color: #5C6478">① 원본 프레임</figcaption>
</figure>
<figure style="margin: 0; display: flex; flex-direction: column; gap: 4px">
<div style="position: relative; height: 150px; border-radius: 10px; overflow: hidden; background: #000000"><img src="{{d.img}}" alt="{{d.sub}} 확대" style="width: 100%; height: 100%; object-fit: cover; display: block; transform: scale(2.4); transform-origin: {{d.rx}}% {{d.ry}}%"><span style="position: absolute; right: 6px; top: 6px; font-size: 11px; font-weight: 700; color: #FFFFFF; background: rgba(0,0,0,0.6); border-radius: 4px; padding: 1px 6px">×2.4</span></div>
<figcaption style="font-size: 12px; color: #5C6478">② 결함 확대</figcaption>
</figure>
<figure style="margin: 0; display: flex; flex-direction: column; gap: 4px">
<sc-if value="{{d.isSurf}}" hint-placeholder-val="{{ true }}"><div style="position: relative; height: 150px; border-radius: 10px; overflow: hidden; background: #000000"><img src="{{d.img}}" alt="앞 장 같은 자리" style="width: 100%; height: 100%; object-fit: cover; display: block; transform: scale(2.4); transform-origin: {{d.cx}}% {{d.ry}}%; filter: brightness(1.08)"><span style="position: absolute; left: 6px; bottom: 6px; font-size: 11px; font-weight: 700; color: #FFFFFF; background: {{d.cmpBg}}; border-radius: 4px; padding: 1px 6px">{{d.cmpTag}}</span></div>
<figcaption style="font-size: 12px; color: #5C6478">③ 앞 장 같은 자리 ({{d.prevSheet}}번째 장)</figcaption></sc-if>
<sc-if value="{{d.isFlat}}" hint-placeholder-val="{{ false }}"><div style="height: 150px; border-radius: 10px; background: #F8F9FC; border: 1px solid #E3E8F0; box-sizing: border-box; padding: 8px; display: flex; flex-direction: column; gap: 4px; justify-content: center">
<span style="font-size: 11px; color: #7D8BA1">옆에서 본 판</span>
<sc-if value="{{d.isEdge}}" hint-placeholder-val="{{ true }}"><svg viewBox="0 0 300 54" style="width: 100%; height: 44px" role="img" aria-label="가장자리 출렁"><line x1="4" y1="48" x2="296" y2="48" stroke="#98A2B3" stroke-width="2"></line><path d="M8 40 Q22 14 36 40 T64 40 L236 40 Q250 14 264 40 T292 40" fill="none" stroke="#0F1E33" stroke-width="5" stroke-linecap="round"></path><line x1="22" y1="40" x2="22" y2="20" stroke="#F04438" stroke-width="3"></line></svg></sc-if>
<sc-if value="{{d.isBuckle}}" hint-placeholder-val="{{ false }}"><svg viewBox="0 0 300 54" style="width: 100%; height: 44px" role="img" aria-label="가운데 볼록"><line x1="4" y1="48" x2="296" y2="48" stroke="#98A2B3" stroke-width="2"></line><path d="M8 42 L100 42 Q150 10 200 42 L292 42" fill="none" stroke="#0F1E33" stroke-width="5" stroke-linecap="round"></path><line x1="150" y1="42" x2="150" y2="22" stroke="#F04438" stroke-width="3"></line></svg></sc-if>
<span style="font-size: 12px; color: #B42318; font-weight: 700">{{d.val}} 뜸 · 기준 0.70 mm</span>
<span style="font-size: 11px; color: #5C6478; line-height: 1.35">{{d.explain}}</span>
</div>
<figcaption style="font-size: 12px; color: #5C6478">③ 레이저 단면 (모양)</figcaption></sc-if>
</figure>
</div>
<span style="font-size: 13px; line-height: 1.5; color: #344054; background: #F8F9FC; border-radius: 10px; padding: 8px 12px">AI · {{d.ai}}</span>
<div style="display: flex; gap: 8px; flex-wrap: wrap">
<button type="button" onClick="{{d.dl}}" style="height: 40px; padding: 0 14px; border-radius: 10px; border: 1px solid #0F1E33; background: #FFFFFF; color: #0F1E33; font-size: 14px; font-weight: 700">⬇ 이 불량 사진 3장</button>
<button type="button" onClick="{{d.toVideo}}" style="height: 40px; padding: 0 14px; border-radius: 10px; border: 1px solid #E3E8F0; background: #FFFFFF; color: #796CBF; font-size: 14px; font-weight: 700">▶ 전체 영상에서 이 순간 보기</button>
<span style="margin-left: auto; display: flex; gap: 6px"><sc-for list="{{d.revBtns}}" as="rb" hint-placeholder-count="3"><button type="button" onClick="{{rb.pick}}" style="{{rb.style}}">{{rb.label}}</button></sc-for></span>
</div>
</article>
</sc-for>
</section>
<sc-if value="{{noDefs}}" hint-placeholder-val="{{ false }}"><section style="background: #FFFFFF; border: 1px solid #E3E8F0; border-radius: 16px; padding: 48px; text-align: center; color: #067647; font-size: 18px; font-weight: 700">✓ 조건에 맞는 불량이 없습니다</section></sc-if>
</sc-if>

<!-- ============ PAGE: 전체 영상 ============ -->
<sc-if value="{{isVideo}}" hint-placeholder-val="{{ false }}">
<section style="display: flex; align-items: center; gap: 12px; flex-wrap: wrap">
<b style="font-size: 20px">전체 영상</b><span style="font-size: 14px; color: #7D8BA1">코일 처음부터 끝까지 녹화 · 카메라 2대</span>
<span style="display: flex; gap: 6px; margin-left: 12px"><sc-for list="{{camOpts}}" as="o" hint-placeholder-count="2"><button type="button" onClick="{{o.pick}}" style="{{o.style}}">{{o.label}}</button></sc-for></span>
<button type="button" onClick="{{dlBoth}}" style="margin-left: auto; height: 42px; padding: 0 18px; border-radius: 10px; border: 0; background: #0F1E33; color: #FFFFFF; font-size: 14px; font-weight: 700">⬇ 두 카메라 전체 받기 ({{vid.bothSize}})</button>
</section>
<section style="display: grid; grid-template-columns: minmax(0, 1.6fr) minmax(360px, 1fr); gap: 16px; align-items: start">
<div style="background: #0B1626; border-radius: 16px; padding: 14px; display: flex; flex-direction: column; gap: 10px">
<div style="position: relative; aspect-ratio: 16 / 9; border-radius: 10px; overflow: hidden; background: #000000">
<img src="{{vid.img}}" alt="{{vid.camName}} 녹화" style="width: 100%; height: 100%; object-fit: cover; display: block">
<span style="position: absolute; left: 12px; top: 12px; font-size: 14px; font-family: 'IBM Plex Mono', monospace; color: #FFFFFF; background: rgba(0,0,0,0.65); border-radius: 6px; padding: 4px 10px">{{vid.camName}} · {{vid.clock}} · {{vid.where}}</span>
<span style="position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); width: 84px; height: 84px; border-radius: 50%; background: rgba(11,22,38,0.7); border: 3px solid #FFFFFF; color: #FFFFFF; font-size: 32px; display: flex; align-items: center; justify-content: center">▶</span>
<sc-if value="{{vid.atDefect}}" hint-placeholder-val="{{ false }}"><span style="position: absolute; right: 12px; top: 12px; font-size: 14px; font-weight: 900; color: #FFFFFF; background: #F04438; border-radius: 6px; padding: 4px 10px">⚠ {{vid.defName}}</span></sc-if>
</div>
<div style="position: relative; height: 46px">
<div style="position: absolute; left: 0; right: 0; top: 14px; height: 18px; display: flex; gap: 2px">
<sc-for list="{{vid.segs}}" as="sg" hint-placeholder-count="4"><button type="button" onClick="{{sg.pick}}" style="flex: {{sg.f}} 1 0; height: 18px; padding: 0; border: 0; border-radius: 3px; background: {{sg.bg}}; color: #FFFFFF; font-size: 11px; font-weight: 700">{{sg.label}}</button></sc-for>
</div>
<sc-for list="{{vid.marks}}" as="mk" hint-placeholder-count="3"><button type="button" onClick="{{mk.pick}}" aria-label="{{mk.label}}" style="position: absolute; left: {{mk.x}}%; top: 4px; transform: translateX(-50%); width: 14px; height: 14px; border-radius: 50%; padding: 0; border: 2px solid #FFFFFF; background: {{mk.c}}"></button></sc-for>
<span style="position: absolute; left: {{vid.posPct}}%; top: 8px; width: 3px; height: 32px; background: #F5B547; transform: translateX(-50%); border-radius: 2px"></span>
</div>

(function(){

  function hole(str){ var m=/^\s*\{\{([^}]+)\}\}\s*$/.exec(str||''); return m?m[1]:null; }
  function render(node, scope, out){
    if(node.nodeType===3){ out.push(document.createTextNode(sub(node.nodeValue,scope))); return; }
    if(node.nodeType!==1) return;
    var tag=node.localName;

    }
    var c=[]; kids(node,scope,c); c.forEach(function(x){el.appendChild(x);});
    out.push(el);
  }
  function kids(node,scope,out){ for(var ch=node.firstChild; ch; ch=ch.nextSibling) render(ch,scope,out); }
  window.DCLogic=function(props){ this.props=props||{}; this.state={}; };
  DCLogic.prototype.setState=function(p){ Object.assign(this.state,p); this.__render(); };
