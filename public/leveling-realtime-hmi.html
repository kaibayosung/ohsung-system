<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>레벨링 실시간 전체 데이터</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
  * { box-sizing: border-box; }
  html, body { margin:0; min-height:100%; background:#eef1f6; font-family:"Pretendard",system-ui,sans-serif; -webkit-text-size-adjust:100%; }
  body { display:flex; justify-content:center; padding:16px; }
  #app { width:100%; max-width:720px; }

  .real-note {
    display:flex; gap:8px; align-items:flex-start; background:#e6f1fb; border:1px solid #b5d4f4;
    border-radius:12px; padding:10px 14px; font-size:12.5px; color:#185fa5; line-height:1.5; margin-bottom:12px;
  }
  .stale-note {
    display:flex; gap:8px; align-items:flex-start; background:#fdeceb; border:1px solid #f6c7c2;
    border-radius:12px; padding:10px 14px; font-size:12.5px; color:#a8332a; line-height:1.5; margin-bottom:12px;
  }

  .panel { background:#c9c7be; border-radius:18px; padding:16px; margin-bottom:12px; }
  .panel-inner { background:#f4f3ee; border-radius:6px; padding:20px 22px; }

  .panel-header { display:flex; justify-content:space-between; align-items:center; margin-bottom:6px; }
  .panel-title { font-size:16px; font-weight:500; color:#222; }
  .panel-tag { font-size:11px; font-weight:500; color:#666; border:1px solid #999; border-radius:4px; padding:3px 10px; }
  .panel-sub { font-size:11px; color:#8a8a86; margin-bottom:14px; }

  .badge-row { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:16px; }
  .badge { font-size:12px; font-weight:500; padding:4px 10px; border-radius:4px; }
  .badge.run { background:#dcefe0; color:#1e6b3c; }
  .badge.stop { background:#fbe4e2; color:#a8332a; }
  .badge.meta { background:#e8e6dc; color:#555; }

  .group-title { font-size:11px; font-weight:500; color:#666; margin-bottom:6px; }
  .field-grid { display:grid; grid-template-columns:1.3fr 1fr; gap:8px 20px; margin-bottom:16px; }
  .field-label { font-size:12.5px; color:#333; align-self:center; }
  .field-label.hi { color:#c0392b; font-weight:500; }
  .field-value {
    background:#dfe2e8; border:1px solid #9aa; border-radius:4px; padding:8px 12px;
    font-size:15px; font-weight:500; color:#222; text-align:right;
  }
  .field-value.big { font-size:17px; }
  .field-value.hi { color:#c0392b; }
  .field-value.live { background:#fbfbf7; }
  .field-unit { font-size:11px; color:#666; }

  .disclaimer { padding-top:10px; border-top:1px solid #ccc; }
  .disclaimer-text { font-size:11px; color:#8a8a86; line-height:1.5; }

  .status-msg { font-size:14px; color:#7d8ba1; padding:14px 2px; text-align:center; }
</style>
</head>
<body>
<div id="app"></div>

<script>
/* leveler-explore Edge Function 실데이터 사용. 인증 헤더 불필요(공개 함수). sql 모드로 LEVELING_DATA 최신 1행을 그대로 가져옵니다. */
const FN_URL = "https://mnlnbwcbgfgftdgawanh.supabase.co/functions/v1/leveler-explore";
const REFRESH_MS = 5000;

function num(v){ const n = parseFloat(v); return Number.isFinite(n) ? n : 0; }
function fmtNum(v, digits){
  if (v === null || v === undefined || v === '') return '-';
  const n = num(v);
  return digits ? n.toFixed(digits) : n.toLocaleString();
}
function fmtTs(ts){
  if (!ts) return '-';
  // leveler-explore가 돌려주는 ts는 이미 "UTC로 잘못 태깅된 KST 숫자"라 +9h를 더 더하면 안 됩니다(이중 보정 버그, 2026-08-21 수정).
  const d = new Date(ts);
  const hh = String(d.getUTCHours()).padStart(2,'0');
  const mm = String(d.getUTCMinutes()).padStart(2,'0');
  const ss = String(d.getUTCSeconds()).padStart(2,'0');
  return `${hh}:${mm}:${ss}`;
}

async function fetchLatestRow(){
  const sql = "SELECT * FROM LEVELING_DATA ORDER BY ID DESC LIMIT 1";
  try {
    const res = await fetch(`${FN_URL}?sql=${encodeURIComponent(sql)}`);
    const json = await res.json();
    // sql 모드 성공 응답에는 ok 필드가 없고 rows/rowCount/sql만 있습니다(leveler-explore 소스 확인).
    // 실패 시에만 { ok:false, error } 형태로 옵니다.
    if (json.ok === false) throw new Error(json.error || 'unknown error');
    const rows = json.rows || [];
    return rows.length ? rows[0] : null;
  } catch (err) {
    console.error('leveler-explore 조회 실패:', err);
    return undefined; // undefined = 네트워크/쿼리 실패, null = 데이터 없음(정상)
  }
}

function field(label, value, unit, opts){
  opts = opts || {};
  const labelCls = 'field-label' + (opts.hi ? ' hi' : '');
  const valueCls = 'field-value' + (opts.big ? ' big' : '') + (opts.hi ? ' hi' : '') + (opts.live ? ' live' : '');
  return `
    <div class="${labelCls}">${label}</div>
    <div class="${valueCls}">${value}${unit ? ` <span class="field-unit">${unit}</span>` : ''}</div>
  `;
}

let failCount = 0;

function render(row){
  const app = document.getElementById('app');
  const noteHtml = failCount > 0
    ? `<div class="stale-note">⚠️ 최근 조회에 실패했습니다 (${failCount}회 연속). 이전 값을 계속 보여주는 중이며, 5초마다 재시도합니다.</div>`
    : `<div class="real-note">📡 leveler-explore 실측 데이터를 그대로 보여줍니다 (샘플 아님). LEVELING_DATA 테이블의 가장 최근 1행이며 5초마다 자동 갱신됩니다.</div>`;

  if (row === null) {
    app.innerHTML = `${noteHtml}<div class="panel"><div class="panel-inner"><div class="status-msg">아직 수집된 레벨링 데이터가 없습니다.</div></div></div>`;
    return;
  }
  if (row === undefined) {
    // 최초 로드 실패 — 표시할 이전 값조차 없는 경우
    app.innerHTML = `${noteHtml}<div class="panel"><div class="panel-inner"><div class="status-msg">데이터를 불러오지 못했습니다. 잠시 후 다시 시도합니다.</div></div></div>`;
    return;
  }

  const isRun = String(row.RUN) === '1';

  app.innerHTML = `
    ${noteHtml}
    <div class="panel">
      <div class="panel-inner">

        <div class="panel-header">
          <div class="panel-title">레벨링 실시간 전체 데이터</div>
          <div class="panel-tag">HMI 미러</div>
        </div>
        <div class="panel-sub">LEVELING_DATA 테이블 19개 컬럼 전체 · 5초 자동 갱신</div>

        <div class="badge-row">
          <span class="badge ${isRun ? 'run' : 'stop'}">${isRun ? 'RUN = 1 (실행중)' : 'RUN = 0 (정지)'}</span>
          <span class="badge meta">코일 ${row.COIL_ID || '-'} · 박스 ${row.BOXIDX ?? '-'}</span>
          <span class="badge meta">ID ${row.ID ?? '-'}</span>
          <span class="badge meta">${fmtTs(row.TIMESTAMP)} 기준</span>
        </div>

        <div class="group-title">설정값 (HMI 화면 표시 항목)</div>
        <div class="field-grid">
          ${field('절단길이 설정 (CUTLENSET)', fmtNum(row.CUTLENSET), 'mm', { hi:true, big:true })}
          ${field('절단길이 + 보정 (CUTLENCORR)', fmtNum(row.CUTLENCORR), 'mm')}
          ${field('저속길이 설정 (SLOWLENSET)', fmtNum(row.SLOWLENSET), 'mm')}
          ${field('속도 설정 (SPEEDSET)', fmtNum(row.SPEEDSET, 1), 'm/min', { hi:true })}
          ${field('가속시간 (ACCTM)', fmtNum(row.ACCTM, 1), '초')}
          ${field('감속시간 (DECTM)', fmtNum(row.DECTM, 1), '초')}
        </div>

        <div class="group-title">실시간 측정값 (HMI엔 없고 DB에만 있는 항목 포함)</div>
        <div class="field-grid">
          ${field('현재 이동길이 sv (MOVELENSV)', fmtNum(row.MOVELENSV), 'mm', { big:true, live:true })}
          ${field('현재 이동길이 eco (MOVELENECO)', fmtNum(row.MOVELENECO), 'mm', { hi:true })}
          ${field('위치 (POS)', fmtNum(row.POS))}
          ${field('인버터속도계수 (INVERTERSPEEDCOEFF)', fmtNum(row.INVERTERSPEEDCOEFF))}
          ${field('인버터 현속도% (INVERTERSPEEDPER)', fmtNum(row.INVERTERSPEEDPER, 1), '%')}
          ${field('절단속도 (CUTSPEED)', fmtNum(row.CUTSPEED, 1), 'm/min')}
          ${field('속도 pps (SPEEDPPS)', fmtNum(row.SPEEDPPS))}
          ${field('1행정시간 (CYCLETM)', fmtNum(row.CYCLETM, 1), '초')}
        </div>

        <div class="disclaimer">
          <div class="disclaimer-text">P17 / 서보온 / 서보드라이버 에러 같은 PLC 알람·인터록 코드는 지금 구조로는 수집되지 않아 표시할 수 없습니다. 위 항목은 LEVELING_DATA 테이블에 실제로 존재하는 컬럼 전부입니다.</div>
        </div>

      </div>
    </div>
  `;
}

let lastGoodRow;

async function tick(){
  const row = await fetchLatestRow();
  if (row === undefined) {
    failCount += 1;
    render(lastGoodRow === undefined ? undefined : lastGoodRow);
  } else {
    failCount = 0;
    lastGoodRow = row;
    render(row);
  }
}

tick();
setInterval(tick, REFRESH_MS);
</script>
</body>
</html>
