  .status-chip.g { background:#e6f1fb; color:#185fa5; }

<script>
const SUPABASE_URL = "https://mnlnbwcbgfgftdgawanh.supabase.co";
const ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im1ubG5id2NiZ2ZnZnRkZ2F3YW5oIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Njk0NTYxMDQsImV4cCI6MjA4NTAzMjEwNH0.-tS-m6hezjEclG0er5yUXERisE0uE3BYVJlviJKkQAo";
const TABLE = "ai_tension_readings";
const SETTINGS_TABLE = "ai_tension_settings";
const POLL_MS = 8000;
const CAPTURE_INTERVAL_SEC = 120; // ocr_monitor_production.py 기본 인식 주기 (대시보드에서 변경 가능)
const INTERVAL_OPTIONS = [60, 120, 300]; // 1분 / 2분 / 5분
// Groq 무료 한도 (qwen/qwen3.8-27b, console.groq.com/docs/rate-limits 기준).
// 고정된 하루 리셋 시각이 아니라 최근 24시간 누적 기준 - 오래된 사용량이 24시간
// 지나 빠지는 대로 점차 여유가 생긴다(실제 429 오류 메시지의 "n분 후 재시도"로 확인됨).
const DAILY_LIMITS = { tokens: 200000, requests: 1000 };
// 구글 문서 OCR(Apps Script, 개인 계정): 문서 변환 하루 권장 상한 (멘토링 자료 기준 보수값)
const GOOGLE_DAILY_SOFT_LIMIT = 200;
const ENGINE_LABEL = { groq:'Groq AI', google:'구글 OCR', both:'둘 다 (비교)' };
const FIELD_DEFS = [
  ['output_percent','출력%'], ['output_voltage','전압'], ['thickness_um','두께'],
  ['start_dia_mm','시작경'], ['tension_set','장력설정'], ['tension_rate','장력율'],
];
function escHtml(t){ return String(t ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function sameVal(a, b){ const x = num(a), y = num(b); return x !== null && y !== null && Math.abs(x - y) <= 0.051; }

function num(v){ const n = parseFloat(v); return Number.isFinite(n) ? n : null; }
function fmtHMS(ts){
  if (!ts) return '-';
  const d = new Date(new Date(ts).getTime() + 9*3600000);
  return String(d.getUTCHours()).padStart(2,'0') + ':' + String(d.getUTCMinutes()).padStart(2,'0') + ':' + String(d.getUTCSeconds()).padStart(2,'0');
}
function fmtDT(ts){
  if (!ts) return '-';
  const d = new Date(new Date(ts).getTime() + 9*3600000);
  return String(d.getUTCMonth()+1).padStart(2,'0') + '/' + String(d.getUTCDate()).padStart(2,'0') + ' ' + fmtHMS(ts);
}
function spanLabel(sec){
  sec = Math.max(0, Math.floor(sec));
  if (sec < 60) return `${sec}초`;
  const m = Math.floor(sec/60);
  if (m < 60) return `${m}분`;
  const h = Math.floor(m/60), mm = m % 60;
  return mm ? `${h}시간 ${mm}분` : `${h}시간`;
}
// 실패 기록을 이유별로 나눈다 (Groq 하루 한도 초과 / 카메라 연결 끊김 / 그 밖의 판독 실패)
function failKind(r){
  if (r.parse_ok !== false) return null;
  const msg = String(r.error_message || '');
  if (/rate limit|429|tokens per day|TPD/i.test(msg)) return 'limit';
  if (r.connected === false) return 'cam';
  return 'parse';
}
const FAIL_LABEL = { limit:'한도 초과', cam:'카메라 끊김', parse:'파싱실패' };
// 업무시간(KST 월~토 08:00~18:00)에만 '꺼짐'을 빨간색으로 알린다 — 밤·휴일에 빨간 화면이 떠 있지 않게
function isWorkHours(){
  const k = new Date(Date.now() + 9*3600000);
  const day = k.getUTCDay(), min = k.getUTCHours()*60 + k.getUTCMinutes();
  return day >= 1 && day <= 6 && min >= 8*60 && min < 18*60;
}
function stateBanner(recent, settings){
  const last = recent[0];
  const intervalSec = (settings && settings.capture_interval_sec) || CAPTURE_INTERVAL_SEC;
  const agoSec = (Date.now() - new Date(last.captured_at).getTime())/1000;
  const offAfter = intervalSec * 2.5;
  if (settings && settings.enabled === false){
    return `<div class="state-ban idle"><div class="sb-top"><span class="sb-dot"></span><span class="sb-title">인식 중단됨</span><span class="sb-right">마지막 기록 ${fmtDT(last.captured_at)}</span></div><div class="sb-body">아래 "인식 재개하기"를 누르면 판독 프로그램이 다시 기록합니다.</div></div>`;
  }
  // 판독 프로그램의 살아있음 신호(2026-10-15 이후 버전): 10분 안에 신호가 있으면 '꺼짐'이 아니다
  const hbAgo = settings && settings.last_seen_at ? (Date.now() - new Date(settings.last_seen_at).getTime())/1000 : null;
  const hbAlive = hbAgo !== null && hbAgo < Math.max(600, intervalSec * 2.5);
  if (hbAlive && settings.last_state === 'idle_line'){
    return `<div class="state-ban idle"><div class="sb-top"><span class="sb-dot"></span><span class="sb-title">판독 쉬는 중 · 레벨러 정지</span><span class="sb-right">신호 ${spanLabel(hbAgo)} 전</span></div><div class="sb-body">${settings.last_note || '레벨러가 움직이지 않아 AI 판독을 쉬고 있습니다'} · 라인이 다시 돌면 자동으로 판독합니다(그래도 30분에 한 번은 판독). 마지막 기록 ${fmtDT(last.captured_at)}</div></div>`;
  }
  if (hbAlive && settings.last_state === 'camera_lost'){
    return `<div class="state-ban off"><div class="sb-top"><span class="sb-dot"></span><span class="sb-title">카메라 연결 끊김</span><span class="sb-right">신호 ${spanLabel(hbAgo)} 전</span></div><div class="sb-body">판독 프로그램은 켜져 있지만 카메라 영상을 받지 못합니다. 휴대폰 IP Webcam 앱과 와이파이를 확인하세요.</div></div>`;
  }
  if (agoSec > offAfter && hbAlive && settings.last_state === 'unchanged'){
    return `<div class="state-ban ok"><div class="sb-top"><span class="sb-dot"></span><span class="sb-title">판독 정상 · 화면 변화가 없어 판독 생략 중 (마지막 기록 ${fmtDT(last.captured_at)})</span></div></div>`;
  }
  if (agoSec > offAfter){
    if (!isWorkHours()){
      return `<div class="state-ban idle"><div class="sb-top"><span class="sb-dot"></span><span class="sb-title">업무시간 외 · 판독 프로그램 꺼짐</span><span class="sb-right">${spanLabel(agoSec)}째</span></div><div class="sb-body">마지막 기록 ${fmtDT(last.captured_at)} · 업무시간(08:00~18:00)에 계속 꺼져 있으면 빨간색으로 알립니다.</div></div>`;
    }
    return `<div class="state-ban off"><div class="sb-top"><span class="sb-dot"></span><span class="sb-title">판독 프로그램 꺼짐</span><span class="sb-right">${spanLabel(agoSec)}째</span></div>
      <div class="sb-body">마지막 기록 ${fmtDT(last.captured_at)} · 카메라 영상이 나와도 판독 PC의 프로그램이 꺼져 있거나 인터넷이 끊기면 값이 들어오지 않습니다.</div>
      <div class="sb-how">켜는 법: 판독 PC에서 <b style="color:#0f1e33">run_ocr_monitor.bat</b> 더블클릭 → 약 ${Math.max(2, Math.round(intervalSec/60))}분 안에 아래 값이 바뀌면 정상 (레벨러가 서 있으면 '판독 쉬는 중'으로 바뀜)</div></div>`;
  }
  // 최근 연속 실패 횟수
  let streak = 0; const kinds = {};
  for (const r of recent){ const k = failKind(r); if (!k) break; streak++; kinds[k] = (kinds[k]||0) + 1; }
  if (streak >= 3){
    const main = Object.keys(kinds).sort((a,b)=>kinds[b]-kinds[a])[0];
    const title = main === 'limit' ? '판독 실패 중 · AI 하루 한도 초과' : (main === 'cam' ? '판독 실패 중 · 카메라 연결 끊김' : '판독 실패 중 · 화면을 읽지 못함');
    const body = main === 'limit'
      ? '프로그램은 켜져 있습니다. Groq 한도는 최근 24시간 기준이라 시간이 지나면 풀립니다 · 인식 주기를 5분으로 늘리면 덜 걸립니다.'
      : (main === 'cam' ? '프로그램은 켜져 있지만 카메라 영상을 받지 못합니다. 휴대폰 IP Webcam 앱과 와이파이를 확인하세요.' : '프로그램은 켜져 있습니다. 카메라 각도·반사·초점을 확인하세요.');
    return `<div class="state-ban fail"><div class="sb-top"><span class="sb-dot"></span><span class="sb-title">${title}</span><span class="sb-right">${streak}회 연속</span></div><div class="sb-body">${body}</div></div>`;
  }
  return `<div class="state-ban ok"><div class="sb-top"><span class="sb-dot"></span><span class="sb-title">판독 정상 · 마지막 기록 ${agoLabel(last.captured_at)} (${fmtDT(last.captured_at)})</span></div></div>`;
}

function agoLabel(ts){
  if (!ts) return '-';
  const sec = Math.max(0, Math.floor((Date.now() - new Date(ts).getTime())/1000));
  if (sec < 60) return `${sec}초 전`;
  if (sec < 3600) return `${Math.floor(sec/60)}분 전`;
  return `${Math.floor(sec/3600)}시간 전`;
}

async function pgrest(path, opts={}){
  const res = await fetch(`${SUPABASE_URL}/rest/v1/${path}`, {
    headers: { apikey: ANON_KEY, Authorization: `Bearer ${ANON_KEY}`, ...(opts.headers||{}) },
  });
  return res;
}

async function fetchCount(filter){
  const res = await pgrest(`${TABLE}?select=id&limit=1${filter ? '&' + filter : ''}`, { headers: { Prefer: 'count=exact' } });
  const range = res.headers.get('content-range'); // "0-0/1234"
  if (!range) return 0;
  const total = range.split('/')[1];
  return total === '*' ? 0 : parseInt(total, 10) || 0;
}

async function fetchRecent(limit){
  const res = await pgrest(`${TABLE}?select=*&order=captured_at.desc&limit=${limit}`);
  if (!res.ok) return [];
  return res.json();
}

async function fetchWindow(sinceIso){
  const res = await pgrest(`${TABLE}?select=captured_at&order=captured_at.asc&captured_at=gte.${encodeURIComponent(sinceIso)}`);
  if (!res.ok) return [];
  return res.json();
}

async function fetchTodayTokens(sinceIso){
  const res = await pgrest(`${TABLE}?select=total_tokens&engine=eq.groq&captured_at=gte.${encodeURIComponent(sinceIso)}`);
  if (!res.ok) return { tokens:0, requests:0 };
  const rows = await res.json();
  const tokens = rows.reduce((sum, r) => sum + (num(r.total_tokens) || 0), 0);
  return { tokens, requests: rows.length };
}

// 오늘 같은 사진(capture_id)으로 묶인 판독 기록 — 방식 비교·구글 사용량용
async function fetchTodayCaptures(sinceIso){
  const cols = 'captured_at,capture_id,engine,parse_ok,output_percent,output_voltage,thickness_um,start_dia_mm,tension_set,tension_rate,raw_response,ocr_ms,error_message';
  const res = await pgrest(`${TABLE}?select=${cols}&capture_id=not.is.null&captured_at=gte.${encodeURIComponent(sinceIso)}&order=captured_at.desc&limit=600`);
  if (!res.ok) return [];
  return res.json();
}

async function fetchSettings(){
  const res = await pgrest(`${SETTINGS_TABLE}?select=capture_interval_sec,enabled,ocr_engine,last_seen_at,last_state,last_note&id=eq.1&limit=1`);
  if (!res.ok) return null;
  const rows = await res.json();
  return rows[0] || null;
}

async function patchSettings(payload){
  const buttons = document.querySelectorAll('.interval-btn, .toggle-btn, .eng-btn');
  buttons.forEach(b => b.disabled = true);
  try {
    await fetch(`${SUPABASE_URL}/rest/v1/${SETTINGS_TABLE}?id=eq.1`, {
      method: 'PATCH',
      headers: { apikey: ANON_KEY, Authorization: `Bearer ${ANON_KEY}`, 'Content-Type': 'application/json', Prefer: 'return=minimal' },
      body: JSON.stringify({ ...payload, updated_at: new Date().toISOString() }),
    });
  } catch (e) { /* 다음 폴링에서 다시 시도됨 */ }
  render();
}

function setIntervalSec(sec){ return patchSettings({ capture_interval_sec: sec }); }
function setEnabled(enabled){ return patchSettings({ enabled }); }
window.setIntervalSec = setIntervalSec;
window.setEnabled = setEnabled;
function setEngine(engine){ return patchSettings({ ocr_engine: engine }); }
window.setEngine = setEngine;

// 방식 비교 카드: 같은 사진을 Groq·구글 둘 다 읽은 묶음만 비교
function compareCard(caps){
  const google = caps.filter(r => r.engine === 'google');
  if (!google.length) return '';
  const byCap = {};
  caps.forEach(r => { (byCap[r.capture_id] = byCap[r.capture_id] || {})[r.engine] = r; });
  const pairs = Object.values(byCap).filter(p => p.groq && p.google)
    .sort((a,b) => new Date(b.google.captured_at) - new Date(a.google.captured_at));
  const cells = FIELD_DEFS.map(([k, lab]) => {
    const both = pairs.filter(p => num(p.groq[k]) !== null && num(p.google[k]) !== null);
    const hit = both.filter(p => sameVal(p.groq[k], p.google[k])).length;
    const pct = both.length ? Math.round(hit/both.length*100) : null;
    const cls = pct === null ? 'none' : (pct >= 95 ? '' : (pct >= 80 ? 'mid' : 'bad'));
    return `<div class="mc"><div class="l">${lab} 일치</div><div class="v ${cls}">${pct === null ? '-' : pct + '%'}</div><div class="s">${hit} / ${both.length}장</div></div>`;
  }).join('');
  const gOk = pairs.filter(p => p.google.parse_ok).length, qOk = pairs.filter(p => p.groq.parse_ok).length;
  const gMs = google.map(r => num(r.ocr_ms)).filter(v => v !== null);
  const avgMs = gMs.length ? (gMs.reduce((a,b)=>a+b,0)/gMs.length/1000).toFixed(1) : '-';
  const row = (r, eng, other) => {
    const chip = eng === 'google' ? '<span class="status-chip g">구글</span>' : '<span class="status-chip q">Groq</span>';
    if (!r.parse_ok && FIELD_DEFS.every(([k]) => num(r[k]) === null)){
      const why = failKind(r) === 'limit' ? '한도 초과 — 판독 못함' : escHtml(String(r.error_message || '판독 실패').slice(0, 60));
      return `<td>${chip}</td><td colspan="6" style="text-align:left;color:#b23a3a">${why}</td>`;
    }
    return `<td>${chip}</td>` + FIELD_DEFS.map(([k]) => {
      const diff = other && num(other[k]) !== null && num(r[k]) !== null && !sameVal(r[k], other[k]);
      return `<td class="${diff ? 'x' : ''}">${num(r[k]) ?? '-'}</td>`;
    }).join('');
  };
  const rows = pairs.slice(0, 6).map(p => `<tr><td>${fmtHMS(p.google.captured_at)}</td>${row(p.google, 'google', p.groq)}</tr><tr><td></td>${row(p.groq, 'groq', p.google)}</tr>`).join('');
  const lastG = google.find(r => r.raw_response);
  return `
    <div class="card">
      <div class="section-title">방식 비교 · 오늘 (같은 사진 ${pairs.length}장)</div>
      ${pairs.length ? `<div class="match-grid">${cells}</div>
      <div class="usage-label-row" style="margin-top:12px"><span>판독 성공 (같은 사진 기준)</span><b>Groq ${qOk} / ${pairs.length} · 구글 ${gOk} / ${pairs.length}</b></div>
      <div class="usage-label-row"><span>구글 평균 처리 시간</span><b>${avgMs}초</b></div>
      <div class="section-title">최근 비교 (두 방식 값이 다르면 빨간 칸)</div>
      <div class="table-scroll"><table class="recent-table">
        <thead><tr><th>시각</th><th>방식</th>${FIELD_DEFS.map(([,l]) => `<th>${l}</th>`).join('')}</tr></thead>
        <tbody>${rows}</tbody></table></div>`
      : `<p class="kpi-sub">아직 같은 사진을 두 방식으로 읽은 기록이 없습니다. 위 "판독 방식"에서 <b>둘 다 (비교)</b>를 누르면 쌓이기 시작합니다.</p>`}
      ${lastG ? `<div class="raw-box">구글 원문 (${fmtHMS(lastG.captured_at)})\n${escHtml(lastG.raw_response)}</div>
      <p class="kpi-sub" style="margin-top:8px;">원문으로 항목 분리 규칙(라벨·단위)을 다듬습니다. 값이 4개 미만이거나 범위를 벗어나면 '판독 실패'로 저장합니다.</p>` : ''}
    </div>`;
}

function todayStartKstIso(){
  const now = new Date();
  const kst = new Date(now.getTime() + 9*3600000);
  kst.setUTCHours(0,0,0,0);
  return new Date(kst.getTime() - 9*3600000).toISOString();
}

function buildCoverage(rows, hours, bucketMin){
  const now = Date.now();
  const startMs = now - hours*3600000;
  const bucketMs = bucketMin*60000;
  const bucketCount = Math.ceil((hours*3600000)/bucketMs);
  const hits = new Array(bucketCount).fill(false);
  rows.forEach(r => {
    const t = new Date(r.captured_at).getTime();
    if (t < startMs) return;
    const idx = Math.min(bucketCount-1, Math.floor((t - startMs)/bucketMs));
    hits[idx] = true;
  });
  return hits;
}

let timer = null;

async function render(){
  const app = document.getElementById('app');

  const todayStart = todayStartKstIso();
  const [totalCount, todayCount, recent, todayUsage, settings, todayCaps] = await Promise.all([
    fetchCount(),
    fetchCount(`captured_at=gte.${encodeURIComponent(todayStart)}`),
    fetchRecent(20),
    fetchTodayTokens(todayStart),
    fetchSettings(),
    fetchTodayCaptures(todayStart),
  ]);
  const engine = (settings && settings.ocr_engine) || 'groq';

  if (!recent.length){
    app.innerHTML = `
      <div class="card">
        <div class="header-row">
          <p class="header-title">PR-DTC-3100 실시간 인식</p>
          <span class="live-dot-wrap"><span class="live-dot"></span>대기중</span>
        </div>
        <p class="header-sub">ai_tension_readings 테이블을 8초마다 확인합니다.</p>
        <div class="empty-note">📷 아직 수신된 데이터가 없습니다. ocr_monitor_production.py가 이 테이블에 기록하도록 개발서버에서 실행되면 여기 실시간으로 표시됩니다. 테이블·조회 권한은 이미 준비되어 있습니다.</div>
      </div>`;
    if (timer) clearTimeout(timer);
    timer = setTimeout(render, POLL_MS);
    return;
  }

  const last = recent[0];
  // 큰 숫자: 구글/둘 다 모드면 가장 최근 구글 판독, 아니면 가장 최근 기록
  const shown = (engine !== 'groq' && recent.find(r => r.engine === 'google')) || last;
  const pairOf = engine === 'both' && shown.capture_id ? todayCaps.find(r => r.capture_id === shown.capture_id && r.engine !== shown.engine) : null;
  const sub = k => pairOf ? `<p class="kpi-sub"${sameVal(pairOf[k], shown[k]) || num(pairOf[k]) === null ? '' : ' style="color:#b23a3a"'}>${pairOf.engine === 'groq' ? 'Groq' : '구글'} ${num(pairOf[k]) ?? '-'}${num(pairOf[k]) === null ? '' : (sameVal(pairOf[k], shown[k]) ? ' ✓' : ' ✗ 다름')}</p>` : '';
  const isPaused = settings && settings.enabled === false;
  const lastAgoSec = (Date.now() - new Date(last.captured_at).getTime())/1000;
  const intervalSec = (settings && settings.capture_interval_sec) || CAPTURE_INTERVAL_SEC;
  const dotClass = isPaused ? 'paused' : (lastAgoSec < intervalSec * 1.8 ? 'ok' : (lastAgoSec < intervalSec * 2.5 ? 'stale' : 'dead'));
  const dotLabel = isPaused ? '중단됨' : (lastAgoSec < intervalSec * 1.8 ? '정상 수신' : (lastAgoSec < intervalSec * 2.5 ? '수신 지연' : '수신 끊김'));

  const windowRows = await fetchWindow(new Date(Date.now() - 6*3600000).toISOString());
  const coverage = buildCoverage(windowRows, 6, 10);

  const failCount = recent.filter(r => r.parse_ok === false).length;
  const failPct = recent.length ? (failCount/recent.length*100) : 0;
  const tokenVals = recent.filter(r => r.engine !== 'google').map(r => num(r.total_tokens)).filter(v => v !== null);
  const googleToday = todayCaps.filter(r => r.engine === 'google').length;
  const avgTokens = tokenVals.length ? Math.round(tokenVals.reduce((a,b)=>a+b,0)/tokenVals.length) : null;

  const primary = num(shown.output_percent);

  app.innerHTML = `
    ${stateBanner(recent, settings)}
    <div class="real-note">🧪 ai_tension_readings 테이블을 8초마다 확인합니다. ocr_monitor_production.py가 아래 "판독 방식"·"인식 주기"에 맞춰 이 테이블에 기록합니다.</div>

    <div class="card">
      <div class="header-row">
        <p class="header-title">PR-DTC-3100 실시간 인식<span class="eng-chip">${ENGINE_LABEL[engine]}</span></p>
        <span class="live-dot-wrap"><span class="live-dot ${dotClass}"></span>${dotLabel}</span>
      </div>
      <p class="header-sub">마지막 수신 ${agoLabel(last.captured_at)} (${fmtDT(last.captured_at)})${shown !== last ? ` · 아래 값은 구글 판독 ${fmtHMS(shown.captured_at)}` : ''}${pairOf ? ' · 작은 글씨는 같은 사진의 Groq 값' : ''}</p>

      <div class="primary-row">
        <span class="primary-label">출력%</span>
        <span class="primary-value">${primary ?? '-'}</span>
        <span class="primary-unit">%</span>
      </div>

      <div class="kpi-grid">
        <div class="kpi-cell"><p class="kpi-label">전압 (V)</p><p class="kpi-value">${num(shown.output_voltage) ?? '-'}</p>${sub('output_voltage')}</div>
        <div class="kpi-cell"><p class="kpi-label">두께 (um)</p><p class="kpi-value">${num(shown.thickness_um) ?? '-'}</p>${sub('thickness_um')}</div>
        <div class="kpi-cell"><p class="kpi-label">시작경 (mm)</p><p class="kpi-value">${num(shown.start_dia_mm) ?? '-'}</p>${sub('start_dia_mm')}</div>
        <div class="kpi-cell"><p class="kpi-label">장력설정</p><p class="kpi-value purple">${num(shown.tension_set) ?? '-'}</p>${sub('tension_set')}</div>
        <div class="kpi-cell"><p class="kpi-label">장력율</p><p class="kpi-value">${num(shown.tension_rate) ?? '-'}</p>${sub('tension_rate')}</div>
        ${engine === 'groq'
          ? `<div class="kpi-cell"><p class="kpi-label">평균 토큰/회</p><p class="kpi-value">${avgTokens !== null ? avgTokens.toLocaleString() : '-'}</p></div>`
          : `<div class="kpi-cell"><p class="kpi-label">구글 처리 시간</p><p class="kpi-value">${num(shown.ocr_ms) !== null ? (num(shown.ocr_ms)/1000).toFixed(1) + '초' : '-'}</p>${pairOf ? `<p class="kpi-sub">출력% Groq ${num(pairOf.output_percent) ?? '-'}${sameVal(pairOf.output_percent, shown.output_percent) ? ' ✓' : ''}</p>` : ''}</div>`}
      </div>
    </div>

    <div class="card">
      <div class="section-title">오늘 사용량</div>
      <div class="usage-row">
        <div class="usage-label-row"><span>Groq 토큰 (무료 한도)</span><b>${todayUsage.tokens.toLocaleString()} / ${DAILY_LIMITS.tokens.toLocaleString()}</b></div>
        <div class="usage-track"><div class="usage-fill${todayUsage.tokens/DAILY_LIMITS.tokens > 0.8 ? ' warn' : ''}" style="width:${Math.min(100, todayUsage.tokens/DAILY_LIMITS.tokens*100).toFixed(1)}%"></div></div>
      </div>
      <div class="usage-row">
        <div class="usage-label-row"><span>Groq 호출 횟수</span><b>${todayUsage.requests.toLocaleString()} / ${DAILY_LIMITS.requests.toLocaleString()}</b></div>
        <div class="usage-track"><div class="usage-fill${todayUsage.requests/DAILY_LIMITS.requests > 0.8 ? ' warn' : ''}" style="width:${Math.min(100, todayUsage.requests/DAILY_LIMITS.requests*100).toFixed(1)}%"></div></div>
      </div>
      <div class="usage-row">
        <div class="usage-label-row"><span>구글 문서 변환 (내 계정, 권장 하루 ${GOOGLE_DAILY_SOFT_LIMIT}건 이하)</span><b>${googleToday} / ${GOOGLE_DAILY_SOFT_LIMIT}</b></div>
        <div class="usage-track"><div class="usage-fill${googleToday/GOOGLE_DAILY_SOFT_LIMIT > 0.8 ? ' warn' : ''}" style="width:${Math.min(100, googleToday/GOOGLE_DAILY_SOFT_LIMIT*100).toFixed(1)}%"></div></div>
      </div>
      <p class="kpi-sub" style="margin-top:10px;">고정된 리셋 시각 없이 최근 24시간 기준이라, 한도에 걸려도 시간이 지나면 점차 회복됩니다.</p>
    </div>

    <div class="card">
      <div class="section-title">판독 방식</div>
      <div class="eng-row">
        <button class="eng-btn${engine === 'groq' ? ' active' : ''}" onclick="setEngine('groq')"><b>Groq AI</b><span>지금까지 방식. AI가 사진을 읽어 6개 값을 바로 돌려줌</span></button>
        <button class="eng-btn${engine === 'google' ? ' active' : ''}" onclick="setEngine('google')"><b>구글 OCR</b><span>내 구글 계정 문서 변환으로 글자 추출 → 규칙으로 6개 값 분리. 무료</span></button>
        <button class="eng-btn${engine === 'both' ? ' active' : ''}" onclick="setEngine('both')"><b>둘 다 (비교)</b><span>같은 사진을 두 방식에 보내 나란히 저장. 테스트 기간용</span></button>
      </div>
      <p class="kpi-sub" style="margin-top:10px;">누르면 판독 PC가 재시작 없이 다음 주기부터 바꿉니다. 구글은 하루 변환 한도가 있어 테스트 중에는 5분 주기를 권장합니다.</p>
    </div>

    ${compareCard(todayCaps)}

    <div class="card">
      <div class="section-title">인식 주기</div>
      ${isPaused
        ? `<button class="toggle-btn resume" onclick="setEnabled(true)">▶ 인식 재개하기</button>`
        : `<button class="toggle-btn pause" onclick="setEnabled(false)">⏸ 인식 중단하기</button>`}
      <div class="interval-row">
        ${INTERVAL_OPTIONS.map(sec => `<button class="interval-btn${settings && settings.capture_interval_sec === sec ? ' active' : ''}" onclick="setIntervalSec(${sec})">${sec/60}분마다</button>`).join('')}
      </div>
      <p class="kpi-sub" style="margin-top:10px;">
        ${isPaused
          ? '현재 중단됨 - 개발서버가 카메라 인식/DB 저장을 멈추고 재개 버튼을 기다립니다.'
          : `현재 ${settings ? (settings.capture_interval_sec/60) : '?'}분마다 자동 인식 중.`}
        클릭하면 재시작 없이 개발서버가 다음 확인 시점에 자동 반영합니다.
      </p>
    </div>

    <div class="card">
      <div class="section-title">누적 현황</div>
      <div class="kpi-grid">
        <div class="kpi-cell"><p class="kpi-label">누적 저장 건수</p><p class="kpi-value">${totalCount.toLocaleString()}</p></div>
        <div class="kpi-cell"><p class="kpi-label">오늘 저장 건수</p><p class="kpi-value">${todayCount.toLocaleString()}</p></div>
        <div class="kpi-cell"><p class="kpi-label">최근 20건 중 파싱 실패</p><p class="kpi-value ${failPct > 0 ? 'warn' : ''}">${failPct.toFixed(0)}%</p><p class="kpi-sub">${failCount}건 / ${recent.length}건</p></div>
      </div>
    </div>

    <div class="card">
      <div class="section-title">최근 6시간 수신 커버리지 (10분 단위)</div>
      <div class="cov-row">${coverage.map(h => `<div class="cov-cell ${h ? 'hit' : 'miss'}"></div>`).join('')}</div>
      <div class="cov-axis"><span>6시간 전</span><span>지금</span></div>
      ${coverage.some(h => !h) ? `<p class="kpi-sub" style="margin-top:6px; color:#a3610a;">⚠️ 빨간 구간은 해당 10분 동안 수신 기록이 없었다는 뜻입니다.</p>` : ''}
    </div>

    <div class="card">
      <div class="section-title">최근 저장 레코드</div>
      <div class="table-scroll">
      <table class="recent-table">
        <thead><tr><th>날짜 시각</th><th>방식</th><th>출력%</th><th>전압</th><th>두께</th><th>시작경</th><th>장력설정</th><th>장력율</th><th>상태</th></tr></thead>
        <tbody>
          ${recent.map((r, i) => {
            const kind = failKind(r);
            const prev = recent[i-1]; // 더 최근 기록
            const gapSec = prev ? (new Date(prev.captured_at).getTime() - new Date(r.captured_at).getTime())/1000 : 0;
            const gapRow = prev && gapSec > Math.max(intervalSec * 2.5, 900) ? // 주기가 바뀐 과거 기록도 있으니 15분 이상 비었을 때만 표시
               `<tr class="gap-row"><td colspan="9">— ${spanLabel(gapSec)} 기록 없음 (레벨러 정지로 판독 쉼, 또는 판독 프로그램 꺼짐·연결 끊김) —</td></tr>` : '';
            return `${gapRow}<tr>
              <td>${fmtDT(r.captured_at)}</td>
              <td>${r.engine === 'google' ? '<span class="status-chip g">구글</span>' : '<span class="status-chip q">Groq</span>'}</td>
              <td>${num(r.output_percent) ?? '-'}</td>
              <td>${num(r.output_voltage) ?? '-'}</td>
              <td>${num(r.thickness_um) ?? '-'}</td>
              <td>${num(r.start_dia_mm) ?? '-'}</td>
              <td>${num(r.tension_set) ?? '-'}</td>
              <td>${num(r.tension_rate) ?? '-'}</td>
              <td>${kind ? `<span class="status-chip ${kind === 'limit' ? 'warn' : (kind === 'cam' ? 'cam' : 'low')}" title="${String(r.error_message || '').replace(/"/g, '&quot;').slice(0, 200)}">${FAIL_LABEL[kind]}</span>` : `<span class="status-chip ok">정상</span>`}</td>
            </tr>`;
          }).join('')}
        </tbody>
      </table>
      </div>
    </div>
  `;

  if (timer) clearTimeout(timer);
  timer = setTimeout(render, POLL_MS);
}

render();
</script>
