<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Slitter 2 Floor Screen (English)</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
/* 레이아웃: 가로 태블릿 1280×800 흰색 화면 — 왼쪽 메뉴(작업 목록·현재 작업·지난 작업) + 본문, 지난 작업은 목록에서 상세 페이지로 이동 */
:root{color-scheme:light}
*{box-sizing:border-box}
body{background:#ffffff;color:#0f1e33;font-family:Pretendard,'Noto Sans KR',system-ui,sans-serif;padding-inline:16px;padding-block:14px 30px;margin:0}
.page{max-width:1320px;margin:0 auto}
.head{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:8px}
.head h1{font-size:18px;margin:0}
.head span{font-size:13px;color:#5c6478}
#fit{width:100%;position:relative}
#stage{width:1280px;height:800px;transform-origin:0 0;position:absolute;left:0;top:0;
  --bg:#ffffff;--pn:#f4f6fb;--ln:#e1e6ef;--tx:#0f1e33;--sb:#5c6478;--mu:#8592a8;--ac:#2a5bd7;--acbg:#e6edfc;
  --ok:#0a7a3d;--ok2:#dff3e7;--wn:#8a5a00;--wn2:#fdf0cf;--bd:#b3261e;--bd2:#fbe3e3;
  --t1:#1f6fd1;--t2:#d9622b;--t3:#7b5fd6;--t4:#d6407f;
  background:var(--bg);color:var(--tx);border:2px solid var(--ln);border-radius:26px;padding:14px;display:grid;grid-template-columns:150px 1fr;gap:14px;font-size:19px;overflow:hidden}
#stage button{font:inherit;color:var(--tx);background:#fff;border:2px solid var(--ln);border-radius:14px;cursor:pointer}
#stage button:focus-visible{outline:3px solid var(--ac);outline-offset:2px}
#nav{display:flex;flex-direction:column;gap:10px;background:var(--pn);border-radius:20px;padding:12px}
#nav .logo{font-size:26px;font-weight:900;padding:6px 6px 10px}
#nav .logo small{display:block;font-size:14px;font-weight:500;color:var(--sb)}
#nav button{height:72px;text-align:left;padding:0 10px;font-size:17px;white-space:nowrap;font-weight:700;display:flex;flex-direction:column;justify-content:center;border-radius:16px}
#nav button small{font-size:14px;font-weight:500;color:var(--sb)}
#nav button.on{background:var(--ac);border-color:var(--ac);color:#fff}
#nav button.on small{color:#dbe5ff}
#nav .foot{margin-top:auto;font-size:14px;color:var(--sb);line-height:1.4;padding:6px}
.dot{display:inline-block;width:12px;height:12px;border-radius:50%;background:var(--ok);margin-right:5px;animation:pl 1.6s ease-in-out infinite}
@keyframes pl{50%{opacity:.35}}
.flow{stroke-dasharray:10 8;animation:mv 0.9s linear infinite}
@keyframes mv{to{stroke-dashoffset:-18}}
@media (prefers-reduced-motion:reduce){.flow,.dot{animation:none}}
main{min-width:0;min-height:0;position:relative}
section{height:100%;display:flex;flex-direction:column;gap:12px;min-height:0}
section[hidden]{display:none}
.ph{display:flex;align-items:center;gap:14px;min-height:46px}
.ph h2{margin:0;font-size:30px;font-weight:900;white-space:nowrap}
.ph .sub{font-size:17px;color:var(--sb)}
.ph .sp{margin-left:auto;display:flex;gap:10px;align-items:center}
.kp{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}
.k{background:var(--pn);border-radius:16px;padding:10px 16px}
.k span{font-size:16px;color:var(--sb)}
.k b{display:block;font-size:36px;font-weight:900;line-height:1.1;font-variant-numeric:tabular-nums}
.k small{font-size:14px;color:var(--sb)}
.chips{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.chips button{padding:0 18px;height:48px;font-size:19px;font-weight:700}
.chips button.on{background:var(--tx);border-color:var(--tx);color:#fff}
.tw{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;border:2px solid var(--ln);border-radius:16px}
table{width:100%;border-collapse:collapse;font-size:19px}
th{position:sticky;top:0;background:var(--pn);text-align:left;font-size:15px;color:var(--sb);font-weight:700;padding:9px 9px;border-bottom:2px solid var(--ln);z-index:1;white-space:nowrap}
td{padding:0 9px;height:54px;border-bottom:1px solid var(--ln);font-variant-numeric:tabular-nums;white-space:nowrap}
tr.go{cursor:pointer}
tr.go:hover td{background:var(--acbg)}
tr.cur td{background:#eef3ff}
.pill{display:inline-block;font-size:16px;font-weight:700;padding:3px 12px;border-radius:99px;white-space:nowrap}
.p-ok{background:var(--ok2);color:var(--ok)}.p-wn{background:var(--wn2);color:var(--wn)}.p-bd{background:var(--bd2);color:var(--bd)}
.p-run{background:var(--acbg);color:var(--ac)}.p-id{background:var(--ln);color:var(--sb)}
.smp{font-size:12px;color:var(--mu);border:1px solid var(--ln);border-radius:6px;padding:0 5px;margin-left:6px;font-weight:500}
.chev{color:var(--mu);font-size:22px;text-align:right}
.card{background:var(--pn);border-radius:18px;padding:12px 16px;min-width:0}
.arow{display:grid;grid-template-columns:1fr 330px;gap:12px;height:106px;flex:none}
.job{background:var(--pn);border-radius:18px;padding:10px 18px;display:flex;flex-direction:column;justify-content:center;gap:6px;min-width:0}
.job .t{display:flex;align-items:baseline;gap:12px;white-space:nowrap}
.job .t b{font-size:26px}
.job .t span{font-size:16px;color:var(--sb)}
.bar{height:20px;border-radius:10px;background:var(--ln);overflow:hidden}
.bar i{display:block;height:100%;width:41%;background:var(--ac);border-radius:10px}
.prow{display:flex;gap:20px;align-items:baseline;font-size:16px;color:var(--sb);white-space:nowrap}
.prow b{font-size:24px;color:var(--tx)}
.sig{border-radius:18px;padding:10px 20px;display:flex;flex-direction:column;justify-content:center}
.sig b{font-size:32px;line-height:1.15}
.sig span{font-size:17px;font-weight:500}
.grow{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;height:206px;flex:none}
.g{background:var(--pn);border:3px solid var(--pn);border-radius:18px;padding:8px 10px 8px;display:flex;flex-direction:column;align-items:center;min-width:0}
.g .n{font-size:17px;color:var(--sb);display:flex;align-items:center;gap:7px;align-self:flex-start;white-space:nowrap}
.g .n i{display:inline-block;width:14px;height:14px;border-radius:4px}
.g svg{width:100%;height:72px;margin-top:0}
.g .v{font-size:44px;font-weight:900;line-height:1;margin-top:2px;font-variant-numeric:tabular-nums}
.g .r{font-size:14px;color:var(--sb);margin-top:2px;white-space:nowrap}
.g .s{font-size:18px;font-weight:700;margin-top:2px;white-space:nowrap}
.cht{flex:1;min-height:0;display:flex;flex-direction:column}
.tabs{display:flex;gap:8px;align-items:center}
.tabs button{padding:0 18px;height:44px;font-size:18px;font-weight:700;white-space:nowrap}
.tabs button.on{background:var(--ac);border-color:var(--ac);color:#fff}
.lg{margin-left:auto;display:flex;gap:14px;font-size:15px;color:var(--sb);white-space:nowrap}
.lg span{display:flex;align-items:center;gap:6px}
.cbox{position:relative;flex:1;min-height:0;margin-top:4px}
.bk{height:48px;padding:0 18px;font-size:19px;font-weight:700;white-space:nowrap}
.scroll{flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column;gap:12px;padding-right:4px}
.jump{position:sticky;top:0;z-index:5;background:#fff;display:flex;gap:6px;flex-wrap:wrap;padding:2px 0 6px;flex:none}
.jump button{height:40px;padding:0 14px;font-size:16px;font-weight:700;border-radius:10px;white-space:nowrap}
.sec{background:#fff;border:2px solid var(--ln);border-radius:18px;padding:14px 18px;flex:none}
.sec h3{margin:0 0 10px;font-size:22px;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.sec h3 span{font-size:15px;font-weight:400;color:var(--sb)}
.kg{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.kg .k{padding:8px 14px}
.kg .k b{font-size:28px}
.gantt{display:flex;height:34px;border-radius:8px;overflow:hidden;border:1px solid var(--ln)}
.gantt i{display:block;height:100%}
.gl{display:flex;justify-content:space-between;font-size:15px;color:var(--sb);margin-top:4px}
.gleg{display:flex;gap:18px;margin-top:8px;font-size:15px;color:var(--sb);flex-wrap:wrap}
.gleg span{display:flex;align-items:center;gap:6px}
.gleg i{display:inline-block;width:16px;height:12px;border-radius:3px}
.sm td{height:42px;font-size:16px}
.sm th{position:static;font-size:14px}
.info{display:grid;grid-template-columns:1fr 1fr;gap:0 28px}
.info div{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-bottom:1px solid var(--ln);font-size:17px}
.info span{color:var(--sb)}
.info b{text-align:right;font-variant-numeric:tabular-nums}
.cb{position:relative;height:200px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.twoh{font-size:16px;font-weight:700;margin:0 0 4px}
.note{font-size:14px;color:var(--sb)}
.ban{background:var(--wn2);color:var(--wn);border-radius:12px;padding:8px 14px;font-size:16px;font-weight:500;flex:none}
.dist{position:relative;height:16px;border-radius:8px;background:linear-gradient(90deg,#dfe6f3,#bfd0f0,#dfe6f3);margin:10px 0 4px}
.dist s{position:absolute;top:-6px;width:6px;height:28px;border-radius:3px;background:var(--ac);transform:translateX(-3px)}
.nt{font-size:13px;color:#5c6478;margin-top:10px;max-width:1280px}
</style>
</head>
<body>

<div class="page">
  <div class="head"><h1 id="h1"></h1><span id="h1s"></span></div>
  <div id="fit">
    <div id="stage">
      <nav id="nav"></nav>
      <main>
        <section id="pgList"></section>
        <section id="pgNow" hidden></section>
        <section id="pgPast" hidden></section>
        <section id="pgDetail" hidden></section>
      </main>
    </div>
  </div>
  <div class="nt" id="foot"></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<script>
var LANG='en';
function t(ko,en){return LANG==='en'?en:ko}
var $=function(id){return document.getElementById(id)};
var C={t:['#1f6fd1','#d9622b','#7b5fd6','#d6407f'],ok:'#0a7a3d',wn:'#8a5a00',bd:'#b3261e',ac:'#2a5bd7',sb:'#5c6478',ln:'#e1e6ef'};
var DASH=[[],[8,4],[2,4],[12,4,2,4]];
function pill(k,x){return '<span class="pill p-'+k+'">'+x+'</span>'}
function cl(k){return C[k]}
function stOf(v,lo,hi){var mid=(lo+hi)/2,b=(hi-lo)/2,r=Math.abs(v-mid)/b,d=v>mid?t('높음','High'):t('낮음','Low');
 if(r<0.7)return{k:'ok',t:t('적정','OK'),s:'●',r:r};if(r<1)return{k:'wn',t:t('약간 ','Slightly ')+(LANG==='en'?d.toLowerCase():d),s:'▲',r:r};return{k:'bd',t:d,s:'■',r:r}}
function hm(s){var h=Math.floor(s/60)%24,m=Math.round(s%60);if(m===60){h++;m=0}return String(h).padStart(2,'0')+':'+String(m).padStart(2,'0')}
function clk(start,min){var a=start.split(':');return hm(+a[0]*60+ +a[1]+min)}
function dur(m){m=Math.round(m);if(LANG==='en')return m<60?m+' min':Math.floor(m/60)+'h '+(m%60)+'m';return m<60?m+'분':Math.floor(m/60)+'시간 '+(m%60)+'분'}
function mn(m){return LANG==='en'?Math.round(m)+' min':Math.round(m)+'분'}
function sg(x){return (x>0?'+':'')+x}
function avg(a){return a.reduce(function(s,v){return s+v},0)/a.length}
function sd(a){var m=avg(a);return Math.sqrt(avg(a.map(function(v){return (v-m)*(v-m)})))}
function fx(v,d){return (Math.round(v*Math.pow(10,d))/Math.pow(10,d)).toFixed(d)}

/* ---------- 껍데기 ---------- */
function renderShell(){
 $('h1').textContent=t('슬리터2 현장 화면 · 가로 태블릿','Slitter 2 Floor Screen · Landscape Tablet');
 $('h1s').textContent=t('왼쪽 메뉴로 이동합니다 · 작업 목록 행이나 지난 작업을 눌러 상세로 들어가 보세요','Use the left menu · tap a row in the job list or a past job to drill in');
 $('foot').textContent=t('이 화면은 시안입니다. 작업 목록 14건 중 7건과 현재 코일의 라인 흐름 값, 오늘 완료 코일 2건의 소요시간은 실제 값이고, 그래프 곡선과 상세 수치는 샘플입니다. 속도 m/min·길이 m는 실데이터로 확인했습니다.','This is a design preview. 7 of the 14 jobs, the current coil’s line-flow values and the durations of today’s two finished coils are real; curves and detail figures are samples. Speed m/min and length m verified on real data.');
 $('nav').innerHTML='<div class="logo">'+t('슬리터2','Slitter 2')+'<small>'+t('현장 화면','Floor screen')+'</small></div>'+
 '<button type="button" data-p="list" class="on">'+t('작업 목록','Job list')+'<small>'+t('오늘 14건','14 today')+'</small></button>'+
 '<button type="button" data-p="now"><span><span class="dot"></span>'+t('현재 작업','Current job')+'</span><small>0.48×4 · 41%</small></button>'+
 '<button type="button" data-p="past">'+t('지난 작업','Past jobs')+'<small>'+t('상세 기록','Full records')+'</small></button>'+
 '<div class="foot">'+t('15:20 현재<br>PLC 연결 정상','As of 15:20<br>PLC connected')+'</div>';
}
var CO=t('대한강재','Daehan Steel'),SC=t('샘플 거래처','Sample customer'),SMP=t('샘플','Sample');

/* ---------- 작업 목록 ---------- */
var JOBS=[
 {st:'done',coil:'2631900101',spec:'0.48×4',kg:10810,cut:'97×12, 48×1',tm:t('10:20~11:49 · 89분','10:20–11:49 · 89 min'),s:1},
 {st:'done',coil:'2632001021',spec:'0.48×4',kg:10860,cut:'97×12, 48×1',tm:t('11:54~13:26 · 92분','11:54–13:26 · 92 min')},
 {st:'done',coil:'2612102121',spec:'0.48×4',kg:10780,cut:'97×12, 48×1',tm:t('13:27~14:43 · 76분','13:27–14:43 · 76 min')},
 {st:'run',coil:'2632500611',spec:'0.48×4',kg:10700,cut:'97×12, 48×1',tm:t('14:44~ · 종료 16:14 예상','14:44– · ends ~16:14')},
 {st:'wait',coil:'CRG1004A',spec:'1.15×4',kg:12030,cut:'57×20, 35×2',tm:t('16:20 시작 예상','starts ~16:20')},
 {st:'wait',coil:'CRG0963B',spec:'1.15×4',kg:11900,cut:'57×20, 35×2',tm:t('17:55 시작 예상','starts ~17:55'),late:1},
 {st:'wait',coil:'CRH0993A',spec:'1.15×4',kg:11350,cut:'57×20, 35×2',tm:t('내일 이월 가능','may roll to tomorrow'),late:1},
 {st:'wait',coil:'CRF0151A',spec:'1.15×4',kg:11360,cut:'57×20, 35×2',tm:t('내일 이월 가능','may roll to tomorrow'),late:1},
 {st:'wait',coil:'CRG1120C',spec:'1.15×4',kg:11800,cut:'57×20, 35×2',tm:t('내일 이월 가능','may roll to tomorrow'),late:1,s:1},
 {st:'wait',coil:'CRH0110B',spec:'1.15×4',kg:11640,cut:'57×20, 35×2',tm:t('내일 이월 가능','may roll to tomorrow'),late:1,s:1},
 {st:'wait',coil:'CRF0207A',spec:'1.15×4',kg:11510,cut:'57×20, 35×2',tm:t('내일 이월 가능','may roll to tomorrow'),late:1,s:1},
 {st:'wait',coil:'CRG1301A',spec:'1.15×4',kg:11270,cut:'57×20, 35×2',tm:t('내일 이월 가능','may roll to tomorrow'),late:1,s:1},
 {st:'wait',coil:'CRH0402D',spec:'1.15×4',kg:11890,cut:'57×20, 35×2',tm:t('내일 이월 가능','may roll to tomorrow'),late:1,s:1},
 {st:'wait',coil:'CRF0509B',spec:'1.15×4',kg:11250,cut:'57×20, 35×2',tm:t('내일 이월 가능','may roll to tomorrow'),late:1,s:1}
];
var jf='all';
function renderList(){
 var rows=JOBS.map(function(j,i){return {j:j,i:i}}).filter(function(x){return jf==='all'||x.j.st===jf});
 var h='<div class="ph"><h2>'+t('작업 목록','Job list')+'</h2><span class="sub">2026-10-08 · '+t('슬리터2 · 그린ERP 작업지시서','Slitter 2 · Green ERP work orders')+'</span></div>'+
 '<div class="kp"><div class="k"><span>'+t('오늘 작업','Today')+'</span><b>'+t('14건','14')+'</b><small>156.6 t</small></div><div class="k"><span>'+t('진행 중','In progress')+'</span><b style="color:var(--ac)">'+t('1건','1')+'</b><small>10.7 t</small></div><div class="k"><span>'+t('완료','Done')+'</span><b>'+t('3건','3')+'</b><small>32.5 t</small></div><div class="k"><span>'+t('대기','Waiting')+'</span><b>'+t('10건','10')+'</b><small>113.5 t</small></div><div class="k" style="background:var(--wn2)"><span style="color:var(--wn)">'+t('17:40 마감 전망','Outlook at 17:40')+'</span><b style="color:var(--wn)">'+t('2건 완료','2 done')+'</b><small style="color:var(--wn)">'+t('대기 9건은 내일로','9 waiting go to tomorrow')+'</small></div></div>'+
 '<div class="chips" id="jchips">'+[['all',t('전체 14','All 14')],['run',t('진행 중 1','In progress 1')],['done',t('완료 3','Done 3')],['wait',t('대기 10','Waiting 10')]].map(function(c){return '<button type="button" data-f="'+c[0]+'" class="'+(jf===c[0]?'on':'')+'">'+c[1]+'</button>'}).join('')+'</div>'+
 '<div class="tw"><table><tr><th>'+t('순서','#')+'</th><th>'+t('상태','Status')+'</th><th>'+t('업체','Customer')+'</th><th>'+t('코일','Coil')+'</th><th>'+t('규격','Spec')+'</th><th>'+t('중량','Weight')+'</th><th>'+t('절단','Slit plan')+'</th><th>'+t('시간','Time')+'</th><th></th></tr>'+
 rows.map(function(x){var j=x.j,pl=j.st==='done'?pill('ok',t('완료','Done')):(j.st==='run'?pill('run',t('진행 중 41%','Running 41%')):pill('id',t('대기','Waiting')));
  var tm=j.late?'<span style="color:var(--wn);font-weight:700">'+j.tm+'</span>':j.tm;
  return '<tr class="go'+(j.st==='run'?' cur':'')+'" data-i="'+x.i+'"><td>'+(x.i+1)+'</td><td>'+pl+'</td><td>'+CO+'</td><td>'+j.coil+(j.s?'<span class="smp">'+SMP+'</span>':'')+'</td><td>'+j.spec+'</td><td>'+j.kg.toLocaleString()+' kg</td><td>'+j.cut+'</td><td>'+tm+'</td><td class="chev">'+(j.st==='wait'?'':'›')+'</td></tr>'}).join('')+'</table></div>';
 $('pgList').innerHTML=h;
 document.querySelectorAll('#jchips button').forEach(function(b){b.onclick=function(){jf=b.dataset.f;renderList()}});
 document.querySelectorAll('#pgList tr.go').forEach(function(r){r.onclick=function(){var j=JOBS[+r.dataset.i];if(j.st==='run')go('now');else if(j.st==='done')openDetail(j.coil==='2632001021'?0:(j.coil==='2612102121'?1:3))}});
}

/* ---------- 현재 작업 ---------- */
var N=49,cur=20,xs=[],Z=[197,196,195,204],dev=false,mode='ten',ch=null;
for(var q=0;q<=N;q++)xs.push(Math.round(q*1470/N));
function wob(i,k){return i===cur?0:((i*(3+k)+k*2)%7-3)*0.8}
var DS=[1.3,0.6,0.5,1.9];
function dv(i,k){return dev&&i>=10?(i-10)*DS[k]:0}

 h+='<div class="sec"><h3>'+t('현장 메모','Floor notes')+' <span>'+t('읽기 전용','Read-only')+'</span></h3><div style="font-size:18px;color:var(--sb)">'+(p.j==='wn'?t('정지 후 재가동 직후 텐션4가 올라감. 정지 분석 화면에서 원인 확인 필요.','Tension 4 rose right after restart. Check the cause in the stop analysis screen.'):t('특이사항 없음.','Nothing to note.'))+'</div></div>';
 h+='</div>';
 $('pgDetail').innerHTML=h;
 $('back').onclick=function(){go('past')};
 $('pv').onclick=function(){openDetail((i+PAST.length-1)%PAST.length)};$('nx').onclick=function(){openDetail((i+1)%PAST.length)};
 document.querySelectorAll('.jump button').forEach(function(b){b.onclick=function(){var el=$(b.dataset.j),sc=$('dsc');sc.scrollTo({top:el.offsetTop-52,behavior:'smooth'})}});
 showOnly('pgDetail','past');
 dcs.forEach(function(c){c.destroy()});dcs=[];
 var tick='#5c6478',grid='rgba(92,100,120,.16)',sc=function(yl,min,max){return {x:{title:{display:true,text:t('코일 길이 (m)','Coil length (m)'),color:tick,font:{size:12}},ticks:{maxTicksLimit:7,color:tick,font:{size:12}},grid:{display:false}},y:{min:min,max:max,title:{display:true,text:yl,color:tick,font:{size:12}},ticks:{color:tick,font:{size:12},maxTicksLimit:4},grid:{color:grid}}}};
 var base={responsive:true,maintainAspectRatio:false,animation:false,plugins:{legend:{display:false}}};
 var lo=g.len.map(function(l,x){return 182-x/n*8}),hi=g.len.map(function(l,x){return 214-x/n*8});

 for(k=0;k<4;k++)d1.push({data:g.t[k],borderColor:C.t[k],borderDash:DASH[k],borderWidth:2.2,pointRadius:0,tension:0.2});
 var mk=function(id,sets,yl,min,max){dcs.push(new Chart($(id),{type:'line',data:{labels:g.len,datasets:sets},options:{responsive:true,maintainAspectRatio:false,animation:false,plugins:{legend:{display:false}},scales:sc(yl,min,max)}}))};
 mk('d1',d1,t('텐션','Tension'),150,250);
 mk('d2',[{data:g.spd,borderColor:C.ac,borderWidth:2.2,pointRadius:0,tension:0.1}],t('속도','Speed'),0,200);
 mk('d3',[{data:g.unc,borderColor:'#5c6478',borderWidth:2.2,pointRadius:0},{data:g.rec,borderColor:'#d9622b',borderDash:[8,4],borderWidth:2.2,pointRadius:0}],'mm',400,1700);
 mk('d4',[{data:g.l1,borderColor:'#1f6fd1',borderWidth:2.2,pointRadius:0},{data:g.l2,borderColor:'#d6407f',borderDash:[8,4],borderWidth:2.2,pointRadius:0}],t('루프 값','Loop value'),0,110);
 mk('d5',[{data:g.un.map(function(v){return Math.abs(v)}),borderColor:'#5c6478',borderWidth:2,pointRadius:0},{data:g.r3,borderColor:'#1f6fd1',borderDash:[8,4],borderWidth:2,pointRadius:0},{data:g.sl,borderColor:'#d9622b',borderDash:[2,4],borderWidth:2,pointRadius:0},{data:g.rc,borderColor:'#7b5fd6',borderDash:[12,4,2,4],borderWidth:2,pointRadius:0}],t('PLC 값','PLC value'),0,1800);
 mk('d6',[{data:g.cur,borderColor:'#0a7a3d',borderWidth:2.2,pointRadius:0}],'A',0,16);
}

/* ---------- 이동 ---------- */
function showOnly(id,nav){
 ['pgList','pgNow','pgPast','pgDetail'].forEach(function(s){$(s).hidden=(s!==id)});
 document.querySelectorAll('#nav button').forEach(function(b){b.className=b.dataset.p===nav?'on':''});
}
function go(p){
 if(p==='list'){renderList();showOnly('pgList','list')}
 else if(p==='now'){showOnly('pgNow','now');renderNow()}
 else{renderPast();showOnly('pgPast','past')}
}
function fit(){var f=$('fit'),s=Math.min(1.2,f.clientWidth/1280);$('stage').style.transform='scale('+s+')';f.style.height=(800*s)+'px'}
renderShell();
document.querySelectorAll('#nav button').forEach(function(b){b.onclick=function(){go(b.dataset.p)}});
window.addEventListener('resize',fit);fit();
renderList();
if(location.hash==='#now')go('now');else if(location.hash==='#past')go('past');else if(location.hash==='#detail')openDetail(2);
</script>
