<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>레벨러 코일 품질</title>
<link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" rel="stylesheet">
<style>
  :root{--ink:#0f1e33;--sec:#44506a;--mut:#8a93a6;--line:#dfe4ee;--acc:#796cbf;--bg:#eef1fb;
    --ok:#1f9d57;--warn:#e07b1a;--bad:#d5331f;--surf:#d5331f;--flat:#e07b1a;--v2:#796cbf}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:Pretendard,system-ui,sans-serif;font-weight:800;background:var(--bg);color:var(--ink);padding:18px;max-width:1220px;margin:0 auto;-webkit-font-smoothing:antialiased;font-size:18px}
  .top{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;margin-bottom:8px}
  h1{font-size:30px;letter-spacing:-.5px}
  .datepick{display:flex;align-items:center;gap:10px;font-size:17px;color:var(--sec)}
  .datepick input{font-family:inherit;font-weight:800;font-size:18px;border:2px solid var(--line);border-radius:12px;padding:9px 13px;color:var(--ink)}
  .crumb{font-size:17px;color:var(--mut);font-weight:800;margin:6px 0}
  .crumb a{color:var(--acc);cursor:pointer}.crumb .sep{margin:0 9px;color:#c7cedb}
  .panel{background:#fff;border:2px solid var(--line);border-radius:20px;padding:20px 22px;margin-top:16px}
  h2{font-size:23px;margin-bottom:4px}
  .hint{font-size:15px;color:var(--mut);font-weight:700;margin-bottom:12px}
  .loading,.empty{color:var(--mut);font-size:19px;padding:34px;text-align:center}
  .view{display:none}.view.on{display:block}
  svg{display:block;width:100%;height:auto}
  .btn{display:inline-flex;align-items:center;gap:8px;background:var(--acc);color:#fff;border:none;border-radius:13px;padding:12px 18px;font-size:17px;font-weight:900;cursor:pointer;font-family:inherit}
  .btn.ghost{background:#f4f2fe;color:var(--acc);border:2px solid #ddd6f5}

  /* 작업 list */
  table{width:100%;border-collapse:collapse;font-size:17px}
  th{text-align:left;font-size:14px;color:var(--mut);font-weight:800;padding:11px 12px;border-bottom:2.5px solid var(--line);white-space:nowrap}
  td{padding:15px 12px;border-bottom:2px solid #eef1f7;font-weight:800;vertical-align:middle}
  tr.clk{cursor:pointer}tr.clk:hover td{background:#f6f4fe}
  .num{text-align:right;font-variant-numeric:tabular-nums}
  .seqn{width:40px;height:40px;border-radius:12px;background:#f1f3fb;display:inline-flex;align-items:center;justify-content:center;font-size:19px;font-weight:900;color:var(--sec)}
  .qbadge{display:inline-block;font-size:15px;font-weight:900;color:#fff;border-radius:10px;padding:4px 12px}
  .q-ok{background:var(--ok)}.q-warn{background:var(--warn)}.q-bad{background:var(--bad)}
  .run{display:inline-block;background:var(--ok);color:#fff;font-size:13px;font-weight:900;border-radius:8px;padding:2px 9px;margin-left:7px}

  /* 요약 */
  .sumgrid{display:grid;grid-template-columns:1.5fr 1fr 1fr 1fr;gap:14px}
  @media(max-width:860px){.sumgrid{grid-template-columns:1fr 1fr}}
  .scard{border:2px solid var(--line);border-radius:16px;padding:16px 18px;background:#fafbff}
  .scard .k{font-size:15px;color:var(--mut);font-weight:800}
  .scard .big{font-size:32px;font-weight:900;letter-spacing:-1px;margin-top:3px;line-height:1.05}
  .scard .sub{font-size:15px;color:var(--sec);font-weight:800;margin-top:4px}
  .verdict{display:inline-block;border-radius:12px;padding:6px 14px;font-size:23px;font-weight:900;color:#fff;margin-top:2px}

  /* 코일 지도 범례 */
  .legend{display:flex;gap:20px;flex-wrap:wrap;margin-top:12px;font-size:16px;font-weight:800;color:var(--sec)}
  .legend i{display:inline-block;width:16px;height:16px;border-radius:50%;margin-right:7px;vertical-align:-2px}
  .legend .tri{width:0;height:0;border-left:9px solid transparent;border-right:9px solid transparent;border-bottom:16px solid var(--flat);margin-right:7px;display:inline-block}
  .legend .dia{width:14px;height:14px;background:var(--v2);transform:rotate(45deg);display:inline-block;margin-right:9px;vertical-align:-2px}

  /* 박스별 영상 */
  .vids{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px}
  .vcard{border:2px solid var(--line);border-radius:16px;padding:14px;background:#fafbff}
  .vcard .vt{font-size:19px;font-weight:900;margin-bottom:9px}
  .vcard video{width:100%;border-radius:12px;background:#11151e;aspect-ratio:16/9}
  .vcard .vph{width:100%;aspect-ratio:16/9;border-radius:12px;background:#11151e;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;color:#cfd6e4}
  .camtoggle{display:flex;gap:8px;margin-top:10px}
  .camtoggle button{flex:1;border:2px solid var(--line);background:#fff;border-radius:11px;padding:10px;font-size:16px;font-weight:900;cursor:pointer;font-family:inherit;color:var(--sec)}
  .camtoggle button.on{border-color:var(--acc);background:#f4f2fe;color:var(--acc)}

  /* 박스별 보고서 */
  .rep{border:3px solid var(--line);border-radius:18px;padding:18px 20px;margin-top:14px}
  .rep .rh{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;margin-bottom:12px}
  .rep .rn{font-size:24px;font-weight:900}
  .rep .rgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px}
  .rep .ri{border:2px solid var(--line);border-radius:12px;padding:11px 13px;background:#fafbff}
  .rep .ri .k{font-size:14px;color:var(--mut);font-weight:800}
  .rep .ri .v{font-size:24px;font-weight:900;letter-spacing:-.5px;margin-top:2px}.rep .ri .v .u{font-size:14px;color:var(--mut)}
  .rep .rsum{font-size:17px;font-weight:800;color:var(--sec);line-height:1.6;margin-top:14px;background:#f6f7fc;border-radius:12px;padding:13px 16px}
  .rep .rsum b.bad{color:var(--bad)}.rep .rsum b.ok{color:var(--ok)}

  /* drawer */
  .scrim{position:fixed;inset:0;background:rgba(10,14,22,.45);display:none;z-index:50}.scrim.on{display:block}
  .drawer{position:fixed;top:0;right:0;bottom:0;width:560px;max-width:96vw;background:#fff;box-shadow:-12px 0 48px rgba(20,24,40,.25);transform:translateX(100%);transition:transform .24s;z-index:51;overflow-y:auto;padding:24px}
  .drawer.on{transform:translateX(0)}
  .drawer .x{position:absolute;top:18px;right:20px;font-size:34px;cursor:pointer;color:var(--mut);line-height:1}
  .dh{font-size:27px;font-weight:900;margin-bottom:3px;padding-right:40px}
  .dsub{font-size:17px;color:var(--mut);font-weight:800;margin-bottom:14px}
  .dbadge{display:inline-block;font-size:16px;font-weight:900;color:#fff;border-radius:10px;padding:4px 12px}
  .dimg{width:100%;aspect-ratio:4/3;border-radius:16px;background:#11151e;object-fit:cover;display:block;margin:14px 0}
  .dimg-ph{display:flex;align-items:center;justify-content:center;color:#6b7488;font-size:17px;font-weight:800}
  .playbtn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;border:none;background:var(--acc);color:#fff;border-radius:14px;padding:15px;font-size:19px;font-weight:900;cursor:pointer;font-family:inherit;margin-bottom:8px}
  .sect{font-size:18px;font-weight:900;margin:20px 0 8px;color:var(--sec)}
  .optiles{display:grid;grid-template-columns:1fr 1fr;gap:11px}
  .opt{border:2px solid var(--line);border-radius:14px;padding:13px 15px;background:#fafbff}
  .opt .k{font-size:15px;color:var(--mut);font-weight:800}
  .opt .v{font-size:26px;font-weight:900;letter-spacing:-.5px;margin-top:2px}.opt .v .u{font-size:15px;color:var(--mut)}
  .opt.hot{border-color:#f0bdb3;background:#fdf1ef}.opt.hot .v{color:var(--bad)}
  .wavebox{border:2px solid var(--line);border-radius:16px;background:#fbfcff;padding:14px;margin-top:6px}
  .wavetype{font-size:20px;font-weight:900;text-align:center;margin-bottom:4px}

  /* 현장 등록 불량 사진 */
  .fgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(205px,1fr));gap:14px;margin-top:4px}
  .fcard{border:2px solid var(--line);border-radius:16px;overflow:hidden;background:#fafbff;cursor:pointer;transition:border-color .15s}
  .fcard:hover{border-color:#0ea5a0}
  .fthumb{aspect-ratio:4/3;background:#11151e;display:flex;align-items:center;justify-content:center}
  .fthumb img{width:100%;height:100%;object-fit:cover;display:block}
  .fthumb.noimg::after{content:'사진 없음';color:#6b7488;font-size:15px;font-weight:800}
  .fmeta{padding:12px 14px}
  .ftype{font-size:18px;font-weight:900;color:#0e8f8a}
  .fsub{font-size:14px;color:var(--mut);font-weight:800;margin-top:2px}
  .fmemo{font-size:16px;color:var(--sec);font-weight:800;margin-top:7px}
  .fup{font-size:13px;color:var(--mut);font-weight:700;margin-top:6px}
  @media print{.top,.crumb,#pList,.novid,.btn{display:none}.panel{break-inside:avoid}}
</style>
</head>
<body>
<div class="top"><h1>레벨러 코일 품질</h1><div class="datepick">작업일 <input type="date" id="dpick"></div></div>
<div class="crumb" id="crumb"></div>

<!-- A. 작업 LIST -->
<div class="view on" id="vList"><div class="panel" id="pList"><div class="loading">불러오는 중…</div></div></div>

<!-- B. 코일 상세 -->
<div class="view" id="vCoil"><div id="pCoil"></div></div>

<div class="scrim" id="scrim" onclick="closeD()"></div>
<div class="drawer" id="drawer"><span class="x" onclick="closeD()">✕</span><div id="dContent"></div></div>

<script>
var API='https://mnlnbwcbgfgftdgawanh.supabase.co/functions/v1';
var STATUS=API+'/leveling-status', QUALITY=API+'/leveling-quality';
var IMG=function(id){return QUALITY+'?mode=img&id='+id;};
var LEVVID=function(seg,file){return QUALITY+'?mode=levvid&seg='+encodeURIComponent(seg)+'&file='+encodeURIComponent(file);};
var DEFECTIMG=API+'/defect-images';
var OCR_BASE='https://desktop-tdp9hrt.tail8d1b48.ts.net';
function fieldImg(fp){ fp=fp||''; return /^https?:\/\//.test(fp)?fp:OCR_BASE+'/img/'+fp+'/1.jpg'; }
var S={date:null,coil:null,list:null,detail:null,qual:null,coils:null,field:null};
function kstToday(){return new Date(Date.now()+9*3600000).toISOString().slice(0,10);}
function won(v){return v==null?'—':Number(v).toLocaleString();}
function show(v){['vList','vCoil'].forEach(function(id){document.getElementById(id).classList.toggle('on',id===v);});window.scrollTo(0,0);crumb(v);}
function crumb(v){document.getElementById('crumb').innerHTML=(v==='vCoil')?'<a onclick="show(\'vList\')">작업 목록</a><span class="sep">›</span><span>'+S.coil+'</span>':'';}

// ===== 작업 LIST =====
async function loadList(date){
  S.date=date; document.getElementById('dpick').value=date;
  document.getElementById('pList').innerHTML='<div class="loading">불러오는 중…</div>'; show('vList');
  var l; try{ l=await fetch(STATUS+'?mode=list&date='+date).then(r=>r.json()); }catch(e){ l={ok:false}; }
  if(!l||!l.ok){ document.getElementById('pList').innerHTML='<div class="empty">데이터를 불러오지 못했습니다.</div>'; return; }
  S.list=l;
  var rows=[]; if(l.running)rows.push(Object.assign({_run:true},l.running)); (l.done||[]).forEach(c=>rows.push(c));
  S.coils=rows;
  if(!rows.length){ document.getElementById('pList').innerHTML='<h2>레벨러 작업 목록</h2><div class="empty">이 날짜에 레벨링 작업이 없습니다. 날짜를 바꿔보세요.</div>'; return; }
  var html='<h2>레벨러 작업 목록</h2><div class="hint">작업을 누르면 코일 길이 지도·결함·영상·박스별 보고서를 봅니다</div><div style="overflow-x:auto"><table><thead><tr>'
    +'<th>순서</th><th>코일 / 거래처</th><th>가공 규격</th><th>시작</th><th>종료</th><th>소요</th><th class="num">단가</th><th class="num">비용(금액)</th><th>품질 결과</th>'
    +'</tr></thead><tbody>'+rows.map(function(c,i){ var qv=qVerdictLite(c);
      return '<tr class="clk" onclick="openCoil('+i+')"><td><span class="seqn">'+(i+1)+'</span></td>'
        +'<td><div style="font-size:19px;font-weight:900">'+c.coil+(c._run?'<span class="run">가동중</span>':'')+'</div><div style="font-size:14px;color:var(--mut)">'+(c.company||'')+'</div></td>'
        +'<td>'+(c.spec||'—')+'</td><td>'+(c.start||'—')+'</td><td>'+(c.end||'—')+'</td>'
        +'<td>'+(c.durMin!=null?Math.floor(c.durMin/60)+'시간 '+(c.durMin%60)+'분':'—')+'</td>'
        +'<td class="num">'+(c.unit==null?'—':c.unit+'<span style="font-size:13px;color:var(--mut)">원/kg</span>')+'</td>'
        +'<td class="num" style="font-size:19px">'+won(c.amount)+'</td>'
        +'<td><span class="qbadge '+qv.cls+'">'+qv.label+'</span> <span style="font-size:14px;color:var(--mut)">결함 '+((c.surf||0)+(c.flatDef||0))+'</span></td></tr>';
    }).join('')+'</tbody></table></div>';
  document.getElementById('pList').innerHTML=html;
}
function qVerdictLite(c){ var w=c.warpMax||0,def=(c.surf||0)+(c.flatDef||0); if(w>=40||def>=10)return{label:'불량',cls:'q-bad'}; if(w>=25||def>0)return{label:'주의',cls:'q-warn'}; return{label:'양호',cls:'q-ok'}; }

// ===== 코일 상세 =====
async function openCoil(i){
  var c=S.coils[i]; S.coil=c.coil;
  document.getElementById('pCoil').innerHTML='<div class="panel"><div class="loading">코일 데이터 불러오는 중…</div></div>'; show('vCoil');
  var d,q,s,f; try{ [d,q,s,f]=await Promise.all([
    fetch(STATUS+'?mode=detail&coil='+encodeURIComponent(c.coil)+'&date='+S.date).then(r=>r.json()),
    fetch(QUALITY+'?mode=coil&coil='+encodeURIComponent(c.coil)+'&date='+S.date).then(r=>r.json()),
    fetch(QUALITY+'?mode=segments&coil='+encodeURIComponent(c.coil)+'&date='+S.date).then(r=>r.json()).catch(()=>null),
    fetch(DEFECTIMG+'?mode=list&line='+encodeURIComponent('레벨링')+'&coil='+encodeURIComponent(c.coil)).then(r=>r.json()).catch(()=>null)
  ]); }catch(e){ d={ok:false}; }
  if(!d||!d.ok){ document.getElementById('pCoil').innerHTML='<div class="panel"><div class="empty">코일 데이터를 불러오지 못했습니다.</div></div>'; return; }
  S.detail=d; S.qual=(q&&q.ok)?q:{defects:[],boxes:[]}; S.qual.segs=(s&&s.ok)?s.segments:[];
  S.field=((f&&f.ok&&f.rows)||[]).filter(function(r){ return String(r.cap||'').slice(0,10)===S.date && (r.defect_type==='scratch'); });
  renderCoil();
}
function spmVerdict(d){ if(!d.baseSpm)return null; var avg=d.boxes.reduce((a,b)=>a+b.sheets,0)/Math.max(1,d.boxes.reduce((a,b)=>a+b.workMin,0)); var p=Math.round((avg/d.baseSpm-1)*100); return {p:p,label:p>=10?'빠름':p<=-10?'느림':'보통',cls:p>=10?'v':'',avg:avg,color:p>=10?'#1f9d57':p<=-10?'#d5331f':'#e07b1a'}; }
function qVerdict(d,q){ var w=(d.flat&&d.flat.warpMax)||0,def=q.total||0; if(w>=40||def>=10)return{label:'불량',c:'#d5331f'}; if(w>=25||def>0)return{label:'주의',c:'#e07b1a'}; return{label:'양호',c:'#1f9d57'}; }
function boxStat(b){ var w=b.warp||0,def=(b.flatDef||0)+(b.scratch||0); if(w>=40||def>=5)return{t:'불량',bg:'#d5331f',bd:'#f0bdb3',fill:'#fdf1ef'}; if(w>=25||def>0)return{t:'주의',bg:'#e07b1a',bd:'#f3d6ab',fill:'#fdf7ee'}; return{t:'양호',bg:'#1f9d57',bd:'#b3e3c7',fill:'#eefaf2'}; }

function renderCoil(){
  var d=S.detail,q=S.qual, sv=spmVerdict(d), qv=qVerdict(d,q);
  var h='<div class="panel"><div class="sumgrid">'
    +'<div class="scard"><div class="k">코일 / 거래처 / 규격</div><div class="big" style="font-size:25px">'+d.coil+'</div><div class="sub">'+(d.company||'')+' · '+(d.spec||'')+'</div></div>'
    +'<div class="scard"><div class="k">작업량 · 비용</div><div class="big">'+d.sheets+'<span style="font-size:17px">장</span></div><div class="sub">'+(d.amount?won(d.amount)+'원 · ':'')+(d.start||'')+'~'+(d.end||'')+'</div></div>'
    +'<div class="scard"><div class="k">작업 속도</div>'+(sv?'<span class="verdict" style="background:'+sv.color+'">'+sv.label+'</span><div class="sub">'+sv.avg.toFixed(1)+' 장/분 · 평소 '+d.baseSpm:'<div class="big" style="font-size:22px">—')+'</div></div>'
    +'<div class="scard"><div class="k">품질</div><span class="verdict" style="background:'+qv.c+'">'+qv.label+'</span><div class="sub">불량 '+(q.total||0)+'건 · 최대 휨 '+((d.flat&&d.flat.warpMax)||0)+'mm'+((S.field&&S.field.length)?' · <b style="color:#0e8f8a">현장 '+S.field.length+'건</b>':'')+'</div></div>'
    +'</div></div>';
  // 코일 지도 (위 표면 / 아래 평탄)
  h+='<div class="panel"><h2>코일 길이 지도</h2><div class="hint">코일을 펼친 그림 · 박스 구분 · <b style="color:var(--surf)">위쪽 = 표면 결함</b> / <b style="color:var(--flat)">아래쪽 = 평탄도 결함</b>. 결함을 누르면 이미지·정보를 봅니다.</div>'
    +'<div id="map"></div><div class="legend"><span><i style="background:var(--surf)"></i>표면(흠집) — 위</span><span><span class="tri"></span>평탄도 — 아래</span><span><span class="dia"></span>평탄도v2 — 아래</span>'
    +'<span><i style="background:#0ea5a0"></i>현장 등록(사진)</span>'
    +'<span style="margin-left:auto"><i style="background:#1f9d57"></i>양호 <i style="background:#e07b1a;margin-left:6px"></i>주의 <i style="background:#d5331f;margin-left:6px"></i>불량</span></div></div>';
  // 현장 등록 불량 사진
  h+=fieldPanel();
  // 박스별 영상
  h+='<div class="panel"><h2>박스별 영상 재생</h2><div class="hint">박스별 녹화 영상(평탄도 CAM2 / 흠집 CAM1). ▶ 눌러 재생.</div><div class="vids" id="vids"></div></div>';
  // 박스별 결과 보고서
  h+='<div class="panel"><div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px"><h2>박스별 결과 보고서</h2><button class="btn ghost" onclick="window.print()">🖨 보고서 인쇄</button></div><div id="reports"></div></div>';
  document.getElementById('pCoil').innerHTML=h;
  document.getElementById('map').innerHTML=mapSVG();
  document.getElementById('vids').innerHTML=videoCards();
  document.getElementById('reports').innerHTML=reports();
  prefetchImgs();
}
function prefetchImgs(){
  var defs=(S.qual.defects||[]).filter(d=>d.hasImg).sort((a,b)=>(b.score||0)-(a.score||0)).slice(0,8);
  var i=0; function next(){ if(i>=defs.length)return; var d=defs[i++]; var im=new Image(); im.onload=im.onerror=next; im.src=IMG(d.id); }
  next(); next();
}

// 길이 지도 (위 표면 / 아래 평탄)
function boxesForMap(){ var qb=S.qual.boxes&&S.qual.boxes.length?S.qual.boxes:null;
  if(qb) return qb.map(b=>({n:b.n,s1:b.s1,s2:b.s2})); var acc=0; return S.detail.boxes.map(b=>{var s1=acc+1;acc+=b.sheets;return {n:b.n,s1:s1,s2:acc};}); }
function totalSheets(){ var bs=boxesForMap(); return bs.length?bs[bs.length-1].s2:(S.detail.sheets||1); }
function mapSVG(){
  var d=S.detail, defs=S.qual.defects||[], bs=boxesForMap(), N=totalSheets();
  var W=1160,padL=14,padR=14,bw=W-padL-padR, barY=120, barH=56, topZone=108, botZone=108;
  var H=barY+barH+botZone+30;
  var x=function(sheet){return padL+bw*((sheet-0.5)/N);};
  var s='<svg viewBox="0 0 '+W+' '+H+'">';
  // zone labels
  s+='<text x="'+padL+'" y="24" font-size="17" font-weight="900" font-family="Pretendard" fill="#d5331f">▲ 표면(흠집) 결함</text>';
  s+='<text x="'+padL+'" y="'+(barY+barH+botZone-2)+'" font-size="17" font-weight="900" font-family="Pretendard" fill="#e07b1a">▼ 평탄도 결함</text>';
  // 박스 바
  bs.forEach(function(b){ var x1=padL+bw*((b.s1-1)/N),x2=padL+bw*(b.s2/N), db=S.detail.boxes.find(z=>z.n===b.n)||{}; var st=boxStat(db);
    s+='<rect x="'+x1+'" y="'+barY+'" width="'+(x2-x1-3)+'" height="'+barH+'" rx="11" fill="'+st.fill+'" stroke="'+st.bd+'" stroke-width="2.5"/>';
    s+='<text x="'+((x1+x2)/2)+'" y="'+(barY+25)+'" text-anchor="middle" font-size="21" font-weight="900" font-family="Pretendard" fill="'+st.bg+'">박스'+b.n+'</text>';
    s+='<text x="'+((x1+x2)/2)+'" y="'+(barY+46)+'" text-anchor="middle" font-size="15" font-weight="800" font-family="Pretendard" fill="#5c6478">'+(db.sheets||(b.s2-b.s1+1))+'장'+(db.warp?' · 휨'+db.warp:'')+'</text>'; });
  // 결함: 표면 위 / 평탄 아래 (여러개 겹침 방지 위해 세로로 약간 분산)
  var upCount={}, dnCount={};
  defs.forEach(function(dd){ if(dd.abs==null)return; var xx=x(dd.abs); var isSurf=(dd.cam!==2);
    if(isSurf){ var key=Math.round(xx/18); upCount[key]=(upCount[key]||0); var row=upCount[key]++; var yy=barY-12-row*20; if(yy<30)yy=30;
      s+='<circle cx="'+xx+'" cy="'+yy+'" r="9" fill="#d5331f" style="cursor:pointer" onclick="openDef('+dd.id+')"/>'
        +'<line x1="'+xx+'" y1="'+(yy+9)+'" x2="'+xx+'" y2="'+barY+'" stroke="#d5331f" stroke-width="1.5" opacity="0.3"/>'; }
    else { var key2=Math.round(xx/18); dnCount[key2]=(dnCount[key2]||0); var row2=dnCount[key2]++; var yy2=barY+barH+14+row2*20; var ym=barY+barH+botZone-14; if(yy2>ym)yy2=ym;
      if(dd.metric==='flatness_v2'){ s+='<rect x="'+(xx-8)+'" y="'+(yy2-8)+'" width="16" height="16" rx="2" transform="rotate(45 '+xx+' '+yy2+')" fill="#796cbf" style="cursor:pointer" onclick="openDef('+dd.id+')"/>'; }
      else { s+='<polygon points="'+xx+','+(yy2+10)+' '+(xx-10)+','+(yy2-9)+' '+(xx+10)+','+(yy2-9)+'" fill="#e07b1a" style="cursor:pointer" onclick="openDef('+dd.id+')"/>'; }
      s+='<line x1="'+xx+'" y1="'+(barY+barH)+'" x2="'+xx+'" y2="'+(yy2-9)+'" stroke="#e07b1a" stroke-width="1.5" opacity="0.3"/>'; } });
  // 현장 등록 불량(표면 사진) — 위쪽, 청록 📷 표식
  (S.field||[]).forEach(function(fd){ var bm=bs.find(function(b){return b.n===(fd.box||fd.plc_box);}); var sheet=bm?((bm.s1+bm.s2)/2):N/2; var xx=x(sheet);
    var key=Math.round(xx/18); upCount[key]=(upCount[key]||0); var row=upCount[key]++; var yy=barY-13-row*20; if(yy<26)yy=26;
    s+='<line x1="'+xx+'" y1="'+(yy+12)+'" x2="'+xx+'" y2="'+barY+'" stroke="#0ea5a0" stroke-width="1.5" opacity="0.35"/>';
    s+='<circle cx="'+xx+'" cy="'+yy+'" r="12" fill="#0ea5a0" stroke="#fff" stroke-width="3" style="cursor:pointer" onclick="openFieldDef('+fd.id+')"/>';
    s+='<text x="'+xx+'" y="'+(yy+5)+'" text-anchor="middle" font-size="13" font-family="Pretendard" style="pointer-events:none">📷</text>'; });
  // 축
  var lenM=d.boxes.reduce((a,b)=>a+(b.sheets*(b.cut||0)/1000),0);
  s+='<text x="'+padL+'" y="'+(H-5)+'" font-size="15" font-weight="800" font-family="Pretendard" fill="#8a93a6">1장 · 0m</text>';
  s+='<text x="'+(W-padR)+'" y="'+(H-5)+'" text-anchor="end" font-size="15" font-weight="800" font-family="Pretendard" fill="#8a93a6">'+N+'장 · '+Math.round(lenM)+'m</text>';
  s+='</svg>'; return s;
}

// 박스별 영상 — 큰 파일(수십분~2시간)은 프록시 임베드가 느려, 직접 단일 홉으로 새 창 재생
function segForBox(n){ var segs=S.qual.segs||[]; return segs.find(function(x){ return String(x.box_id).replace(/^0+/,'')===String(n) || Number(x.box_id)===n; })||segs[n-1]||null; }
function fsize(f){ return f&&f.sizeBytes?' ('+(f.sizeBytes/1048576|0)+'MB)':''; }
function videoCards(){
  return S.detail.boxes.map(function(b){ var seg=segForBox(b.n); var files=[]; if(seg){ try{files=JSON.parse(seg.files);}catch(e){} }
    var cam2=files.find(f=>f.camera===2), cam1=files.find(f=>f.camera===1);
    if(!seg||(!cam1&&!cam2)) return '<div class="vcard"><div class="vt">박스'+b.n+'</div><div class="vph novid">영상 없음</div></div>';
    var btns='';
    if(cam2) btns+='<button class="btn" style="width:100%;margin-bottom:9px" onclick="openVid(\''+seg.segment_id+'\',\''+cam2.name+'\')">▶ 평탄도 CAM2 영상 열기'+fsize(cam2)+'</button>';
    if(cam1) btns+='<button class="btn ghost" style="width:100%" onclick="openVid(\''+seg.segment_id+'\',\''+cam1.name+'\')">▶ 흠집 CAM1 영상 열기'+fsize(cam1)+'</button>';
    return '<div class="vcard"><div class="vt">박스'+b.n+' 영상 <span style="font-size:14px;color:var(--mut)">'+(seg.st||'')+'~'+(seg.en||'')+'</span></div>'+btns
      +'<div style="font-size:14px;color:var(--mut);font-weight:700;margin-top:9px">새 창에서 재생 · 대용량(수백 MB) 영상은 처음 로딩이 걸릴 수 있어요.</div></div>';
  }).join('');
}
function openVid(seg,file,sec){ var t=(sec!=null&&sec>0)?'#t='+Math.floor(sec):''; window.open(QUALITY+'?mode=levvid&redirect=1&seg='+encodeURIComponent(seg)+'&file='+encodeURIComponent(file)+t,'_blank'); }

// 박스별 보고서
function reports(){
  var d=S.detail, defs=S.qual.defects||[];
  return d.boxes.map(function(b){ var st=boxStat(b);
    var sv=d.baseSpm?Math.round((b.spm/d.baseSpm-1)*100):null;
    var bd=defs.filter(x=>x.box===b.n); var v2=bd.filter(x=>x.metric==='flatness_v2').length;
    var lenM=Math.round(b.sheets*(b.cut||0)/1000);
    var sum='이 박스는 <b>'+b.sheets+'장</b>('+lenM+'m)을 '+(b.workMin)+'분간 '+b.spm+'장/분'
      +(sv!=null?' (평소 '+d.baseSpm+' 대비 <b class="'+(sv>=0?'ok':'bad')+'">'+(sv>=0?sv+'% 빠름':Math.abs(sv)+'% 느림')+'</b>)':'')+'으로 가공했습니다. ';
    if((b.warp||0)>=25||b.flatDef||b.scratch){ sum+='품질은 <b class="bad">'+st.t+'</b> — 최대 휨 '+(b.warp||0)+'mm, 평탄 결함 '+(b.flatDef||0)+'건'+(v2?'(v2 '+v2+')':'')+', 흠집 '+(b.scratch||0)+'건. '; if(b.tension!=null&&d.baseTension&&b.tension<d.baseTension*0.8)sum+='이 구간 텐션이 '+b.tension+'%로 낮았습니다. '; }
    else sum+='품질은 <b class="ok">양호</b> — 기준 내였습니다. ';
    return '<div class="rep" style="border-color:'+st.bd+'"><div class="rh"><span class="rn">박스 '+b.n+' 결과</span><span class="qbadge" style="background:'+st.bg+'">'+st.t+'</span></div>'
      +'<div class="rgrid">'
      +ri('절단 장수',b.sheets,'장')+ri('길이',lenM,'m')+ri('최대 휨',(b.warp!=null?b.warp:0),'mm',(b.warp||0)>=25)
      +ri('평탄 결함',b.flatDef||0,'건',b.flatDef>0)+ri('흠집',b.scratch||0,'건',b.scratch>0)
      +ri('속도',b.spm,'장/분')+ri('사이클',b.cycle,'초/장')+ri('부하율',b.load!=null?b.load:'—','%')+ri('텐션',b.tension!=null?b.tension:'—','%')
      +'</div><div class="rsum">'+sum+'</div></div>';
  }).join('');
}
function ri(k,v,u,hot){ return '<div class="ri"'+(hot?' style="border-color:#f0bdb3;background:#fdf1ef"':'')+'><div class="k">'+k+'</div><div class="v"'+(hot?' style="color:#d5331f"':'')+'>'+v+'<span class="u"> '+u+'</span></div></div>'; }

// ===== 불량 상세 =====
var METLB={anomaly_score:['흠집검사','#d5331f'],max_warp_mm:['평탄도검사','#e07b1a'],flatness_v2:['평탄도 v2','#796cbf']};
function openDef(id){
  var dd=(S.qual.defects||[]).find(x=>x.id===id); if(!dd)return;
  var box=S.detail.boxes.find(b=>b.n===dd.box)||{}; var ml=METLB[dd.metric]||['결함','#d5331f'];
  var posM=dd.abs!=null?Math.round((box.cut||2500)*dd.abs/1000):null;
  var h='<div class="dh">'+ml[0]+'</div><div class="dsub">박스 '+(dd.box||'?')+' · '+(dd.abs!=null?dd.abs+'번째 장':'')+(posM!=null?' · 약 '+posM+'m 지점':'')+'</div>'
    +'<span class="dbadge" style="background:'+ml[1]+'">'+(dd.at||'')+'</span>';
  h+=dd.hasImg?'<div class="dimg dimg-ph" id="dimgph">⏳ 이미지 불러오는 중…</div><img src="'+IMG(dd.id)+'" class="dimg" style="display:none" onload="this.style.display=\'block\';var p=document.getElementById(\'dimgph\');p&&p.remove();" onerror="var p=document.getElementById(\'dimgph\');p&&(p.textContent=\'이미지 없음\');this.remove();">':'<div class="dimg dimg-ph">이미지 없음</div>';
  if(dd.seg) h+='<button class="playbtn" onclick="playSeg(\''+dd.seg+'\','+dd.cam+','+(dd.vms||0)+')">▶ 이 구간 영상 보기 (결함 지점)</button>';
  if(dd.cam===2 && dd.edge){ h+='<div class="sect">철판이 어떻게 굽었나 (단면)</div><div class="wavebox">'+waveType(dd.edge)+waveSVG(dd.edge)+'</div>'; }
  else { h+='<div class="sect">측정값</div><div class="opt"><div class="k">'+(dd.cam===2?'휨/지표':'이상점수')+'</div><div class="v" style="color:#d5331f">'+(dd.cam===2?(dd.warp!=null?dd.warp+'mm':(dd.score!=null?dd.score:'—')):(dd.score!=null?dd.score:'—'))+'</div></div>'; }
  h+='<div class="sect">이 작업 당시 운영 상태 <span style="font-size:14px;color:#8a93a6">(박스'+(dd.box||'?')+' 구간)</span></div><div class="optiles">'
    +opt('절단 속도',box.spm!=null?box.spm:'—','장/분')+opt('사이클',box.cycle!=null?box.cycle:'—','초/장')
    +opt('부하율',box.load!=null?box.load:'—','%')+opt('텐션',box.tension!=null?box.tension:'—','%',box.tension!=null&&S.detail.baseTension&&box.tension<S.detail.baseTension*0.7)
    +opt('절단 설정장',box.cut!=null?box.cut:'—','mm')+opt('최대 휨(박스)',box.warp!=null?box.warp:'—','mm',box.warp>=25)
    +'</div>';
  document.getElementById('dContent').innerHTML=h;
  document.getElementById('drawer').classList.add('on'); document.getElementById('scrim').classList.add('on');
}
function opt(k,v,u,hot){return '<div class="opt'+(hot?' hot':'')+'"><div class="k">'+k+'</div><div class="v">'+v+'<span class="u"> '+u+'</span></div></div>';}
function closeD(){ document.getElementById('drawer').classList.remove('on'); document.getElementById('scrim').classList.remove('on'); }

// ===== 현장 등록 불량(표면 사진) =====
function fieldPanel(){
  var fs=S.field||[]; if(!fs.length)return '';
  var cards=fs.map(function(fd){ var box=fd.box||fd.plc_box||'?';
    return '<div class="fcard" onclick="openFieldDef('+fd.id+')">'
      +'<div class="fthumb"><img src="'+fieldImg(fd.file_path)+'" loading="lazy" onerror="this.parentNode.classList.add(\'noimg\');this.remove();"></div>'
      +'<div class="fmeta"><div class="ftype">표면 스크래치</div><div class="fsub">박스 '+box+' · '+(fd.cap||'').slice(11)+'</div>'
      +'<div class="fmemo">'+(fd.memo||'')+'</div><div class="fup">📷 '+(fd.uploader||'현장')+' 등록</div></div></div>';
  }).join('');
  return '<div class="panel"><div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px"><h2>현장 등록 불량 (사진)</h2><span class="qbadge q-bad">표면 '+fs.length+'건</span></div>'
    +'<div class="hint">현장에서 휴대폰으로 올린 <b>표면 스크래치</b> 사진입니다. 카드를 누르면 사진·위치·당시 운영을 봅니다. 지도 위 <b style="color:#0ea5a0">📷 청록 표식</b>과 같은 불량입니다.</div>'
    +'<div class="fgrid">'+cards+'</div></div>';
}
function openFieldDef(id){
  var fd=(S.field||[]).find(function(x){return x.id===id;}); if(!fd)return;
  var bn=fd.box||fd.plc_box; var box=S.detail.boxes.find(function(b){return b.n===bn;})||{};
  var h='<div class="dh">표면 스크래치 <span style="font-size:16px;color:#0e8f8a">· 현장 등록</span></div>'
    +'<div class="dsub">박스 '+(bn||'?')+' · '+(fd.cap||'')+(fd.cut_len?' · 절단 '+fd.cut_len+'mm':'')+'</div>'
    +'<span class="dbadge" style="background:#0ea5a0">📷 '+(fd.uploader||'현장')+' 등록 사진</span>';
  h+='<div class="dimg dimg-ph" id="fimgph">⏳ 사진 불러오는 중…</div><img src="'+fieldImg(fd.file_path)+'" class="dimg" style="display:none" onload="this.style.display=\'block\';var p=document.getElementById(\'fimgph\');p&&p.remove();" onerror="var p=document.getElementById(\'fimgph\');p&&(p.textContent=\'사진 없음\');this.remove();">';
  if(fd.memo) h+='<div class="sect">현장 메모</div><div class="opt"><div class="v" style="font-size:21px;color:var(--ink)">'+fd.memo+'</div></div>';
  h+='<div class="sect">이 작업 당시 운영 상태 <span style="font-size:14px;color:#8a93a6">(박스'+(bn||'?')+' 구간)</span></div><div class="optiles">'
    +opt('절단 속도',box.spm!=null?box.spm:'—','장/분')+opt('사이클',box.cycle!=null?box.cycle:'—','초/장')
    +opt('부하율',box.load!=null?box.load:'—','%')+opt('텐션',box.tension!=null?box.tension:'—','%',box.tension!=null&&S.detail.baseTension&&box.tension<S.detail.baseTension*0.7)
    +opt('절단 설정장',box.cut!=null?box.cut:'—','mm')+opt('최대 휨(박스)',box.warp!=null?box.warp:'—','mm',box.warp>=25)
    +'</div>';
  document.getElementById('dContent').innerHTML=h;
  document.getElementById('drawer').classList.add('on'); document.getElementById('scrim').classList.add('on');
}
function waveType(e){ var el=e[0],ce=e[1],er=e[2],tilt=Math.abs(er-el),label;
  if(tilt>=8)label='좌우 기울기 (한쪽으로 쏠림)'; else if(ce<=el&&ce<=er&&(el-ce>1||er-ce>1))label='센터 버클 (가운데가 내려감)';
  else if(ce>=el&&ce>=er&&(ce-el>1||ce-er>1))label='센터 솟음 (가운데가 올라옴)'; else label='엣지 웨이브 (가장자리 물결)';
  return '<div class="wavetype">'+label+'</div>'; }
function waveSVG(e){
  var W=500,H=300,padX=70,baseY=H*0.42, maxAbs=Math.max(Math.abs(e[0]),Math.abs(e[1]),Math.abs(e[2]),2.5), sc=Math.min(16,(baseY-34)/maxAbs);
  var pts=[[padX,e[0]],[W/2,e[1]],[W-padX,e[2]]]; var Y=function(v){return baseY-v*sc;}; var clampY=function(y){return Math.max(22,Math.min(H-10,y));};
  var p='M'+pts[0][0]+','+Y(pts[0][1])+' C'+(pts[0][0]+70)+','+Y(pts[0][1])+' '+(W/2-70)+','+Y(pts[1][1])+' '+(W/2)+','+Y(pts[1][1])+' C'+(W/2+70)+','+Y(pts[1][1])+' '+(W-padX-70)+','+Y(pts[2][1])+' '+(W-padX)+','+Y(pts[2][1]);
  var band=18, s='<svg viewBox="0 0 '+W+' '+H+'">';
  s+='<line x1="30" y1="'+baseY+'" x2="'+(W-30)+'" y2="'+baseY+'" stroke="#c7cedb" stroke-width="2.5" stroke-dasharray="8 7"/>';
  s+='<text x="30" y="22" font-size="14" font-weight="800" font-family="Pretendard" fill="#aeb6c4">┈ 평탄 기준선 (굽지 않은 상태)</text>';
  s+='<path d="'+p+' L'+(W-padX)+','+(Y(pts[2][1])+band)+' C'+(W-padX-70)+','+(Y(pts[2][1])+band)+' '+(W/2+70)+','+(Y(pts[1][1])+band)+' '+(W/2)+','+(Y(pts[1][1])+band)+' C'+(W/2-70)+','+(Y(pts[1][1])+band)+' '+(pts[0][0]+70)+','+(Y(pts[0][1])+band)+' '+pts[0][0]+','+(Y(pts[0][1])+band)+' Z" fill="#b6c0d6"/>';
  s+='<path d="'+p+'" fill="none" stroke="#5a6b86" stroke-width="3.5"/>';
  var lab=['좌','중','우'];
  pts.forEach(function(pt,i){ var up=pt[1]>=0,c=up?'#e07b1a':'#3f6fd1';
    s+='<line x1="'+pt[0]+'" y1="'+baseY+'" x2="'+pt[0]+'" y2="'+Y(pt[1])+'" stroke="'+c+'" stroke-width="5" stroke-linecap="round" opacity="0.85"/>';
    s+='<circle cx="'+pt[0]+'" cy="'+Y(pt[1])+'" r="8" fill="#fff" stroke="'+c+'" stroke-width="3.5"/>';
    s+='<text x="'+pt[0]+'" y="'+clampY(up?Y(pt[1])-14:Y(pt[1])+band+28)+'" text-anchor="middle" font-size="22" font-weight="900" font-family="Pretendard" fill="'+c+'">'+(pt[1]>0?'+':'')+pt[1]+'</text>';
    s+='<text x="'+pt[0]+'" y="'+(H-10)+'" text-anchor="middle" font-size="17" font-weight="800" font-family="Pretendard" fill="#8a93a6">'+lab[i]+'</text>'; });
  s+='</svg>'; return s; }
function playSeg(seg,cam,vms){ var segs=S.qual.segs||[]; var sg=segs.find(x=>x.segment_id===seg); if(!sg){alert('영상 정보를 찾지 못했습니다.');return;}
  var files=[]; try{files=JSON.parse(sg.files);}catch(e){} var f=files.find(x=>x.camera===cam)||files[0]; if(!f){alert('영상 파일이 없습니다.');return;}
  openVid(seg,f.name, vms?vms/1000:0); }

document.getElementById('dpick').addEventListener('change',e=>{ if(e.target.value)loadList(e.target.value); });
document.addEventListener('keydown',e=>{ if(e.key==='Escape')closeD(); });
loadList(kstToday());
