<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>레벨링 통합 타임라인</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
  * { box-sizing: border-box; }
  html, body { margin:0; min-height:100%; background:#eef1f6; font-family:"Pretendard",system-ui,sans-serif; -webkit-text-size-adjust:100%; }
  body { display:flex; justify-content:center; padding:16px; }
  #app { width:100%; max-width:720px; }

  .real-note {
    display:flex; gap:8px; align-items:flex-start; background:#e6f1fb; border:1px solid #b5d4f4;
    border-radius:12px; padding:10px 14px; font-size:12.5px; color:#185fa5; line-height:1.5; margin-bottom:12px;
  }
  .unsure-note {
    display:flex; gap:8px; align-items:flex-start; background:#fff6ea; border:1px solid #fdecd6;
    border-radius:12px; padding:10px 14px; font-size:12px; color:#c46b06; line-height:1.5; margin-bottom:6px;
  }

  .card { background:#fff; border:1px solid #e3e8f0; border-radius:18px; padding:18px; box-shadow:0 1px 2px rgba(10,21,36,0.06); margin-bottom:12px; }
  .header-title { font-size:18px; font-weight:800; color:#0f1e33; margin:0 0 2px; }
  .header-sub { font-size:12px; color:#7d8ba1; margin:0 0 14px; }

  .filter-row { display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
  .date-input, .coil-select {
    font-family:"Pretendard",system-ui,sans-serif; font-weight:700; font-size:14px; color:#0f1e33;
    background:#eef1f6; border:1.5px solid #e3e8f0; border-radius:10px; padding:8px 12px;
  }
  .coil-select { flex:1; min-width:160px; }
  .window-note { font-size:11.5px; color:#7d8ba1; margin-left:auto; }

  .status-msg { font-size:14px; color:#7d8ba1; padding:14px 2px; }

  table.job-table { width:100%; border-collapse:collapse; font-size:12.5px; margin-top:12px; }
  table.job-table th {
    text-align:left; padding:8px 6px; color:#7d8ba1; font-weight:700; border-bottom:1.5px solid #e3e8f0;
    white-space:nowrap;
  }
  table.job-table th.sortable { cursor:pointer; user-select:none; }
  table.job-table th.sortable .sort-arrow { font-size:10px; margin-left:3px; }
  table.job-table td { padding:8px 6px; border-bottom:1px solid #eef1f6; color:#0f1e33; font-weight:600; }
  table.job-table tbody tr { cursor:pointer; }
  table.job-table tbody tr:hover { background:#f5f7fb; }
  table.job-table tbody tr.selected { background:#e6f1fb; }
  table.job-table tbody tr.selected td { color:#0c447c; font-weight:800; }
  .job-status-chip { font-size:11px; font-weight:800; padding:2px 8px; border-radius:999px; background:#eef1f6; color:#4d5c72; }
  .job-status-chip.run { background:#e2f5ea; color:#1c7a4d; }
  .job-status-chip.done { background:#e6eef8; color:#185fa5; }

  .loadmore-btn {
    display:block; width:100%; text-align:center; background:#eef1f6; border:1.5px dashed #c9d3e0;
    border-radius:10px; padding:9px; font-size:12.5px; font-weight:700; color:#4d5c72; margin-top:10px;
    font-family:inherit; cursor:pointer;
  }
  .loadmore-btn:disabled { opacity:0.5; cursor:default; }

  .summary-strip { display:flex; align-items:center; gap:10px; flex-wrap:wrap; background:#eef1f6; border-radius:12px; padding:10px 14px; margin-bottom:4px; }
  .strip-name { font-size:15px; font-weight:800; color:#0f1e33; }
  .badge { font-size:11.5px; font-weight:800; padding:3px 10px; border-radius:999px; background:#e6eef8; color:#185fa5; }
  .badge.done { background:#e2f5ea; color:#1c7a4d; }
  .strip-sub { font-size:12px; color:#7d8ba1; }
  .strip-status { margin-left:auto; }

  .section-title { font-size:13px; font-weight:800; color:#4d5c72; margin:18px 0 10px; display:flex; align-items:center; gap:6px; }
  .section-title:first-child { margin-top:0; }

  .gantt-row { display:flex; gap:3px; margin-bottom:6px; }
  .gantt-seg { border-radius:8px; padding:8px 6px; text-align:center; min-width:36px; }
  .gantt-seg.ok { background:#e2f5ea; }
  .gantt-seg.warn { background:#fff2df; border:1.5px solid #fdecd6; }
  .gantt-box-idx { font-size:12px; font-weight:800; margin:0; }
  .gantt-seg.ok .gantt-box-idx, .gantt-seg.ok .gantt-time { color:#1c7a4d; }
  .gantt-seg.warn .gantt-box-idx, .gantt-seg.warn .gantt-time { color:#a3610a; }
  .gantt-time { font-size:9.5px; margin:2px 0 0; }
  .gantt-axis { display:flex; justify-content:space-between; margin-bottom:14px; }
  .gantt-axis span { font-size:11px; color:#7d8ba1; }

  .gauge-row { display:grid; grid-template-columns:repeat(3, minmax(0,1fr)); gap:12px; margin-bottom:14px; }
  .gauge-cell { display:flex; flex-direction:column; align-items:center; }
  .gauge-label { font-size:11.5px; color:#7d8ba1; margin:6px 0 0; text-align:center; }

  .chip-row { display:flex; gap:8px; flex-wrap:wrap; }
  .chip { font-size:12px; background:#eef1f6; padding:6px 10px; border-radius:10px; color:#0f1e33; }
  .chip b { font-weight:800; }

  table.anomaly-table { width:100%; border-collapse:collapse; font-size:12.5px; }
  table.anomaly-table th { text-align:left; padding:6px 4px; color:#7d8ba1; font-weight:700; border-bottom:1px solid #e3e8f0; }
  table.anomaly-table td { padding:6px 4px; border-bottom:1px solid #eef1f6; color:#0f1e33; font-weight:700; }

  .chart-wrap { background:#eef1f6; border-radius:14px; padding:12px 12px 6px; margin-bottom:6px; }
  .chart-caption { font-size:11px; color:#7d8ba1; text-align:center; margin:6px 0 2px; }
  .legend { display:flex; gap:14px; align-items:center; justify-content:center; font-size:11px; color:#4d5c72; margin:4px 0 10px; flex-wrap:wrap; }
  .legend-dot { width:9px; height:9px; border-radius:50%; display:inline-block; margin-right:5px; }
  .legend-dash { width:14px; height:2px; display:inline-block; margin-right:5px; vertical-align:middle; }

  .back-btn {
    display:inline-flex; align-items:center; gap:6px; background:#fff; border:1px solid #e3e8f0;
    border-radius:10px; padding:9px 16px; font-size:13px; font-weight:700; color:#4d5c72; margin-bottom:12px; font-family:inherit;
  }
</style>
</head>
<body>
<div id="app"></div>

<script>
/* leveler-explore Edge Function 실데이터 사용. 인증 헤더 불필요(공개 함수). */
const FN_URL = "https://mnlnbwcbgfgftdgawanh.supabase.co/functions/v1/leveler-explore";

function todayKST(){
  const now = new Date();
  return new Date(now.getTime() + 9*3600000).toISOString().slice(0, 10);
}
function num(v){ const n = parseFloat(v); return Number.isFinite(n) ? n : 0; }
function fmtHM(ts){
  if (!ts) return '-';
  // leveler-explore가 돌려주는 ts는 이미 "UTC로 잘못 태깅된 KST 숫자"라 +9h를 더 더하면 안 됩니다(이중 보정 버그, 2026-08-21 수정).
  const d = new Date(ts);
  return String(d.getUTCHours()).padStart(2,'0') + ':' + String(d.getUTCMinutes()).padStart(2,'0');
}
function fmtHMS(ts){
  if (!ts) return '-';
  // leveler-explore가 돌려주는 ts는 이미 "UTC로 잘못 태깅된 KST 숫자"라 +9h를 더 더하면 안 됩니다(이중 보정 버그, 2026-08-21 수정).
  const d = new Date(ts);
  return String(d.getUTCHours()).padStart(2,'0') + ':' + String(d.getUTCMinutes()).padStart(2,'0') + ':' + String(d.getUTCSeconds()).padStart(2,'0');
}

async function getJson(params){
  try {
    const res = await fetch(`${FN_URL}?${params}`);
    const json = await res.json();
    if (!json.ok) throw new Error(json.error || 'unknown error');
    return json;
  } catch (err) {
    console.error('leveler-explore 조회 실패:', err);
    return null;
  }
}

let selectedDate = todayKST();
let selectedCoil = null;

// --- 작업 목록(여러 날짜 통합, 날짜순 정렬 가능) 상태 ---
const WINDOW_DAYS = 14;
let endDate = todayKST();      // 목록 조회 기준일(최신 쪽 끝)
let loadedThroughDate = null;  // 지금까지 불러온 가장 오래된 날짜(더 보기 기준)
let jobs = [];                 // {coil_id, company_name, specification, status, update_time, work_date}
let sortAsc = false;           // 날짜 정렬 방향(기본 최신순)

function addDaysKST(dateStr, delta){
  const d = new Date(dateStr + 'T00:00:00Z');
  d.setUTCDate(d.getUTCDate() + delta);
  return d.toISOString().slice(0, 10);
}
function parseThicknessMm(spec){
  if (!spec) return null;
  const raw = String(spec).split(/x/i)[0];
  const n = parseFloat(raw);
  return Number.isFinite(n) ? n : null;
}
function jobKey(j){ return `${j.work_date}__${j.coil_id}`; }

function sampleEvenly(arr, maxPoints){
  if (arr.length <= maxPoints) return arr;
  const step = arr.length / maxPoints;
  const out = [];
  for (let i = 0; i < maxPoints; i++) out.push(arr[Math.floor(i*step)]);
  return out;
}

function lineChartSvg(points, series, min, max){
  const w = 620, h = 130, pad = 8;
  if (points.length < 2 || max <= min) return `<div class="status-msg">그래프를 그릴 데이터가 부족합니다.</div>`;
  const xs = points.map((p,i) => pad + (i/(points.length-1))*(w-pad*2));
  const paths = series.map(s => {
    const ys = points.map(p => h - pad - ((s.get(p)-min)/(max-min))*(h-pad*2));
    const dash = s.dash ? ` stroke-dasharray="${s.dash}"` : '';
    const d = xs.map((x,i) => `${i===0?'M':'L'}${x.toFixed(1)},${ys[i].toFixed(1)}`).join(' ');
    return `<path d="${d}" fill="none" stroke="${s.color}" stroke-width="2.5"${dash} stroke-linejoin="round" stroke-linecap="round"></path>`;
  }).join('');
  return `<svg viewBox="0 0 ${w} ${h}" style="width:100%;height:${h}px;display:block">${paths}</svg>`;
}

function donutGauge(pct, color, label){
  const r = 30, c = 2*Math.PI*r;
  const clamped = Math.max(0, Math.min(100, pct));
  const dash = (clamped/100)*c;
  return `
    <div class="gauge-cell">
      <svg viewBox="0 0 80 80" width="80" height="80">
        <circle cx="40" cy="40" r="${r}" fill="none" stroke="#e3e8f0" stroke-width="8"></circle>
        <circle cx="40" cy="40" r="${r}" fill="none" stroke="${color}" stroke-width="8" stroke-linecap="round"
          stroke-dasharray="${dash.toFixed(1)} ${c.toFixed(1)}" transform="rotate(-90 40 40)"></circle>
        <text x="40" y="45" text-anchor="middle" font-size="15" font-weight="800" fill="#0f1e33">${Number.isFinite(pct) ? pct.toFixed(1) : '-'}%</text>
      </svg>
      <p class="gauge-label">${label}</p>
    </div>`;
}

async function renderList(){
  const app = document.getElementById('app');
  app.innerHTML = `
    <div class="real-note">📡 leveler-explore 실측 데이터를 그대로 보여줍니다 (샘플 아님). 텐션(DTC-3100) 값은 카메라 미배포로 아직 이 화면에 없습니다.</div>
    <div class="card">
      <p class="header-title">레벨링 통합 타임라인</p>
      <p class="header-sub">작업지시서 · 박스별 진행 · PLC 실측을 한 화면에서 시간순으로 봅니다.</p>
      <div class="filter-row">
        <span style="font-size:12.5px; color:#4d5c72; font-weight:700;">기준일</span>
        <input type="date" class="date-input" id="datePick" value="${endDate}">
        <span class="window-note" id="windowNote"></span>
      </div>
      <div id="jobTableWrap"><div class="status-msg">불러오는 중…</div></div>
      <button class="loadmore-btn" id="loadMoreBtn" style="display:none;">이전 ${WINDOW_DAYS}일 더 보기</button>
    </div>
    <div class="card"><div id="bodyWrap"><div class="status-msg">작업을 선택하면 상세 정보가 표시됩니다.</div></div></div>
  `;
  document.getElementById('datePick').addEventListener('change', (e) => {
    endDate = e.target.value || todayKST();
    jobs = [];
    loadedThroughDate = null;
    selectedCoil = null;
    selectedDate = null;
    document.getElementById('bodyWrap').innerHTML = `<div class="status-msg">작업을 선택하면 상세 정보가 표시됩니다.</div>`;
    loadWindow(false);
  });
  document.getElementById('loadMoreBtn').addEventListener('click', () => loadWindow(true));

  await loadWindow(false);
}

async function loadWindow(append){
  const loadMoreBtn = document.getElementById('loadMoreBtn');
  const jobTableWrap = document.getElementById('jobTableWrap');
  if (loadMoreBtn){ loadMoreBtn.disabled = true; loadMoreBtn.textContent = '불러오는 중…'; }
  if (!append) jobTableWrap.innerHTML = `<div class="status-msg">불러오는 중…</div>`;

  const rangeEnd = append ? addDaysKST(loadedThroughDate, -1) : endDate;
  const dates = [];
  for (let i = 0; i < WINDOW_DAYS; i++) dates.push(addDaysKST(rangeEnd, -i));
  loadedThroughDate = dates[dates.length - 1];

  const results = await Promise.all(dates.map(d =>
    getJson(`leveling_stroke_overview=${d}`).then(o => ((o && o.coils) || []).map(c => ({
      coil_id: c.product_name, company_name: c.company_name, specification: c.specification,
      status: c.status, update_time: c.update_time, work_date: d,
    })))
  ));

  const seen = new Set(jobs.map(jobKey));
  results.flat().forEach(j => {
    const k = jobKey(j);
    if (!seen.has(k)){ jobs.push(j); seen.add(k); }
  });

  const windowNote = document.getElementById('windowNote');
  if (windowNote) windowNote.textContent = `${loadedThroughDate} ~ ${endDate} (${jobs.length}건)`;
  if (loadMoreBtn){ loadMoreBtn.disabled = false; loadMoreBtn.textContent = `이전 ${WINDOW_DAYS}일 더 보기`; loadMoreBtn.style.display = jobs.length ? 'block' : 'none'; }

  renderJobTable();

  if (!append && !selectedCoil && jobs.length){
    selectJob(jobs[0]);
  }
}

function renderJobTable(){
  const jobTableWrap = document.getElementById('jobTableWrap');
  if (!jobs.length){
    jobTableWrap.innerHTML = `<div class="status-msg">이 기간에는 레벨링 작업 기록이 없습니다.</div>`;
    return;
  }
  const sorted = jobs.slice().sort((a, b) => {
    const ka = `${a.work_date} ${a.update_time || ''}`, kb = `${b.work_date} ${b.update_time || ''}`;
    return sortAsc ? ka.localeCompare(kb) : kb.localeCompare(ka);
  });
  const arrow = sortAsc ? '▲' : '▼';
  jobTableWrap.innerHTML = `
    <table class="job-table">
      <thead><tr>
        <th class="sortable" id="sortDateTh">날짜 <span class="sort-arrow">${arrow}</span></th>
        <th>거래처명</th>
        <th>코일 ID</th>
        <th>가공규격</th>
        <th>두께</th>
        <th>상태</th>
      </tr></thead>
      <tbody>
        ${sorted.map(j => {
          const thick = parseThicknessMm(j.specification);
          const isSel = selectedCoil === j.coil_id && selectedDate === j.work_date;
          const statusCls = j.status === '완료' ? 'done' : (j.status ? 'run' : '');
          return `<tr class="${isSel ? 'selected' : ''}" data-coil="${j.coil_id}" data-date="${j.work_date}">
            <td>${j.work_date}</td>
            <td>${j.company_name || '-'}</td>
            <td>${j.coil_id}</td>
            <td>${j.specification || '-'}</td>
            <td>${thick !== null ? thick + 'mm' : '-'}</td>
            <td><span class="job-status-chip ${statusCls}">${j.status || '-'}</span></td>
          </tr>`;
        }).join('')}
      </tbody>
    </table>
  `;
  document.getElementById('sortDateTh').addEventListener('click', () => {
    sortAsc = !sortAsc;
    renderJobTable();
  });
  Array.prototype.forEach.call(jobTableWrap.querySelectorAll('tbody tr'), tr => {
    tr.addEventListener('click', () => {
      const coilId = tr.getAttribute('data-coil');
      const workDate = tr.getAttribute('data-date');
      const job = jobs.find(j => j.coil_id === coilId && j.work_date === workDate);
      if (job) selectJob(job);
    });
  });
}

function selectJob(job){
  selectedCoil = job.coil_id;
  selectedDate = job.work_date;
  renderJobTable();
  renderDetail(job.coil_id);
}

async function renderDetail(coilId){
  selectedCoil = coilId;
  const bodyWrap = document.getElementById('bodyWrap');
  bodyWrap.innerHTML = `<div class="status-msg">불러오는 중…</div>`;

  const coilData = await getJson(`leveling_coil_id=${encodeURIComponent(coilId)}&leveling_work_date=${selectedDate}`);
  if (!coilData){
    bodyWrap.innerHTML = `<div class="status-msg">작업 데이터를 불러오지 못했습니다.</div>`;
    return;
  }
  const erp = coilData.erp || {};
  const overall = coilData.overall || {};
  const boxSummaries = coilData.boxes || [];

  // 박스별 상세(설정값·행정·원시로그) 병렬 조회
  const boxDetails = await Promise.all(boxSummaries.map(b =>
    getJson(`leveling_stroke_detail=${encodeURIComponent(coilId)}&leveling_work_date=${selectedDate}&box_idx=${b.box_idx}`)
  ));

  let allStrokes = [];
  let allRaw = [];
  let spec = null;
  boxDetails.forEach(d => {
    if (!d) return;
    if (!spec && d.spec) spec = d.spec;
    (d.strokes || []).forEach(s => allStrokes.push(s));
    (d.raw_log || []).forEach(r => allRaw.push(r));
  });
  allStrokes.sort((a,b) => new Date(a.timestamp) - new Date(b.timestamp));
  allRaw.sort((a,b) => new Date(a.TIMESTAMP) - new Date(b.TIMESTAMP));

  const cycletms = allStrokes.map(s => num(s.cycletm)).filter(v => v > 0);
  const meanCycle = cycletms.length ? cycletms.reduce((a,b)=>a+b,0)/cycletms.length : 0;
  const variance = cycletms.length ? cycletms.reduce((a,b)=>a+(b-meanCycle)*(b-meanCycle),0)/cycletms.length : 0;
  const cvPct = meanCycle ? (Math.sqrt(variance)/meanCycle*100) : 0;
  const utilizationPct = overall.cnt ? (num(overall.run_cnt)/num(overall.cnt)*100) : 0;
  const avgLoad = num(overall.avg_load);
  const anomalies = allStrokes.filter(s => s.is_anomaly);

  // 박스별 간트: 기간 비율로 폭 계산, 코일 전체 평균 대비 사이클타임 15% 이상 높으면 경고
  const overallAvgCycle = num(overall.avg_cycle) || meanCycle || 1;
  const ganttBoxes = boxSummaries.filter(b => b.start_ts && b.end_ts);
  const spans = ganttBoxes.map(b => Math.max(1, (new Date(b.end_ts) - new Date(b.start_ts))/60000));
  const totalSpan = spans.reduce((a,b)=>a+b,0) || 1;

  const strokeSample = sampleEvenly(allStrokes, 150);
  const cycleVals = strokeSample.map(s => num(s.cycletm));
  const rawSample = sampleEvenly(allRaw, 150);
  const speedVals = rawSample.map(r => num(r.SPEEDPPS));
  const speedSetVals = rawSample.map(r => num(r.CUTSPEED));

  const thicknessMm = parseThicknessMm(erp.specification);
  bodyWrap.innerHTML = `
    <div class="summary-strip">
      <span class="strip-name">${erp.company_name || '-'}</span>
      <span class="badge">${erp.specification || '-'}</span>
      <span class="badge">두께 ${thicknessMm !== null ? thicknessMm + 'mm' : '-'}</span>
      <span class="strip-sub">${coilId} · 투입 ${num(erp.used_weight).toLocaleString()}kg / 발주 ${num(erp.original_weight).toLocaleString()}kg</span>
      <span class="badge ${erp.status === '완료' ? 'done' : ''} strip-status">${erp.status || '-'}</span>
    </div>
    <p class="chart-caption" style="text-align:left; margin:8px 2px 0;">코일 ID <b>${coilId}</b> · 작업일 <b>${erp.work_date || selectedDate}</b> · 시작 ${fmtHM(erp.started_at || overall.start_ts)} · 최근 갱신 ${fmtHM(erp.update_time || overall.end_ts)} · 총 ${boxSummaries.length}개 박스</p>

    <div class="section-title">📦 박스별 진행 타임라인</div>
    ${ganttBoxes.length ? `
      <div class="gantt-row">
        ${ganttBoxes.map((b, i) => {
          const warn = num(b.avg_cycle) > overallAvgCycle * 1.15;
          const flexW = Math.round((spans[i]/totalSpan)*1000);
          return `<div class="gantt-seg ${warn ? 'warn' : 'ok'}" style="flex:${flexW}">
            <p class="gantt-box-idx">#${b.box_idx}${warn ? ' ⚠️' : ''}</p>
            <p class="gantt-time">${fmtHM(b.start_ts)}–${fmtHM(b.end_ts)}</p>
          </div>`;
        }).join('')}
      </div>
      <div class="gantt-axis"><span>${fmtHM(ganttBoxes[0].start_ts)} 작업 시작</span><span>${fmtHM(ganttBoxes[ganttBoxes.length-1].end_ts)} 최근</span></div>
      <p class="chart-caption" style="text-align:left; margin:-8px 2px 14px;">주황: 해당 박스 평균 사이클타임이 코일 전체 평균보다 15% 이상 높음(참고용 기준)</p>
    ` : `<div class="status-msg">박스 구간 정보가 없습니다.</div>`}

    <div class="section-title">📈 코일 요약 지표</div>
    <div class="gauge-row">
      ${donutGauge(utilizationPct, '#639922', '가동률 (RUN 비율)')}
      ${donutGauge(cvPct, '#378ADD', '변동계수(CV)')}
      ${donutGauge(avgLoad, '#EF9F27', '평균 부하(load)')}
    </div>

    ${spec ? `
    <div class="section-title">⚙️ PLC 설정값</div>
    <div class="chip-row">
      <span class="chip">절단길이설정 <b>${num(spec.cutlenset).toLocaleString()}mm</b></span>
      <span class="chip">절단길이보정 <b>${num(spec.cutlencorr)}mm</b></span>
      <span class="chip">저속길이설정 <b>${num(spec.slowlenset).toLocaleString()}mm</b></span>
      <span class="chip">가속시간 <b>${spec.acctm ?? '-'}s</b></span>
      <span class="chip">감속시간 <b>${spec.dectm ?? '-'}s</b></span>
      <span class="chip">인버터속도계수 <b>${spec.inverterspeedcoeff ?? '-'}</b></span>
      <span class="chip">총 행정수 <b>${(spec.stroke_count ?? allStrokes.length).toLocaleString()}</b></span>
    </div>` : ''}

    <div class="section-title">⏱️ 사이클타임 (전체 박스, 시간순)</div>
    <div class="chart-wrap">${lineChartSvg(strokeSample, [{ get: s => num(s.cycletm), color: '#3672b0' }], 0, Math.max(...cycleVals, 1)*1.15)}</div>
    <div class="chart-caption">박스가 바뀌어도 이어서 시간순으로 표시합니다. 값이 튀면 이상 신호일 수 있습니다.</div>

    <div class="section-title">🚀 속도</div>
    <div class="unsure-note">⚠️ SPEEDPPS 필드의 실제 단위를 아직 확정하지 못했습니다. 실기 화면 녹화로 검증 중입니다.</div>
    <div class="chart-wrap">${lineChartSvg(rawSample, [{ get: r=>num(r.SPEEDPPS), color:'#e8830f' }, { get: r=>num(r.CUTSPEED), color:'#968ae0', dash:'5,4' }], 0, Math.max(...speedVals, ...speedSetVals, 1)*1.15)}</div>
    <div class="legend"><span><span class="legend-dot" style="background:#e8830f"></span>실측(SPEEDPPS, 단위 확인중)</span><span><span class="legend-dash" style="background:#968ae0"></span>설정(CUTSPEED)</span></div>

    <div class="section-title">🧪 텐션 (DTC-3100)</div>
    <div class="unsure-note">📷 아직 카메라가 거치되지 않아 텐션 데이터가 이 코일에 연동되어 있지 않습니다. 배포 후 이 자리에 실측 그래프가 표시됩니다.</div>

    ${anomalies.length ? `
    <div class="section-title">⚠️ 이상 행정 목록 (${anomalies.length}건)</div>
    <table class="anomaly-table">
      <thead><tr><th>시각</th><th>박스</th><th style="text-align:right">1행정시간</th></tr></thead>
      <tbody>
        ${anomalies.slice(0, 15).map(a => `<tr><td>${fmtHMS(a.timestamp)}</td><td>#${a.box_idx}</td><td style="text-align:right">${num(a.cycletm)}s</td></tr>`).join('')}
      </tbody>
    </table>
    ${anomalies.length > 15 ? `<p class="chart-caption">외 ${anomalies.length - 15}건 더 있음</p>` : ''}
    ` : ''}
  `;
}

renderList();
</script>
</body>
</html>
